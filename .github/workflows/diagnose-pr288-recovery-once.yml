name: Diagnose PR 288 durable recovery once

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-pr288-recovery-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.number == 288 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/249-durable-restart-e2e
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Assert recovered server state before browser join
        shell: python
        run: |
          from pathlib import Path
          path = Path('workbench-screenshot-tests/src/test/java/org/hammer/audio/workbench/screenshot/WorkbenchDurableRestartIT.java')
          text = path.read_text()
          old = '''        Page page = actor.page();
                  open(second, page);
                  joinSession(page);
                  waitForRevision(page, 1);
          '''
          new = '''        Page page = actor.page();
                  open(second, page);
                  Map<String, Object> recoveredMetadata = inspectSession(page);
                  assertEquals(
                      1,
                      number(recoveredMetadata, "revision"),
                      "Recovered server session revision before browser join");
                  assertTrue(
                      projectionNodeIds(sessionProjection(page)).contains(NODE_ID),
                      "Recovered server projection must contain the durable node before browser join");
                  joinSession(page);
                  waitForRevision(page, 1);
          '''
          if old not in text:
              raise SystemExit('second-process join block not found')
          text = text.replace(old, new, 1)
          marker = '''  @SuppressWarnings("unchecked")
            private static List<Map<String, Object>> checkpointHistory(Page page) {
          '''
          addition = '''  @SuppressWarnings("unchecked")
            private static Map<String, Object> inspectSession(Page page) {
              return (Map<String, Object>)
                  page.evaluate(
                      """
                      async sessionId => await (
                        await fetch(`/workflow/sessions/${encodeURIComponent(sessionId)}`)
                      ).json()
                      """,
                      SESSION_ID);
            }

            @SuppressWarnings("unchecked")
            private static Map<String, Object> sessionProjection(Page page) {
              return (Map<String, Object>)
                  page.evaluate(
                      """
                      async sessionId => await (
                        await fetch(`/workflow/sessions/${encodeURIComponent(sessionId)}/projection`)
                      ).json()
                      """,
                      SESSION_ID);
            }

            @SuppressWarnings("unchecked")
            private static List<Map<String, Object>> checkpointHistory(Page page) {
          '''
          if marker not in text:
              raise SystemExit('checkpointHistory insertion marker not found')
          path.write_text(text.replace(marker, addition, 1))
      - name: Format and commit diagnostics before runtime verification
        run: |
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests spotless:apply
          rm .github/workflows/diagnose-pr288-recovery-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: distinguish server recovery from browser activation"
          git push origin HEAD:feature/249-durable-restart-e2e
      - name: Build packaged browser reactor
        run: mvn -B -Pscreenshot-tests -DskipTests install -pl workbench-screenshot-tests -am
      - name: Install Playwright Chromium
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"
      - name: Run durable process restart scenario
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          -Dit.test=WorkbenchDurableRestartIT verify
      - name: Upload durable Failsafe reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-288-recovery-diagnostics
          path: workbench-screenshot-tests/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 30

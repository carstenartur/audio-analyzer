name: Diagnose issue 269 frontend

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    if: github.head_ref == 'feature/269-production-react-flow-frontend'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify frontend module and retain complete log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mvn -B -pl audio-web-editor -am clean verify --file pom.xml > issue-269-frontend.log 2>&1
          status=$?
          tail -n 300 issue-269-frontend.log
          exit $status

      - name: Upload complete frontend log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-269-frontend-log
          path: issue-269-frontend.log
          if-no-files-found: error
          retention-days: 1

name: Debug Spring Boot 4 build

on:
  push:
    branches:
      - feature/241-collaboration-session-api

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/241-collaboration-session-api
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Capture Maven verify diagnostics
        run: |
          mvn -B verify > spring-boot-4-build.log 2>&1 || true
          tail -n 350 spring-boot-4-build.log > spring-boot-4-diagnostics.txt
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add spring-boot-4-diagnostics.txt
          git commit -m 'Capture Spring Boot 4 build diagnostics'
          git push origin HEAD:feature/241-collaboration-session-api

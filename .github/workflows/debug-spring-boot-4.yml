name: Debug Spring Boot 4 build

on:
  push:
    branches:
      - feature/241-collaboration-session-api

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Capture Maven verify diagnostics
        run: mvn -B verify > spring-boot-4-build.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        with:
          name: spring-boot-4-build-log
          path: spring-boot-4-build.log

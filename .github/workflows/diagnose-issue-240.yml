name: Diagnose issue 240 Maven gate

on:
  push:
    branches:
      - feature/240-hibernate-jgit-persistence

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Run complete Maven gate
        id: verify
        shell: bash
        run: |
          set +e
          mvn -B clean verify --file pom.xml 2>&1 | tee /tmp/issue-240-maven.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Maven log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-240-complete-maven-log
          path: /tmp/issue-240-maven.log
          if-no-files-found: error
          retention-days: 3

      - name: Preserve Maven gate result
        if: steps.verify.outputs.status != '0'
        run: exit 1

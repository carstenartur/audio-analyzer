name: Fix PR 288 H2 durability once

on:
  pull_request:
    paths:
      - '.github/workflows/fix-pr288-h2-durability-once.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 288 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/249-durable-restart-e2e
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make file-backed H2 commits synchronously durable
        shell: python
        run: |
          from pathlib import Path
          path = Path('workbench-screenshot-tests/src/test/java/org/hammer/audio/workbench/screenshot/WorkbenchContainerFactory.java')
          text = path.read_text()
          old = 'jdbc:h2:file:/data/audio-analyzer;AUTO_SERVER=FALSE'
          new = 'jdbc:h2:file:/data/audio-analyzer;AUTO_SERVER=FALSE;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0'
          if old not in text:
              raise SystemExit('durable H2 URL not found')
          path.write_text(text.replace(old, new, 1))
      - name: Format and commit durability configuration
        run: |
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests spotless:apply
          rm .github/workflows/fix-pr288-h2-durability-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: force synchronous H2 writes for restart E2E"
          git push origin HEAD:feature/249-durable-restart-e2e
      - name: Build packaged browser reactor
        run: mvn -B -Pscreenshot-tests -DskipTests install -pl workbench-screenshot-tests -am
      - name: Install Playwright Chromium
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"
      - name: Run durable process restart scenario
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          -Dit.test=WorkbenchDurableRestartIT verify
      - name: Upload durable Failsafe reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-288-h2-durability-results
          path: workbench-screenshot-tests/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 30

name: Fix PR 287 session restore race once

on:
  pull_request:
    paths:
      - '.github/workflows/fix-pr287-session-restore-race-once.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 287 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/249-two-browser-collaboration-e2e
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Keep legacy projection loads below active session authority
        shell: python
        run: |
          from pathlib import Path
          path = Path('audio-web-editor/src/WorkflowEditorApp.tsx')
          text = path.read_text()
          text = text.replace(
              '  const previouslyActive = useRef(false);\n',
              '  const previouslyActive = useRef(false);\n  const sessionActiveRef = useRef(false);\n',
              1,
          )
          marker = '''  const collaboration = useWorkflowSession({
              onProjection: applyProjection,
              onError: setError,
              onStatus: setStatus,
            });

            const canEdit =
          '''
          replacement = '''  const collaboration = useWorkflowSession({
              onProjection: applyProjection,
              onError: setError,
              onStatus: setStatus,
            });
            sessionActiveRef.current = collaboration.active;

            const canEdit =
          '''
          if marker not in text:
              raise SystemExit('collaboration activation marker not found')
          text = text.replace(marker, replacement, 1)
          old = '''  const refreshProjection = useCallback(async () => {
              try {
                applyProjection(await getJson<WorkflowProjection>('/workflow/projection'));
              } catch (failure) {
                setError(failureMessage(failure));
              }
            }, [applyProjection]);
          '''
          new = '''  const refreshProjection = useCallback(async () => {
              try {
                const legacyProjection = await getJson<WorkflowProjection>('/workflow/projection');
                if (!sessionActiveRef.current) {
                  applyProjection(legacyProjection);
                }
              } catch (failure) {
                setError(failureMessage(failure));
              }
            }, [applyProjection]);
          '''
          if old not in text:
              raise SystemExit('legacy projection refresh block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Verify frontend production build
        run: mvn -B -pl audio-web-editor -am -DskipTests package
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/fix-pr287-session-restore-race-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audio-web-editor/src/WorkflowEditorApp.tsx .github/workflows/fix-pr287-session-restore-race-once.yml
          git commit -m "fix: preserve restored session projection over legacy seed"
          git push origin HEAD:feature/249-two-browser-collaboration-e2e

      - name: Document indexed history vertical slice
        run: |
          cat > docs/features/workflow-history-search.md <<'MD'
          # Workflow history search

          Audio Analyzer now has two complementary history-query paths:

          - `WorkflowHistorySearch` in `audio-core` performs exact semantic node and parameter queries over bounded authoritative snapshots;
          - `IndexedWorkflowHistorySearch` uses the released `jgit-storage-hibernate-search` projection for repeated full-text queries over commit messages, changed paths and changed `workflow.dsl` content.

          Every indexed result contains the exact commit identifier and can therefore be loaded through `VersionedWorkflowStore.loadAtCommit` or the existing `/workflow/load` command.

          ```text
          checkpoint -> Hibernate-backed JGit commit/ref update
                     -> best-effort CommitIndexer upsert

          query      -> GitHistorySearchService / Lucene projection
                     -> framework-neutral WorkflowHistoryTextResult
                     -> exact CommitId -> authoritative workflow snapshot
          ```

          Git remains authoritative. A projection failure never invalidates a successful checkpoint. The explicit rebuild operation traverses commits reachable from a selected branch and restores missing rows idempotently.

          Core, Search and collaboration mappings use the same application-managed `SessionFactory`. Startup migrations run in this order:

          1. `jgit-storage-hibernate-core`;
          2. `jgit-storage-hibernate-search`;
          3. Audio Analyzer collaboration migrations;
          4. Hibernate schema validation.

          HTTP contracts:

          ```text
          GET  /workflow/history/index?q=<text>&limit=<count>
          POST /workflow/history/index/rebuild?branch=main&limit=-1
          ```

          No JGit, Hibernate Search, Lucene or Hibernate type appears in `audio-core` or in the HTTP response. Structured compound filters, workflow-semantic indexed fields and the production search panel remain subsequent parts of issue #247.
          MD


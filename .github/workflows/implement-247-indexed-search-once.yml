name: Implement issue 247 indexed search once

on:
  pull_request:
    paths:
      - '.github/workflows/implement-247-indexed-search-once.yml'

permissions:
  contents: write
  packages: read

jobs:
  implement:
    if: github.head_ref == 'feature/247-workflow-history-search' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/247-workflow-history-search
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Add shared search dependency and entity registration
        shell: python
        run: |
          from pathlib import Path
          import re

          pom = Path('audio-app/pom.xml')
          text = pom.read_text()
          pattern = re.compile(
              r'(\s*<dependency>\s*<groupId>io\.github\.carstenartur</groupId>\s*'
              r'<artifactId>jgit-storage-hibernate-core</artifactId>\s*'
              r'<version>\$\{jgit-storage-hibernate\.version\}</version>\s*</dependency>)')
          match = pattern.search(text)
          if not match:
              raise SystemExit('core dependency block not found')
          search_dependency = '''
              <dependency>
                <groupId>io.github.carstenartur</groupId>
                <artifactId>jgit-storage-hibernate-search</artifactId>
                <version>${jgit-storage-hibernate.version}</version>
              </dependency>'''
          pom.write_text(text[:match.end()] + search_dependency + text[match.end():])

          Path('audio-app/src/main/java/org/hammer/audio/app/WorkflowSearchPersistenceConfiguration.java').write_text('''package org.hammer.audio.app;

import io.github.carstenartur.jgit.storage.hibernate.search.SearchEntities;
import org.springframework.boot.autoconfigure.condition.ConditionalOnProperty;
import org.springframework.context.annotation.Bean;
import org.springframework.context.annotation.Configuration;

/** Registers shared Git-history search projections in the application persistence context. */
@Configuration
@ConditionalOnProperty(name = "workbench.persistence.mode", havingValue = "hibernate")
public class WorkflowSearchPersistenceConfiguration {

  /** Contributes generic search entities to the one application-managed SessionFactory. */
  @Bean
  public WorkflowPersistenceEntityContributor workflowSearchPersistenceEntities() {
    return SearchEntities::annotatedClasses;
  }
}
''')

      - name: Configure search backend and concrete store bean
        shell: python
        run: |
          from pathlib import Path
          path = Path('audio-app/src/main/java/org/hammer/audio/app/WorkflowPersistenceConfiguration.java')
          text = path.read_text()
          marker = '    properties.setProperty("hibernate.format_sql", "false");\n'
          if marker not in text:
              raise SystemExit('Hibernate property marker not found')
          addition = marker + '''    properties.setProperty("hibernate.search.backend.type", "lucene");
              properties.setProperty(
                  "hibernate.search.backend.directory.type",
                  environment.getProperty("workbench.history-search.directory-type", "local-heap"));
              String searchDirectoryRoot =
                  environment.getProperty("workbench.history-search.directory-root");
              if (searchDirectoryRoot != null && !searchDirectoryRoot.isBlank()) {
                properties.setProperty(
                    "hibernate.search.backend.directory.root", searchDirectoryRoot.trim());
              }
          '''
          text = text.replace(marker, addition, 1)
          old = 'public VersionedWorkflowStore hibernateVersionedWorkflowStore('
          if old not in text:
              raise SystemExit('Hibernate store bean signature not found')
          text = text.replace(
              old,
              'public HibernateJGitVersionedWorkflowStore hibernateVersionedWorkflowStore(',
              1)
          path.write_text(text)

      - name: Add Core Search Collaboration migration ordering
        shell: python
        run: |
          from pathlib import Path

          Path('audio-app/src/main/java/org/hammer/audio/infrastructure/workflow/collaboration/schema/WorkflowSchemaMigrationResult.java').write_text('''package org.hammer.audio.infrastructure.workflow.collaboration.schema;

import java.util.Objects;

/** Outcome and startup invariant for ordered workflow schema migrations. */
public record WorkflowSchemaMigrationResult(
    boolean applied,
    int coreMigrationsExecuted,
    int searchMigrationsExecuted,
    int collaborationMigrationsExecuted) {

  public WorkflowSchemaMigrationResult {
    if (coreMigrationsExecuted < 0) {
      throw new IllegalArgumentException("coreMigrationsExecuted must be >= 0");
    }
    if (searchMigrationsExecuted < 0) {
      throw new IllegalArgumentException("searchMigrationsExecuted must be >= 0");
    }
    if (collaborationMigrationsExecuted < 0) {
      throw new IllegalArgumentException("collaborationMigrationsExecuted must be >= 0");
    }
  }

  /** Returns a marker for an explicitly disabled migration phase. */
  public static WorkflowSchemaMigrationResult skipped() {
    return new WorkflowSchemaMigrationResult(false, 0, 0, 0);
  }

  /** Prevents Hibernate DDL mutation after versioned migrations have run. */
  public void requireValidateSchemaAction(String schemaAction) {
    String requiredSchemaAction = Objects.requireNonNull(schemaAction, "schemaAction").trim();
    if (applied && !"validate".equalsIgnoreCase(requiredSchemaAction)) {
      throw new IllegalStateException(
          "Versioned workflow migrations require workbench.persistence.schema-action=validate");
    }
  }
}
''')

          Path('audio-app/src/main/java/org/hammer/audio/infrastructure/workflow/collaboration/schema/WorkflowSchemaMigrator.java').write_text('''package org.hammer.audio.infrastructure.workflow.collaboration.schema;

import io.github.carstenartur.jgit.storage.hibernate.schema.CoreSchemaMigrations;
import io.github.carstenartur.jgit.storage.hibernate.search.schema.SearchSchemaMigrations;
import java.sql.Connection;
import java.sql.SQLException;
import java.util.Locale;
import java.util.Objects;
import javax.sql.DataSource;
import org.flywaydb.core.Flyway;
import org.flywaydb.core.api.configuration.FluentConfiguration;

/** Applies shared Core and Search migrations before Audio Analyzer collaboration migrations. */
public final class WorkflowSchemaMigrator {

  private final DataSource dataSource;

  /** Creates an ordered migrator over the shared application data source. */
  public WorkflowSchemaMigrator(DataSource dataSource) {
    this.dataSource = Objects.requireNonNull(dataSource, "dataSource");
  }

  /** Migrates generic Core, generic Search and application collaboration state in that order. */
  public WorkflowSchemaMigrationResult migrate(
      boolean adoptLegacyCoreSchema,
      boolean adoptLegacySearchSchema,
      boolean adoptPreLeaseCollaborationSchema) {
    DatabaseFamily family = detectDatabaseFamily();
    int core = migrateCore(family, adoptLegacyCoreSchema);
    int search = migrateSearch(family, adoptLegacySearchSchema);
    int collaboration = migrateCollaboration(family, adoptPreLeaseCollaborationSchema);
    return new WorkflowSchemaMigrationResult(true, core, search, collaboration);
  }

  private int migrateCore(DatabaseFamily family, boolean legacy) {
    FluentConfiguration configuration =
        Flyway.configure()
            .dataSource(dataSource)
            .locations(family.coreLocation)
            .table(CoreSchemaMigrations.SCHEMA_HISTORY_TABLE)
            .baselineOnMigrate(true);
    baseline(
        configuration,
        legacy,
        CoreSchemaMigrations.LEGACY_SCHEMA_VERSION,
        CoreSchemaMigrations.LEGACY_BASELINE_DESCRIPTION,
        CoreSchemaMigrations.PRE_MIGRATION_BASELINE_VERSION,
        CoreSchemaMigrations.PRE_MIGRATION_BASELINE_DESCRIPTION);
    return configuration.load().migrate().migrationsExecuted;
  }

  private int migrateSearch(DatabaseFamily family, boolean legacy) {
    FluentConfiguration configuration =
        Flyway.configure()
            .dataSource(dataSource)
            .locations(family.searchLocation)
            .table(SearchSchemaMigrations.SCHEMA_HISTORY_TABLE)
            .baselineOnMigrate(true);
    baseline(
        configuration,
        legacy,
        SearchSchemaMigrations.LEGACY_SCHEMA_VERSION,
        SearchSchemaMigrations.LEGACY_BASELINE_DESCRIPTION,
        SearchSchemaMigrations.PRE_MIGRATION_BASELINE_VERSION,
        SearchSchemaMigrations.PRE_MIGRATION_BASELINE_DESCRIPTION);
    return configuration.load().migrate().migrationsExecuted;
  }

  private int migrateCollaboration(DatabaseFamily family, boolean legacy) {
    FluentConfiguration configuration =
        Flyway.configure()
            .dataSource(dataSource)
            .locations(family.collaborationLocation)
            .table(CollaborationSchemaMigrations.SCHEMA_HISTORY_TABLE)
            .baselineOnMigrate(true);
    baseline(
        configuration,
        legacy,
        CollaborationSchemaMigrations.PRE_LEASE_SCHEMA_VERSION,
        CollaborationSchemaMigrations.PRE_LEASE_BASELINE_DESCRIPTION,
        CollaborationSchemaMigrations.PRE_MIGRATION_BASELINE_VERSION,
        CollaborationSchemaMigrations.PRE_MIGRATION_BASELINE_DESCRIPTION);
    return configuration.load().migrate().migrationsExecuted;
  }

  private static void baseline(
      FluentConfiguration configuration,
      boolean legacy,
      String legacyVersion,
      String legacyDescription,
      String initialVersion,
      String initialDescription) {
    if (legacy) {
      configuration.baselineVersion(legacyVersion).baselineDescription(legacyDescription);
    } else {
      configuration.baselineVersion(initialVersion).baselineDescription(initialDescription);
    }
  }

  private DatabaseFamily detectDatabaseFamily() {
    try (Connection connection = dataSource.getConnection()) {
      String product =
          connection.getMetaData().getDatabaseProductName().toLowerCase(Locale.ROOT);
      if (product.contains("h2")) {
        return DatabaseFamily.H2;
      }
      if (product.contains("postgresql")) {
        return DatabaseFamily.POSTGRESQL;
      }
      throw new IllegalStateException(
          "Unsupported workflow migration database: "
              + connection.getMetaData().getDatabaseProductName());
    } catch (SQLException failure) {
      throw new IllegalStateException("Cannot inspect workflow migration database", failure);
    }
  }

  private enum DatabaseFamily {
    H2(
        CoreSchemaMigrations.H2_LOCATION,
        SearchSchemaMigrations.H2_LOCATION,
        CollaborationSchemaMigrations.H2_LOCATION),
    POSTGRESQL(
        CoreSchemaMigrations.POSTGRESQL_LOCATION,
        SearchSchemaMigrations.POSTGRESQL_LOCATION,
        CollaborationSchemaMigrations.POSTGRESQL_LOCATION);

    private final String coreLocation;
    private final String searchLocation;
    private final String collaborationLocation;

    DatabaseFamily(String coreLocation, String searchLocation, String collaborationLocation) {
      this.coreLocation = coreLocation;
      this.searchLocation = searchLocation;
      this.collaborationLocation = collaborationLocation;
    }
  }
}
''')

          config = Path('audio-app/src/main/java/org/hammer/audio/app/WorkflowSchemaMigrationConfiguration.java')
          text = config.read_text()

name: Fix PR 264 SpotBugs findings

on:
  push:
    branches:
      - feature/263-collaboration-recovery

permissions:
  contents: write
  packages: read

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/263-collaboration-recovery

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Replace generic rethrows and document injected persistence port
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry = Path('audio-core/src/main/java/org/hammer/audio/workflow/collaboration/WorkflowSessionRegistry.java')
          text = registry.read_text()

          create_old = '''    } catch (RuntimeException failure) {
                sessionEntries.remove(requiredSessionId, created);
                if (persisted) {
                  stateStore.close(requiredSessionId, 0, INITIAL_SESSION_EVENT_SEQUENCE);
                }
                throw failure;
              }
          '''
          create_new = '''    } catch (RuntimeException failure) {
                sessionEntries.remove(requiredSessionId, created);
                if (persisted) {
                  try {
                    stateStore.close(requiredSessionId, 0, INITIAL_SESSION_EVENT_SEQUENCE);
                  } catch (RuntimeException cleanupFailure) {
                    failure.addSuppressed(cleanupFailure);
                  }
                }
                throw new IllegalStateException(
                    "Failed to create collaboration session " + requiredSessionId, failure);
              }
          '''
          if create_old not in text:
              raise SystemExit('Create failure block not found')
          text = text.replace(create_old, create_new, 1)

          recovery_old = '''      } catch (RuntimeException failure) {
                  sessionEntries.remove(sessionId, recovered);
                  throw failure;
                }
          '''
          recovery_new = '''      } catch (RuntimeException failure) {
                  sessionEntries.remove(sessionId, recovered);
                  throw new WorkflowSessionRecoveryException(
                      sessionId,
                      "Failed to restore collaboration event stream for session " + sessionId,
                      failure);
                }
          '''
          if recovery_old not in text:
              raise SystemExit('Recovery event-hub failure block not found')
          registry.write_text(text.replace(recovery_old, recovery_new, 1))

          filter_path = Path('spotbugs-exclude.xml')
          filter_text = filter_path.read_text()
          marker = '\n</FindBugsFilter>'
          block = '''

            <!-- WorkflowSessionStateStore is an application-scoped injected port. Its identity and
                 lifecycle are intentionally shared with Spring; copying it is neither possible nor
                 semantically correct, and the reference is never exposed by the registry. -->
            <Match>
              <Class name="org.hammer.audio.workflow.collaboration.WorkflowSessionRegistry"/>
              <Field name="stateStore"/>
              <Bug pattern="EI_EXPOSE_REP2"/>
            </Match>'''
          if marker not in filter_text:
              raise SystemExit('SpotBugs filter closing tag not found')
          filter_path.write_text(filter_text.replace(marker, block + marker, 1))
          PY

          mvn -B spotless:apply --file pom.xml

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Resolve collaboration recovery SpotBugs findings'
          git push origin HEAD:feature/263-collaboration-recovery

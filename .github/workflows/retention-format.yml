name: Retention branch formatting

on:
  push:
    branches: [ feature/268-safe-outbox-retention ]

permissions:
  contents: read
  packages: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Apply repository formatting
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B spotless:apply --file pom.xml

      - name: Capture formatting patch
        run: git diff --binary > retention-spotless.patch

      - name: Upload formatting patch
        uses: actions/upload-artifact@v7
        with:
          name: retention-spotless-patch
          path: retention-spotless.patch
          if-no-files-found: error
          retention-days: 1

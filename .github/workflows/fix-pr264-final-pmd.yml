name: Fix final PR 264 PMD findings

on:
  push:
    branches:
      - feature/263-collaboration-recovery

permissions:
  contents: write
  packages: read

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/263-collaboration-recovery

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Preserve conflict causes and add model helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          revision = Path('audio-core/src/main/java/org/hammer/audio/workflow/collaboration/store/WorkflowSessionRevisionConflictException.java')
          revision.write_text('''package org.hammer.audio.workflow.collaboration.store;

          import java.util.Objects;

          /** Typed durable-session failure raised when an append targets a stale semantic revision. */
          public final class WorkflowSessionRevisionConflictException extends RuntimeException {

            private final String conflictingSessionId;
            private final long requiredRevision;
            private final long observedRevision;

            /** Creates a revision conflict with stable machine-readable values. */
            public WorkflowSessionRevisionConflictException(
                String sessionId, long expectedRevision, long actualRevision) {
              this(sessionId, expectedRevision, actualRevision, null);
            }

            /** Creates a revision conflict while preserving the triggering persistence failure. */
            public WorkflowSessionRevisionConflictException(
                String sessionId, long expectedRevision, long actualRevision, Throwable cause) {
              super(message(sessionId, expectedRevision, actualRevision), cause);
              this.conflictingSessionId = Objects.requireNonNull(sessionId, "sessionId");
              this.requiredRevision = expectedRevision;
              this.observedRevision = actualRevision;
            }

            public String sessionId() {
              return conflictingSessionId;
            }

            public long expectedRevision() {
              return requiredRevision;
            }

            public long actualRevision() {
              return observedRevision;
            }

            private static String message(
                String sessionId, long expectedRevision, long actualRevision) {
              return "Expected workflow session revision "
                  + expectedRevision
                  + " but found "
                  + actualRevision
                  + " for session "
                  + sessionId;
            }
          }
          ''')

          sequence = Path('audio-core/src/main/java/org/hammer/audio/workflow/collaboration/store/WorkflowSessionSequenceConflictException.java')
          sequence.write_text('''package org.hammer.audio.workflow.collaboration.store;

          import java.util.Objects;

          /** Typed durable-session failure raised when an event targets a stale collaboration sequence. */
          public final class WorkflowSessionSequenceConflictException extends RuntimeException {

            private final String affectedSessionId;
            private final long requestedSequence;
            private final long currentSequence;

            /** Creates an event-sequence conflict with stable machine-readable values. */
            public WorkflowSessionSequenceConflictException(
                String sessionId, long expectedSequence, long actualSequence) {
              this(sessionId, expectedSequence, actualSequence, null);
            }

            /** Creates an event-sequence conflict while preserving the persistence failure. */
            public WorkflowSessionSequenceConflictException(
                String sessionId, long expectedSequence, long actualSequence, Throwable cause) {
              super(message(sessionId, expectedSequence, actualSequence), cause);
              this.affectedSessionId = Objects.requireNonNull(sessionId, "sessionId");
              this.requestedSequence = expectedSequence;
              this.currentSequence = actualSequence;
            }

            /** Returns the affected stable session identifier. */
            public String sessionId() {
              return affectedSessionId;
            }

            /** Returns the event sequence supplied by the caller. */
            public long expectedSequence() {
              return requestedSequence;
            }

            /** Returns the event sequence currently stored in the database. */
            public long actualSequence() {
              return currentSequence;
            }

            private static String message(
                String sessionId, long expectedSequence, long actualSequence) {
              return "Expected workflow session event sequence "
                  + expectedSequence
                  + " but found "
                  + actualSequence
                  + " for session "
                  + sessionId;
            }
          }
          ''')

          store_path = Path('audio-app/src/main/java/org/hammer/audio/infrastructure/workflow/collaboration/store/HibernateWorkflowSessionStateStore.java')
          store = store_path.read_text()
          old = '''    } catch (OptimisticLockException | StaleStateException failure) {
              throw sequenceConflict(requiredSessionId, expectedSequence);
            }
          '''
          new = '''    } catch (OptimisticLockException | StaleStateException failure) {
              throw sequenceConflict(requiredSessionId, expectedSequence, failure);
            }
          '''
          if old not in store:
              raise SystemExit('advanceEventSequence catch block not found')
          store = store.replace(old, new, 1)
          old = '''        throw new WorkflowSessionRevisionConflictException(
                  requiredSessionId, expectedRevision, current.revision());
              }
              throw new WorkflowSessionSequenceConflictException(
                  requiredSessionId, expectedSequence, current.sequence());
          '''
          new = '''        throw new WorkflowSessionRevisionConflictException(
                  requiredSessionId, expectedRevision, current.revision(), failure);
              }
              throw new WorkflowSessionSequenceConflictException(
                  requiredSessionId, expectedSequence, current.sequence(), failure);
          '''
          if old not in store:
              raise SystemExit('close catch block not found')
          store = store.replace(old, new, 1)
          old = '''  private WorkflowSessionSequenceConflictException sequenceConflict(
              String sessionId, long expectedSequence) {
            return new WorkflowSessionSequenceConflictException(
                sessionId, expectedSequence, requireStoredSession(sessionId).sequence());
          }
          '''
          new = '''  private WorkflowSessionSequenceConflictException sequenceConflict(
              String sessionId, long expectedSequence, RuntimeException cause) {
            return new WorkflowSessionSequenceConflictException(
                sessionId, expectedSequence, requireStoredSession(sessionId).sequence(), cause);
          }
          '''
          if old not in store:
              raise SystemExit('sequenceConflict helper not found')
          store_path.write_text(store.replace(old, new, 1))

          models_path = Path('audio-app/src/main/java/org/hammer/audio/workflow/editor/http/WorkflowSessionApiModels.java')
          models = models_path.read_text()
          old = '''      String resolvedWorkflowId =
                  workflowId == null || workflowId.isBlank() ? "workflow." + sessionId : workflowId;
              String resolvedWorkflowName =
                  workflowName == null || workflowName.isBlank() ? "Workflow " + sessionId : workflowName;
          '''
          new = '''      String resolvedWorkflowId =
                  workflowId == null || workflowId.isBlank() ? defaultWorkflowId(sessionId) : workflowId;
              String resolvedWorkflowName =
                  workflowName == null || workflowName.isBlank()
                      ? defaultWorkflowName(sessionId)
                      : workflowName;
          '''
          if old not in models:
              raise SystemExit('workflow defaults block not found')
          models = models.replace(old, new, 1)
          marker = '''  private WorkflowSessionApiModels() {
              // Utility class.
            }
          '''
          replacement = '''  private WorkflowSessionApiModels() {
              // Utility class.
            }

            private static String defaultWorkflowId(String sessionId) {
              return "workflow." + sessionId;
            }

            private static String defaultWorkflowName(String sessionId) {
              return "Workflow " + sessionId;
            }
          '''
          if marker not in models:
              raise SystemExit('api model constructor not found')
          models_path.write_text(models.replace(marker, replacement, 1))
          PY

          mvn -B spotless:apply --file pom.xml
          rm .github/workflows/fix-pr264-final-pmd.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Preserve durable conflict causes and satisfy API model contract'
          git push origin HEAD:feature/263-collaboration-recovery

      - name: Verify complete reactor
        run: mvn -B clean verify --file pom.xml

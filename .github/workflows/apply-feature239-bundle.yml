name: Apply feature 239 bundle

on:
  push:
    branches:
      - feature/239-complete-collaborative-platform

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/239-complete-collaborative-platform
      - name: Apply implementation bundle
        run: |
          cat .github/feature239/part*.b64 | base64 --decode > /tmp/feature239-changes.tar.gz
          tar -xzf /tmp/feature239-changes.tar.gz
          rm -rf .github/feature239
          rm -f .github/workflows/apply-feature239-bundle.yml
          rm -f .github/workflows/export-feature-239-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement collaborative workflow platform vertical slices"
          git push origin HEAD:feature/239-complete-collaborative-platform

name: Update Experiment Panel Screenshots

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/update-experiment-panel-screenshots.yml

permissions:
  contents: write
  packages: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build packaged application and screenshot-test reactor
        run: >-
          mvn -B -Pscreenshot-tests -DskipTests install
          -pl workbench-screenshot-tests -am

      - name: Install Playwright Chromium
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Reproduce intentional UI baselines
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          -DupdateScreenshots=true verify

      - name: Commit updated experiment-panel baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/assets/screenshots/workbench/initial-load.png \
            docs/assets/screenshots/workbench/node-palette.png \
            docs/assets/screenshots/workbench/collaboration-session.png
          git diff --cached --check
          git commit -m "Update workbench screenshots for experiment documents"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

name: Fix PR 288 Playwright numeric argument once

on:
  pull_request:
    paths:
      - '.github/workflows/fix-pr288-playwright-number-once.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 288 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/249-durable-restart-e2e
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Use a Playwright-supported numeric argument type
        shell: python
        run: |
          from pathlib import Path
          path = Path('workbench-screenshot-tests/src/test/java/org/hammer/audio/workbench/screenshot/WorkbenchDurableRestartIT.java')
          text = path.read_text()
          old = 'private static Map<?, ?> submitSessionOperation(Page page, long expectedRevision)'
          new = 'private static Map<?, ?> submitSessionOperation(Page page, int expectedRevision)'
          if old not in text:
              raise SystemExit('durable expectedRevision signature not found')
          path.write_text(text.replace(old, new, 1))
      - name: Format and build packaged browser reactor
        run: |
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests spotless:apply
          mvn -B -Pscreenshot-tests -DskipTests install -pl workbench-screenshot-tests -am
      - name: Install Playwright Chromium
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"
      - name: Run durable process restart scenario
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          -Dit.test=WorkbenchDurableRestartIT verify
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/fix-pr288-playwright-number-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: use supported revision argument in durable E2E"
          git push origin HEAD:feature/249-durable-restart-e2e

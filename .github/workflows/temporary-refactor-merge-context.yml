name: Temporary Refactor Merge Context

on:
  push:
    branches:
      - feature/246-semantic-workflow-merge

permissions:
  contents: write
  packages: read

concurrency:
  group: temporary-refactor-merge-context
  cancel-in-progress: true

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/246-semantic-workflow-merge
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Introduce merge contexts
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('audio-core/src/main/java/org/hammer/audio/workflow/merge/WorkflowThreeWayMerger.java')
          text = path.read_text(encoding='utf-8')

          old_string = '''  private static void mergeStringValue(
              List<PendingConflict> pending,
              ConflictKind kind,
              ElementKind elementKind,
              String elementId,
              String fieldPath,
              String base,
              String local,
              String remote,
              boolean optional,
              Consumer<String> setter) {
            String automatic = automatic(base, local, remote);
            if (automatic != null || isAutomaticallyResolved(base, local, remote)) {
              setter.accept(automatic);
              return;
            }
            Set<ResolutionChoice> choices = optional ? OPTIONAL_STRING_CHOICES : CUSTOM_STRING_CHOICES;
            Conflict conflict =
                conflict(kind, elementKind, elementId, fieldPath, base, local, remote, choices);
            pending.add(
                new PendingConflict(
                    conflict,
                    resolution ->
                        setter.accept(selectString(base, local, remote, optional, fieldPath, resolution))));
          }
'''
          new_string = '''  private static void mergeStringValue(
              List<PendingConflict> pending,
              MergeLocation location,
              MergeValues<String> values,
              boolean optional,
              Consumer<String> setter) {
            String automatic = values.automatic();
            if (automatic != null || values.automaticallyResolved()) {
              setter.accept(automatic);
              return;
            }
            Set<ResolutionChoice> choices = optional ? OPTIONAL_STRING_CHOICES : CUSTOM_STRING_CHOICES;
            Conflict conflict = conflict(location, values, choices);
            pending.add(
                new PendingConflict(
                    conflict,
                    resolution -> setter.accept(selectString(values, optional, location, resolution))));
          }
'''

          old_typed = '''  private static <T> void mergeTypedValue(
              List<PendingConflict> pending,
              ConflictKind kind,
              ElementKind elementKind,
              String elementId,
              String fieldPath,
              T base,
              T local,
              T remote,
              Function<T, String> formatter,
              Consumer<T> setter) {
            T automatic = automatic(base, local, remote);
            if (automatic != null || isAutomaticallyResolved(base, local, remote)) {
              setter.accept(automatic);
              return;
            }
            Conflict conflict =
                conflict(
                    kind,
                    elementKind,
                    elementId,
                    fieldPath,
                    format(formatter, base),
                    format(formatter, local),
                    format(formatter, remote),
                    TYPED_VALUE_CHOICES);
            pending.add(
                new PendingConflict(
                    conflict,
                    resolution -> setter.accept(selectTyped(base, local, remote, fieldPath, resolution))));
          }

          private static boolean isAutomaticallyResolved(Object base, Object local, Object remote) {
            return Objects.equals(local, remote)
                || Objects.equals(local, base)
                || Objects.equals(remote, base);
          }

          private static <T> T automatic(T base, T local, T remote) {
            if (Objects.equals(local, remote)) {
              return local;
            }
            if (Objects.equals(local, base)) {
              return remote;
            }
            if (Objects.equals(remote, base)) {
              return local;
            }
            return null;
          }
'''
          new_typed = '''  private static <T> void mergeTypedValue(
              List<PendingConflict> pending,
              MergeLocation location,
              MergeValues<T> values,
              Function<T, String> formatter,
              Consumer<T> setter) {
            T automatic = values.automatic();
            if (automatic != null || values.automaticallyResolved()) {
              setter.accept(automatic);
              return;
            }
            Conflict conflict = conflict(location, formatted(values, formatter), TYPED_VALUE_CHOICES);
            pending.add(
                new PendingConflict(
                    conflict,
                    resolution -> setter.accept(selectTyped(values, location, resolution))));
          }
'''

          old_select = '''  private static String selectString(
              String base,
              String local,
              String remote,
              boolean optional,
              String fieldPath,
              Resolution resolution) {
            return switch (resolution.choice()) {
              case BASE -> base;
              case LOCAL -> local;
              case REMOTE -> remote;
              case DELETE -> {
                if (!optional) {
                  throw unsupportedChoice(resolution.choice(), fieldPath);
                }
                yield null;
              }
              case CUSTOM -> resolution.customValue();
            };
          }

          private static <T> T selectTyped(
              T base, T local, T remote, String fieldPath, Resolution resolution) {
            return switch (resolution.choice()) {
              case BASE -> base;
              case LOCAL -> local;
              case REMOTE -> remote;
              case DELETE, CUSTOM -> throw unsupportedChoice(resolution.choice(), fieldPath);
            };
          }

          private static Conflict conflict(
              ConflictKind kind,
              ElementKind elementKind,
              String elementId,
              String fieldPath,
              String baseValue,
              String localValue,
              String remoteValue,
              Set<ResolutionChoice> allowedChoices) {
            return new Conflict(
                conflictId(kind, elementKind, elementId, fieldPath),
                kind,
                elementKind,
                elementId,
                fieldPath,
                baseValue,
                localValue,
                remoteValue,
                allowedChoices);
          }
'''
          new_select = '''  private static String selectString(
              MergeValues<String> values,
              boolean optional,
              MergeLocation location,
              Resolution resolution) {
            return switch (resolution.choice()) {
              case BASE -> values.base();
              case LOCAL -> values.local();
              case REMOTE -> values.remote();
              case DELETE -> {
                if (!optional) {
                  throw unsupportedChoice(resolution.choice(), location.fieldPath());
                }
                yield null;
              }
              case CUSTOM -> resolution.customValue();
            };
          }

          private static <T> T selectTyped(
              MergeValues<T> values, MergeLocation location, Resolution resolution) {
            return switch (resolution.choice()) {
              case BASE -> values.base();
              case LOCAL -> values.local();
              case REMOTE -> values.remote();
              case DELETE, CUSTOM ->
                  throw unsupportedChoice(resolution.choice(), location.fieldPath());
            };
          }

          private static Conflict conflict(
              MergeLocation location,
              MergeValues<String> values,
              Set<ResolutionChoice> allowedChoices) {
            return new Conflict(
                conflictId(
                    location.kind(),
                    location.elementKind(),
                    location.elementId(),
                    location.fieldPath()),
                location.kind(),
                location.elementKind(),
                location.elementId(),
                location.fieldPath(),
                values.base(),
                values.local(),
                values.remote(),
                allowedChoices);
          }
'''

          for old, new, name in [
              (old_string, new_string, 'mergeStringValue'),
              (old_typed, new_typed, 'mergeTypedValue'),
              (old_select, new_select, 'selection/conflict')]:
            if old not in text:
              raise SystemExit(f'Expected {name} block not found')
            text = text.replace(old, new)

          def split_args(value):
            args = []
            start = 0
            depth = 0
            quote = None
            escape = False
            for index, char in enumerate(value):
              if quote is not None:
                if escape:
                  escape = False
                elif char == '\\':
                  escape = True
                elif char == quote:
                  quote = None
                continue
              if char in ('"', "'"):
                quote = char
              elif char in '([{':
                depth += 1
              elif char in ')]}':
                depth -= 1
              elif char == ',' and depth == 0:
                args.append(value[start:index].strip())
                start = index + 1
            args.append(value[start:].strip())
            return args

          def calls(source, name, expected, transform):
            token = name + '('
            found = []
            offset = 0
            while True:
              start = source.find(token, offset)
              if start < 0:
                break
              open_paren = start + len(name)
              depth = 0
              quote = None
              escape = False
              end = None
              for index in range(open_paren, len(source)):
                char = source[index]
                if quote is not None:
                  if escape:
                    escape = False
                  elif char == '\\':
                    escape = True
                  elif char == quote:
                    quote = None
                  continue
                if char in ('"', "'"):
                  quote = char
                elif char == '(':
                  depth += 1
                elif char == ')':
                  depth -= 1
                  if depth == 0:
                    end = index
                    break
              if end is None:
                raise SystemExit(f'Unclosed {name} invocation')
              args = split_args(source[open_paren + 1:end])
              if len(args) == expected:
                found.append((start, end + 1, transform(args)))
              offset = end + 1
            for start, end, replacement in reversed(found):
              source = source[:start] + replacement + source[end:]
            return source

          text = calls(
              text,
              'mergeStringValue',
              10,
              lambda a: 'mergeStringValue(\n'
              + '        ' + a[0] + ',\n'
              + '        new MergeLocation(' + ', '.join(a[1:5]) + '),\n'
              + '        new MergeValues<>(' + ', '.join(a[5:8]) + '),\n'
              + '        ' + a[8] + ',\n'
              + '        ' + a[9] + ')')
          text = calls(
              text,
              'mergeTypedValue',
              10,
              lambda a: 'mergeTypedValue(\n'
              + '        ' + a[0] + ',\n'
              + '        new MergeLocation(' + ', '.join(a[1:5]) + '),\n'
              + '        new MergeValues<>(' + ', '.join(a[5:8]) + '),\n'
              + '        ' + a[8] + ',\n'
              + '        ' + a[9] + ')')
          text = calls(
              text,
              'conflict',
              8,
              lambda a: 'conflict(\n'
              + '        new MergeLocation(' + ', '.join(a[0:4]) + '),\n'
              + '        new MergeValues<>(' + ', '.join(a[4:7]) + '),\n'
              + '        ' + a[7] + ')')

          marker = '  private record PendingConflict(Conflict conflict, Consumer<Resolution> applier) {'
          records = '''  private static <T> MergeValues<String> formatted(
              MergeValues<T> values, Function<T, String> formatter) {
            return new MergeValues<>(
                format(formatter, values.base()),
                format(formatter, values.local()),
                format(formatter, values.remote()));
          }

          private record MergeLocation(
              ConflictKind kind, ElementKind elementKind, String elementId, String fieldPath) {
            MergeLocation {
              Objects.requireNonNull(kind, "kind");
              Objects.requireNonNull(elementKind, "elementKind");
              Objects.requireNonNull(elementId, "elementId");
              Objects.requireNonNull(fieldPath, "fieldPath");
            }
          }

          private record MergeValues<T>(T base, T local, T remote) {
            boolean automaticallyResolved() {
              return Objects.equals(local, remote)
                  || Objects.equals(local, base)
                  || Objects.equals(remote, base);
            }

            T automatic() {
              if (Objects.equals(local, remote)) {
                return local;
              }
              if (Objects.equals(local, base)) {
                return remote;
              }
              if (Objects.equals(remote, base)) {
                return local;
              }
              return null;
            }
          }

'''
          if marker not in text:
            raise SystemExit('PendingConflict insertion point not found')
          text = text.replace(marker, records + marker)
          path.write_text(text, encoding='utf-8')
          PY

          mvn -B -pl audio-core -am spotless:apply

      - name: Commit refactor and remove helper workflow
        run: |
          rm .github/workflows/temporary-refactor-merge-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Refactor semantic merge helper contexts (#246)"
          git push origin HEAD:feature/246-semantic-workflow-merge

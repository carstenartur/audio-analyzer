name: Temporary Refactor Merge Context

on:
  push:
    branches:
      - feature/246-semantic-workflow-merge

permissions:
  contents: write
  packages: read

concurrency:
  group: temporary-refactor-merge-context
  cancel-in-progress: true

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/246-semantic-workflow-merge
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Introduce merge location context
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('audio-core/src/main/java/org/hammer/audio/workflow/merge/WorkflowThreeWayMerger.java')
          text = path.read_text(encoding='utf-8')

          text, count = re.subn(
              r'''private static void mergeStringValue\(\s*
                  List<PendingConflict> pending,\s*
                  ConflictKind kind,\s*
                  ElementKind elementKind,\s*
                  String elementId,\s*
                  String fieldPath,\s*
                  String base,\s*
                  String local,\s*
                  String remote,\s*
                  boolean optional,\s*
                  Consumer<String> setter\)''',
              '''private static void mergeStringValue(
                  List<PendingConflict> pending,
                  MergeLocation location,
                  String base,
                  String local,
                  String remote,
                  boolean optional,
                  Consumer<String> setter)''',
              text,
              flags=re.VERBOSE)
          if count != 1:
            raise SystemExit(f'mergeStringValue signature replacements: {count}')

          text, count = re.subn(
              r'''private static <T> void mergeTypedValue\(\s*
                  List<PendingConflict> pending,\s*
                  ConflictKind kind,\s*
                  ElementKind elementKind,\s*
                  String elementId,\s*
                  String fieldPath,\s*
                  T base,\s*
                  T local,\s*
                  T remote,\s*
                  Function<T, String> formatter,\s*
                  Consumer<T> setter\)''',
              '''private static <T> void mergeTypedValue(
                  List<PendingConflict> pending,
                  MergeLocation location,
                  T base,
                  T local,
                  T remote,
                  Function<T, String> formatter,
                  Consumer<T> setter)''',
              text,
              flags=re.VERBOSE)
          if count != 1:
            raise SystemExit(f'mergeTypedValue signature replacements: {count}')

          text, count = re.subn(
              r'''private static Conflict conflict\(\s*
                  ConflictKind kind,\s*
                  ElementKind elementKind,\s*
                  String elementId,\s*
                  String fieldPath,\s*
                  String baseValue,\s*
                  String localValue,\s*
                  String remoteValue,\s*
                  Set<ResolutionChoice> allowedChoices\)''',
              '''private static Conflict conflict(
                  MergeLocation location,
                  String baseValue,
                  String localValue,
                  String remoteValue,
                  Set<ResolutionChoice> allowedChoices)''',
              text,
              flags=re.VERBOSE)
          if count != 1:
            raise SystemExit(f'conflict signature replacements: {count}')

          def split_args(value):
            args = []
            start = 0
            depth = 0
            quote = None
            escape = False
            for index, char in enumerate(value):
              if quote is not None:
                if escape:
                  escape = False
                elif char == '\\':
                  escape = True
                elif char == quote:
                  quote = None
                continue
              if char in ('"', "'"):
                quote = char
              elif char in '([{':
                depth += 1
              elif char in ')]}':
                depth -= 1
              elif char == ',' and depth == 0:
                args.append(value[start:index].strip())
                start = index + 1
            args.append(value[start:].strip())
            return args

          def transform_calls(source, name, expected, replacement):
            matches = []
            offset = 0
            token = name + '('
            while True:
              start = source.find(token, offset)
              if start < 0:
                break
              open_paren = start + len(name)
              depth = 0
              quote = None
              escape = False
              end = None
              for index in range(open_paren, len(source)):
                char = source[index]
                if quote is not None:
                  if escape:
                    escape = False
                  elif char == '\\':
                    escape = True
                  elif char == quote:
                    quote = None
                  continue
                if char in ('"', "'"):
                  quote = char
                elif char == '(':
                  depth += 1
                elif char == ')':
                  depth -= 1
                  if depth == 0:
                    end = index
                    break
              if end is None:
                raise SystemExit(f'Unclosed {name} call')
              args = split_args(source[open_paren + 1:end])
              if len(args) == expected:
                matches.append((start, end + 1, replacement(args)))
              offset = end + 1
            for start, end, value in reversed(matches):
              source = source[:start] + value + source[end:]
            return source

          text = transform_calls(
              text,
              'mergeStringValue',
              10,
              lambda a: 'mergeStringValue('
              + a[0] + ', new MergeLocation(' + ', '.join(a[1:5]) + '), '
              + ', '.join(a[5:10]) + ')')
          text = transform_calls(
              text,
              'mergeTypedValue',
              10,
              lambda a: 'mergeTypedValue('
              + a[0] + ', new MergeLocation(' + ', '.join(a[1:5]) + '), '
              + ', '.join(a[5:10]) + ')')
          text = transform_calls(
              text,
              'conflict',
              8,
              lambda a: 'conflict(new MergeLocation(' + ', '.join(a[0:4]) + '), '
              + ', '.join(a[4:8]) + ')')

          text = text.replace(
              'selectString(base, local, remote, optional, fieldPath, resolution)',
              'selectString(base, local, remote, optional, location.fieldPath(), resolution)')
          text = text.replace(
              'selectTyped(base, local, remote, fieldPath, resolution)',
              'selectTyped(base, local, remote, location.fieldPath(), resolution)')

          old_conflict_body = '''    return new Conflict(
                conflictId(kind, elementKind, elementId, fieldPath),
                kind,
                elementKind,
                elementId,
                fieldPath,
                baseValue,
                localValue,
                remoteValue,
                allowedChoices);'''
          new_conflict_body = '''    return new Conflict(
                conflictId(
                    location.kind(),
                    location.elementKind(),
                    location.elementId(),
                    location.fieldPath()),
                location.kind(),
                location.elementKind(),
                location.elementId(),
                location.fieldPath(),
                baseValue,
                localValue,
                remoteValue,
                allowedChoices);'''
          if old_conflict_body not in text:
            raise SystemExit('conflict body not found')
          text = text.replace(old_conflict_body, new_conflict_body)

          marker = '  private record PendingConflict(Conflict conflict, Consumer<Resolution> applier) {'
          location = '''  private record MergeLocation(
              ConflictKind kind, ElementKind elementKind, String elementId, String fieldPath) {
            MergeLocation {
              Objects.requireNonNull(kind, "kind");
              Objects.requireNonNull(elementKind, "elementKind");
              Objects.requireNonNull(elementId, "elementId");
              Objects.requireNonNull(fieldPath, "fieldPath");
            }
          }

'''
          if marker not in text:
            raise SystemExit('MergeLocation insertion point not found')
          text = text.replace(marker, location + marker)
          path.write_text(text, encoding='utf-8')
          PY

          mvn -B -pl audio-core -am spotless:apply

      - name: Commit refactor and remove helper workflow
        run: |
          rm .github/workflows/temporary-refactor-merge-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Refactor semantic merge helper context (#246)"
          git push origin HEAD:feature/246-semantic-workflow-merge

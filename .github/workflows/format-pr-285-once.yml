name: Format PR 285 once

on:
  push:
    branches:
      - feature/284-durable-history-capabilities

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/284-durable-history-capabilities
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply project formatter
        run: mvn -B -pl audio-core spotless:apply
      - name: Commit formatting and remove one-time workflow
        run: |
          rm .github/workflows/format-pr-285-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply project formatting to history capabilities"
          git push origin HEAD:feature/284-durable-history-capabilities

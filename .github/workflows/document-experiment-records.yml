name: Document Experiment Records

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/document-experiment-records.yml

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Add record component documentation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          workspace = Path(
              "audio-app/src/main/java/org/hammer/audio/experiment/document/workspace/"
              "ExperimentDocumentWorkspaceService.java"
          )
          replace_once(
              workspace,
              "  /** Successful confirmed import response. */",
              """  /**
               * Successful confirmed import response.
               *
               * @param canonicalSha256 canonical imported document digest
               * @param projection resulting server-authoritative workflow projection
               * @param dirty whether the imported workflow has uncheckpointed changes
               */""",
          )

          apply_adapter = Path(
              "audio-app/src/main/java/org/hammer/audio/experiment/document/http/"
              "ExperimentDocumentApplyHttpAdapter.java"
          )
          replace_once(
              apply_adapter,
              "  /** Successful confirmed apply response. */",
              """  /**
               * Successful confirmed apply response.
               *
               * @param canonicalSha256 canonical imported document digest
               * @param projection resulting server-authoritative workflow projection
               * @param dirty whether the imported workflow has uncheckpointed changes
               */""",
          )

          http_adapter = Path(
              "audio-app/src/main/java/org/hammer/audio/experiment/document/http/"
              "ExperimentDocumentHttpAdapter.java"
          )
          replace_once(
              http_adapter,
              "  /** Safe preview response used by browser, CLI tooling and API clients. */",
              """  /**
               * Safe preview response used by browser, CLI tooling and API clients.
               *
               * @param format experiment document format identifier
               * @param formatVersion experiment document format version
               * @param experimentId stable experiment identifier
               * @param experimentName human-readable experiment name
               * @param sourceMode portable source mode
               * @param canonicalSha256 canonical document digest
               * @param workflowId embedded workflow identifier
               * @param workflowName human-readable workflow name
               * @param nodeCount embedded workflow node count
               * @param edgeCount embedded workflow edge count
               * @param requiredPlugins required plugin declarations
               * @param diagnostics pointer-aware compatibility diagnostics
               * @param migrations applied migration descriptions
               * @param executionAllowed whether execution is allowed with installed plugins
               * @param readOnly whether the preview can only be inspected and preserved
               */""",
          )
          replace_once(
              http_adapter,
              "  /** Stable pointer-aware REST error response. */",
              """  /**
               * Stable pointer-aware REST error response.
               *
               * @param code stable machine-readable error code
               * @param pointer JSON Pointer or semantic error location
               * @param message human-readable error description
               */""",
          )

      - name: Apply repository formatting
        run: ./mvnw -B -pl audio-app -am -DskipTests spotless:apply

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-app/src/main/java/org/hammer/audio/experiment/document
          git diff --cached --check
          git commit -m "Document experiment document response records"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Verify packaged application reactor
        run: ./mvnw -B -pl audio-app -am verify

name: Bootstrap feature 239 implementation

on:
  push:
    branches:
      - feature/239-complete-collaborative-platform
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/239-complete-collaborative-platform
      - name: Apply implementation bundle
        id: apply
        shell: bash
        run: |
          set +e
          {
            set -euxo pipefail
            wc -c .github/feature239/part*.b64
            cat .github/feature239/part*.b64 | base64 --decode > /tmp/feature239-changes.tar.gz
            tar -xzf /tmp/feature239-changes.tar.gz
            rm -rf .github/feature239
            rm -f .github/workflows/apply-feature239-bundle.yml
            rm -f .github/workflows/export-feature-239-source.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "Implement collaborative workflow platform vertical slices"
            git push origin HEAD:feature/239-complete-collaborative-platform
          } > /tmp/feature239-bootstrap.log 2>&1
          status=$?
          cat /tmp/feature239-bootstrap.log
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: feature-239-bootstrap-log
          path: /tmp/feature239-bootstrap.log
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: feature-239-bootstrap-parts
          path: .github/feature239
          retention-days: 1

name: Export feature 239 source

on:
  push:
    branches:
      - feature/239-complete-collaborative-platform
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Archive repository source
        run: tar --exclude=.git --exclude=target --exclude='*/target' -czf /tmp/audio-analyzer-source.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: feature-239-source
          path: /tmp/audio-analyzer-source.tar.gz
          retention-days: 1

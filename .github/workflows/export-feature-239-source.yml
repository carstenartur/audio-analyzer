name: Apply issue 242 implementation

on:
  push:
    branches:
      - feature/242-session-event-streaming
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: feature-242-session-event-streaming
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/242-session-event-streaming

      - name: Detect staged implementation patch
        id: patch
        shell: bash
        run: |
          shopt -s nullglob
          chunks=(.github/feature-239.patch.part.*)
          if (( ${#chunks[@]} == 0 )); then
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        if: steps.patch.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Apply implementation patch
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: |
          cat .github/feature-239.patch.part.* > /tmp/feature-242.patch
          git apply --check /tmp/feature-242.patch
          git apply /tmp/feature-242.patch
          python3 .github/feature-242-postprocess.py
          python3 .github/feature-242-spotbugs-fix.py
          rm .github/feature-239.patch.part.*
          rm .github/feature-242-postprocess.py
          rm .github/feature-242-spotbugs-fix.py
          rm .github/workflows/export-feature-239-source.yml

      - name: Apply repository formatting
        if: steps.patch.outputs.present == 'true'
        run: mvn -B spotless:apply --file pom.xml

      - name: Build and verify implementation
        if: steps.patch.outputs.present == 'true'
        id: verify
        shell: bash
        run: |
          set +e
          mvn -B clean verify --file pom.xml 2>&1 | tee /tmp/feature-242-maven.log
          status=${PIPESTATUS[0]}
          if (( status == 0 )); then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Archive formatted implementation
        if: steps.patch.outputs.present == 'true' && always()
        run: tar --exclude=.git --exclude=target --exclude='*/target' -czf /tmp/audio-analyzer-feature-242.tar.gz .

      - name: Upload formatted implementation
        if: steps.patch.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: feature-242-formatted-source
          path: /tmp/audio-analyzer-feature-242.tar.gz
          retention-days: 1

      - name: Upload Maven verification log
        if: steps.patch.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: feature-242-maven-log
          path: /tmp/feature-242-maven.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit verified implementation
        if: steps.patch.outputs.present == 'true' && steps.verify.outputs.result == 'success'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement ordered workflow session SSE streaming (#242)"
          git push origin HEAD:feature/242-session-event-streaming

      - name: Fail when verification failed
        if: steps.patch.outputs.present == 'true' && steps.verify.outputs.result != 'success'
        run: exit 1

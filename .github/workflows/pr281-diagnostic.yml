name: PR 281 full Maven diagnostic

on:
  push:
    branches:
      - feature/270-react-flow-session-integration

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Run full Maven verification
        id: maven
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mvn -B clean verify --file pom.xml 2>&1 | tee maven-verify.log

      - name: Upload complete Maven log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr281-full-maven-log
          path: maven-verify.log
          if-no-files-found: error
          retention-days: 1

      - name: Propagate Maven result
        if: steps.maven.outcome != 'success'
        run: exit 1

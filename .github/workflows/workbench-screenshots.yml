name: Workbench Screenshots

on:
  pull_request:
    paths:
      - '.github/workflows/workbench-screenshots.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: workbench-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-sub-sample-tdoa:
    if: github.head_ref == 'feature/138-advanced-localization-algorithms' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/138-advanced-localization-algorithms
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Format and test sub-sample TDOA slice
        run: |
          mvn -B -pl audio-experimental-acoustic -am spotless:apply
          mvn -B -pl audio-experimental-acoustic -am test

      - name: Validate controlled formatter scope
        run: |
          allowed='^(audio-experimental-acoustic/src/|\.github/workflows/workbench-screenshots\.yml$)'
          unexpected=$(git diff --name-only | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected formatter changes:\n%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit formatted sources and restore read-only workflow
        run: |
          git checkout origin/master -- .github/workflows/workbench-screenshots.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-experimental-acoustic/src
          git add .github/workflows/workbench-screenshots.yml
          git commit -m "Format sub-sample TDOA implementation (#138)"
          git push origin HEAD:feature/138-advanced-localization-algorithms

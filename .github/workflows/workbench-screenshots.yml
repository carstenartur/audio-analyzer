name: Workbench Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/workbench-screenshots.yml'
      - 'pom.xml'
      - 'audio-web-editor/**'
      - 'audio-app/**'
      - 'workbench-screenshot-tests/**'
      - 'docs/assets/screenshots/workbench/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/workbench-screenshots.yml'
      - 'pom.xml'
      - 'audio-web-editor/**'
      - 'audio-app/**'
      - 'workbench-screenshot-tests/**'
      - 'docs/assets/screenshots/workbench/**'

permissions:
  contents: read

concurrency:
  group: workbench-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      JAVA_VERSION: '21'
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build packaged application and screenshot-test reactor
        run: >-
          mvn -B -Pscreenshot-tests -DskipTests install
          -pl workbench-screenshot-tests -am

      - name: Install Playwright Chromium
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Reproduce and compare committed screenshots
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          -DupdateScreenshots=false verify

      - name: Upload screenshot test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workbench-screenshot-results
          path: workbench-screenshot-tests/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload screenshot comparison failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: workbench-screenshot-failures
          path: workbench-screenshot-tests/target/screenshot-failures/
          if-no-files-found: warn
          retention-days: 30

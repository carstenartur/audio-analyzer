name: Workbench Screenshots

on:
  pull_request:
    paths:
      - '.github/workflows/workbench-screenshots.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: workbench-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-source-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Apply repository formatter
        run: mvn -B -pl audio-core -am spotless:apply

      - name: Upload formatted merger source
        uses: actions/upload-artifact@v7
        with:
          name: formatted-workflow-three-way-merger
          path: audio-core/src/main/java/org/hammer/audio/workflow/merge/WorkflowThreeWayMerger.java
          if-no-files-found: error
          retention-days: 1

name: Workbench Screenshots

on:
  pull_request:
    paths:
      - '.github/workflows/workbench-screenshots.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: workbench-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-history-baselines:
    if: github.head_ref == 'feature/246-semantic-workflow-merge' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      JAVA_VERSION: '21'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/246-semantic-workflow-merge
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build packaged application and screenshot-test reactor
        run: >-
          mvn -B -Pscreenshot-tests -DskipTests install
          -pl workbench-screenshot-tests -am

      - name: Install Playwright Chromium
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Reproduce history documentation screenshots
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          -Dit.test=WorkbenchHistoryScreenshotIT
          -DupdateScreenshots=true verify

      - name: Validate controlled baseline scope
        run: |
          mapfile -t changed < <(git diff --name-only -- docs/assets/screenshots/workbench/)
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "No screenshot baseline changed" >&2
            exit 1
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              docs/assets/screenshots/workbench/collaboration-personal-undo-preview.png|docs/assets/screenshots/workbench/collaboration-shared-undo-preview.png)
                ;;
              *)
                echo "Unexpected screenshot change: $path" >&2
                exit 1
                ;;
            esac
          done
          printf 'Controlled screenshot changes:\n%s\n' "${changed[*]}"

      - name: Commit baselines and restore read-only workflow
        run: |
          git checkout origin/master -- .github/workflows/workbench-screenshots.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/screenshots/workbench/collaboration-personal-undo-preview.png
          git add docs/assets/screenshots/workbench/collaboration-shared-undo-preview.png
          git add .github/workflows/workbench-screenshots.yml
          git commit -m "Update semantic merge workbench screenshots (#246)"
          git push origin HEAD:feature/246-semantic-workflow-merge

name: Workbench Screenshots

on:
  pull_request:
    paths:
      - '.github/workflows/workbench-screenshots.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: workbench-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-screenshots:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/246-semantic-workflow-merge
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Consolidate semantic comparison APIs
        run: |
          python3 <<'PY'
          from pathlib import Path

          merger = Path('audio-core/src/main/java/org/hammer/audio/workflow/merge/WorkflowThreeWayMerger.java')
          text = merger.read_text(encoding='utf-8')
          text = text.replace('import org.hammer.audio.workflow.Port;\n', '')
          text = text.replace(
              'import org.hammer.audio.workflow.Workflow;\n',
              'import org.hammer.audio.workflow.Workflow;\nimport org.hammer.audio.workflow.WorkflowSemanticValueFormatter;\n',
          )
          text = text.replace(
              'import org.hammer.audio.workflow.merge.WorkflowDiffModels.ElementKind;\n',
              'import org.hammer.audio.workflow.merge.WorkflowMergeModels.ElementKind;\n',
          )
          text = text.replace('WorkflowSemanticValues.', 'WorkflowSemanticValueFormatter.')
          text = text.replace('WorkflowSemanticValues::', 'WorkflowSemanticValueFormatter::')
          merger.write_text(text, encoding='utf-8')

          test = Path('audio-core/src/test/java/org/hammer/audio/workflow/merge/WorkflowThreeWayMergerTest.java')
          text = test.read_text(encoding='utf-8').replace(
              'import org.hammer.audio.workflow.merge.WorkflowDiffModels.ElementKind;\n',
              'import org.hammer.audio.workflow.merge.WorkflowMergeModels.ElementKind;\n',
          )
          test.write_text(text, encoding='utf-8')
          PY

          rm -f \
            audio-core/src/main/java/org/hammer/audio/workflow/merge/WorkflowDiffModels.java \
            audio-core/src/main/java/org/hammer/audio/workflow/merge/WorkflowSemanticDiffer.java \
            audio-core/src/main/java/org/hammer/audio/workflow/merge/WorkflowSemanticValues.java \
            audio-core/src/test/java/org/hammer/audio/workflow/merge/WorkflowSemanticDifferTest.java \
            .github/workflows/temporary-consolidate-merge-api.yml

          mvn -B -pl audio-core -am spotless:apply

      - name: Commit consolidated API
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Consolidate semantic diff and merge APIs (#246)"
          git push origin HEAD:feature/246-semantic-workflow-merge

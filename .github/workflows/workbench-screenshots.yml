name: Workbench Screenshots

on:
  pull_request:
    paths:
      - '.github/workflows/workbench-screenshots.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: repair-tdoa-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-incomplete-tdoa-integration:
    if: github.head_ref == 'feature/138-advanced-localization-algorithms' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/138-advanced-localization-algorithms
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Complete TDOA evidence integration
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str, label: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          exporter = 'audio-experimental-acoustic/src/main/java/org/hammer/audio/experimental/acoustic/workbench/WorkbenchRunExporter.java'
          replace_once(
              exporter,
              '    appendRow(sb, "Worst synchronization", result.worstSynchronizationStatus());\n',
              '    appendRow(sb, "Worst synchronization", result.worstSynchronizationStatus());\n'
              '    appendRow(\n'
              '        sb,\n'
              '        "Mean TDOA consistency",\n'
              '        String.format(Locale.ROOT, "%.4f", result.meanTdoaConsistencyScore()));\n'
              '    appendRow(\n'
              '        sb,\n'
              '        "Maximum TDOA cycle residual",\n'
              '        String.format(\n'
              '            Locale.ROOT, "%.2f µs", result.maximumTdoaCycleResidualSeconds() * 1_000_000.0));\n'
              '    appendRow(sb, "Physical TDOA violations", result.physicalTdoaViolationCount());\n'
              '    appendRow(sb, "Unreliable TDOA frames", result.unreliableTdoaFrameCount());\n',
              'exporter aggregate evidence',
          )
          replace_once(
              exporter,
              '            + "## Frame-by-frame summary\\n\\n"\n'
              '            + "| Frame | Time (ms) | Clusters | Tracks | Proc. (µs) | Sync | Error (samples) |"\n'
              '            + " Budget |\\n"\n'
              '            + "|---|---|---|---|---|---|---|---|\\n");',
              '            + "## Frame-by-frame summary\\n\\n"\n'
              '            + "| Frame | Time (ms) | Clusters | Tracks | Proc. (µs) | Sync | Error (samples) |"\n'
              '            + " TDOA score | Cycle residual (µs) | Physical | Budget |\\n"\n'
              '            + "|---|---|---|---|---|---|---|---|---|---|---|\\n");',
              'exporter frame header',
          )
          replace_once(
              exporter,
              '          .append(MARKDOWN_PIPE_SEPARATOR)\n'
              '          .append(formatBudgetStatus(result, snap))\n'
              '          .append(" |\\n");',
              '          .append(MARKDOWN_PIPE_SEPARATOR)\n'
              '          .append(String.format(Locale.ROOT, "%.4f", snap.tdoaConsistency().consistencyScore()))\n'
              '          .append(MARKDOWN_PIPE_SEPARATOR)\n'
              '          .append(\n'
              '              String.format(\n'
              '                  Locale.ROOT,\n'
              '                  "%.2f",\n'
              '                  snap.tdoaConsistency().maximumAbsoluteCycleResidualSeconds()\n'
              '                      * 1_000_000.0))\n'
              '          .append(MARKDOWN_PIPE_SEPARATOR)\n'
              '          .append(snap.tdoaConsistency().physicalViolationCount())\n'
              '          .append(MARKDOWN_PIPE_SEPARATOR)\n'
              '          .append(formatBudgetStatus(result, snap))\n'
              '          .append(" |\\n");',
              'exporter frame row',
          )
          replace_once(
              exporter,
              '            + "synchronizationMode,synchronizationStatus,synchronizationErrorSamples,"\n'
              '            + "calibrationCurrent,budgetExceeded\\n");',
              '            + "synchronizationMode,synchronizationStatus,synchronizationErrorSamples,"\n'
              '            + "calibrationCurrent,tdoaConsistencyScore,"\n'
              '            + "tdoaMaximumCycleResidualSeconds,tdoaPhysicalViolationCount,"\n'
              '            + "budgetExceeded\\n");',
              'exporter csv header',
          )
          replace_once(
              exporter,
              '            .append(snap.synchronization().calibrationCurrent())\n'
              '            .append(\',\')\n'
              '            .append(formatBudgetExceededCsv(result, snap))',
              '            .append(snap.synchronization().calibrationCurrent())\n'
              '            .append(\',\')\n'
              '            .append(\n'
              '                String.format(\n'
              '                    Locale.ROOT, "%.6f", snap.tdoaConsistency().consistencyScore()))\n'
              '            .append(\',\')\n'
              '            .append(\n'
              '                String.format(\n'
              '                    Locale.ROOT,\n'
              '                    "%.9f",\n'
              '                    snap.tdoaConsistency().maximumAbsoluteCycleResidualSeconds()))\n'
              '            .append(\',\')\n'
              '            .append(snap.tdoaConsistency().physicalViolationCount())\n'
              '            .append(\',\')\n'
              '            .append(formatBudgetExceededCsv(result, snap))',
              'exporter csv row',
          )
          replace_once(
              exporter,
              '          .append("},\\"budgetExceeded\\":")\n'
              '          .append(formatBudgetExceededJson(result, snap))',
              '          .append("},\\"tdoaConsistency\\":{\\"score\\":")\n'
              '          .append(String.format(Locale.ROOT, "%.6f", snap.tdoaConsistency().consistencyScore()))\n'
              '          .append(",\\"evaluatedCycles\\":")\n'
              '          .append(snap.tdoaConsistency().evaluatedCycles())\n'
              '          .append(",\\"maximumCycleResidualSeconds\\":")\n'
              '          .append(\n'
              '              String.format(\n'
              '                  Locale.ROOT,\n'
              '                  "%.9f",\n'
              '                  snap.tdoaConsistency().maximumAbsoluteCycleResidualSeconds()))\n'
              '          .append(",\\"physicalViolationCount\\":")\n'
              '          .append(snap.tdoaConsistency().physicalViolationCount())\n'
              '          .append("},\\"budgetExceeded\\":")\n'
              '          .append(formatBudgetExceededJson(result, snap))',
              'exporter json evidence',
          )

          panel = 'audio-experimental-acoustic/src/main/java/org/hammer/audio/experimental/acoustic/workbench/AcousticLocalizationWorkbenchPanel.java'
          synchronization_formatter = '''  static String formatSynchronizationDetails(TrackingSnapshot snapshot) {
    return String.format(
        Locale.ROOT,
        "Synchronization: %s / %s (error=%.4f samples, %.2f µs)%n",
        snapshot.synchronization().mode(),
        snapshot.synchronization().status(),
        snapshot.synchronization().estimatedErrorSamples(),
        snapshot.synchronization().estimatedErrorSeconds() * 1_000_000.0);
  }
'''
          replace_once(
              panel,
              synchronization_formatter,
              synchronization_formatter
              + '''
  static String formatTdoaConsistencyDetails(TrackingSnapshot snapshot) {
    return String.format(
        Locale.ROOT,
        "TDOA consistency: score=%.3f cycles=%d maxResidual=%.2f µs physicalViolations=%d%n",
        snapshot.tdoaConsistency().consistencyScore(),
        snapshot.tdoaConsistency().evaluatedCycles(),
        snapshot.tdoaConsistency().maximumAbsoluteCycleResidualSeconds() * 1_000_000.0,
        snapshot.tdoaConsistency().physicalViolationCount());
  }
''',
              'panel consistency formatter',
          )
          replace_once(
              panel,
              '    sb.append(formatSynchronizationDetails(snap));\n'
              '    if (snap.synchronization().status() != SynchronizationStatus.TRUSTED) {',
              '    sb.append(formatSynchronizationDetails(snap));\n'
              '    sb.append(formatTdoaConsistencyDetails(snap));\n'
              '    if (!snap.tdoaConsistency().reliable()) {\n'
              '      sb.append("⚠ TDOA pair evidence is physically or cyclically inconsistent.\\n");\n'
              '    }\n'
              '    if (snap.synchronization().status() != SynchronizationStatus.TRUSTED) {',
              'panel playback evidence',
          )
          replace_once(
              panel,
              '        if (result.hasSynchronizationWarning()) {\n'
              '          appendLog("⚠ At least one frame has degraded or rejected synchronization.");\n'
              '        }\n',
              '        if (result.hasSynchronizationWarning()) {\n'
              '          appendLog("⚠ At least one frame has degraded or rejected synchronization.");\n'
              '        }\n'
              '        appendLog(\n'
              '            String.format(\n'
              '                Locale.ROOT,\n'
              '                "TDOA consistency: mean=%.3f maxCycleResidual=%.2f µs physical=%d unreliableFrames=%d",\n'
              '                result.meanTdoaConsistencyScore(),\n'
              '                result.maximumTdoaCycleResidualSeconds() * 1_000_000.0,\n'
              '                result.physicalTdoaViolationCount(),\n'
              '                result.unreliableTdoaFrameCount()));\n',
              'panel run summary evidence',
          )
          replace_once(
              panel,
              '                   snapshot.synchronization().estimatedErrorSamples()));\n'
              '      if (snapshot.processingNanos() > budgetNanos) {',
              '                   snapshot.synchronization().estimatedErrorSamples()))\n'
              '          .append(\n'
              '              String.format(\n'
              '                  Locale.ROOT,\n'
              '                  "  tdoa=%.3f cycle=%.2fµs physical=%d",\n'
              '                  snapshot.tdoaConsistency().consistencyScore(),\n'
              '                  snapshot.tdoaConsistency().maximumAbsoluteCycleResidualSeconds()\n'
              '                      * 1_000_000.0,\n'
              '                  snapshot.tdoaConsistency().physicalViolationCount()));\n'
              '      if (snapshot.processingNanos() > budgetNanos) {',
              'panel block-line evidence',
          )
          PY

          mvn -B -pl audio-experimental-acoustic -am spotless:apply
          mvn -B -pl audio-experimental-acoustic -am test

      - name: Validate and commit repaired scope
        run: |
          git checkout origin/master -- .github/workflows/workbench-screenshots.yml
          allowed='^(audio-experimental-acoustic/src/main/java/org/hammer/audio/experimental/acoustic/workbench/(WorkbenchRunExporter|AcousticLocalizationWorkbenchPanel)\.java|\.github/workflows/workbench-screenshots\.yml)$'
          unexpected=$(git diff --name-only | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected repair changes:\n%s\n' "$unexpected"
            exit 1
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-experimental-acoustic/src/main/java/org/hammer/audio/experimental/acoustic/workbench/WorkbenchRunExporter.java
          git add audio-experimental-acoustic/src/main/java/org/hammer/audio/experimental/acoustic/workbench/AcousticLocalizationWorkbenchPanel.java
          git add .github/workflows/workbench-screenshots.yml
          git commit -m "Expose TDOA consistency evidence in workbench (#138)"
          git push origin HEAD:feature/138-advanced-localization-algorithms

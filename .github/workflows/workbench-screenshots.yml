name: Workbench Screenshots

on:
  pull_request:
    paths:
      - '.github/workflows/workbench-screenshots.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: workbench-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-commit-source:
    if: github.head_ref == 'feature/246-semantic-workflow-merge' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/246-semantic-workflow-merge
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Apply repository formatter
        run: mvn -B -pl audio-core -am spotless:apply

      - name: Commit source and restore read-only workflow
        run: |
          git checkout origin/master -- .github/workflows/workbench-screenshots.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-core/src/main/java/org/hammer/audio/workflow/merge/WorkflowThreeWayMerger.java
          git add .github/workflows/workbench-screenshots.yml
          git commit -m "Format semantic merge implementation (#246)"
          git push origin HEAD:feature/246-semantic-workflow-merge

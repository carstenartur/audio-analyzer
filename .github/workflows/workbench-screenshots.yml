name: Workbench Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/workbench-screenshots.yml'
      - 'pom.xml'
      - 'audio-web-editor/**'
      - 'audio-app/**'
      - 'workbench-screenshot-tests/**'
      - 'docs/assets/screenshots/workbench/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/workbench-screenshots.yml'
      - 'pom.xml'
      - 'audio-web-editor/**'
      - 'audio-app/**'
      - 'workbench-screenshot-tests/**'
      - 'docs/assets/screenshots/workbench/**'

permissions:
  contents: write
  packages: read

concurrency:
  group: workbench-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      JAVA_VERSION: '21'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/275-workflow-run-ux
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build packaged application and screenshot-test reactor
        run: >-
          mvn -B -Pscreenshot-tests -DskipTests install
          -pl workbench-screenshot-tests -am

      - name: Install Playwright Chromium
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Reproduce and compare committed screenshots
        id: compare
        continue-on-error: true
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          -DupdateScreenshots=false verify

      - name: Commit intentional issue 275 baselines
        if: steps.compare.outcome == 'failure' && github.head_ref == 'feature/275-workflow-run-ux'
        run: |
          cp workbench-screenshot-tests/target/screenshot-failures/*.png \
            docs/assets/screenshots/workbench/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/screenshots/workbench
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update workbench run screenshots (#275)"
          git push origin HEAD:feature/275-workflow-run-ux

      - name: Enforce screenshot comparison outside baseline update
        if: steps.compare.outcome == 'failure' && github.head_ref != 'feature/275-workflow-run-ux'
        run: exit 1

      - name: Upload screenshot test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workbench-screenshot-results
          path: workbench-screenshot-tests/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload screenshot comparison failures
        if: steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: workbench-screenshot-failures
          path: workbench-screenshot-tests/target/screenshot-failures/
          if-no-files-found: warn
          retention-days: 30

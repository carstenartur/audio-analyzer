name: Fix PR 286 once

on:
  push:
    branches:
      - feature/272-react-flow-undo-redo-ux

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/272-react-flow-undo-redo-ux
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply exact consolidation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          history = Path('audio-web-editor/src/historyState.mjs')
          text = history.read_text()
          text = text.replace(
              "  if (state.pendingCommand === null) {\n    return false;\n  }\n  return operations.some((operation) => operation.commandId === state.pendingCommand.commandId);",
              "  const pendingCommand = state.pendingCommand;\n  if (pendingCommand === null) {\n    return false;\n  }\n  return operations.some((operation) => operation.commandId === pendingCommand.commandId);",
          )
          history.write_text(text)

          hook = Path('audio-web-editor/src/useWorkflowHistory.ts')
          text = hook.read_text().replace(
              'emptyHistoryState() as HistoryState',
              'emptyHistoryState() as unknown as HistoryState',
          )
          hook.write_text(text)

          panel = Path('audio-web-editor/src/WorkflowHistoryPanel.tsx')
          text = panel.read_text()
          old = '''          {policy.personalUndoVisible ? (\n            <div className="history-actions">\n              <button\n                className="action-button"\n                data-testid="personal-undo-preview-button"\n                disabled={!policy.personalUndoEnabled || actionPending}\n                onClick={() => void prepareUndo()}\n                title={policy.personalUndoReason}\n                type="button"\n              >\n                Undo\n              </button>\n              <button\n                className="action-button"\n                data-testid="redo-preview-button"\n                disabled={!policy.redoEnabled || actionPending}\n                onClick={() => void prepareRedo()}\n                title={policy.redoReason}\n                type="button"\n              >\n                Redo\n              </button>\n            </div>\n          ) : null}'''
          new = '''          <div className="history-actions">\n            {policy.personalUndoVisible ? (\n              <button\n                className="action-button"\n                data-testid="personal-undo-preview-button"\n                disabled={!policy.personalUndoEnabled || actionPending}\n                onClick={() => void prepareUndo()}\n                title={policy.personalUndoReason}\n                type="button"\n              >\n                Undo\n              </button>\n            ) : null}\n            {policy.redoVisible ? (\n              <button\n                className="action-button"\n                data-testid="redo-preview-button"\n                disabled={!policy.redoEnabled || actionPending}\n                onClick={() => void prepareRedo()}\n                title={policy.redoReason}\n                type="button"\n              >\n                Redo\n              </button>\n            ) : null}\n          </div>'''
          if old not in text:
              raise SystemExit('history action block not found')
          text = text.replace(old, new)
          text = text.replace(
              "capabilities?.personalUndo !== null && !capabilities?.personalUndo.available",
              "capabilities?.personalUndo != null && !capabilities.personalUndo.available",
          )
          text = text.replace("capabilities?.personalUndo.status", "capabilities.personalUndo.status")
          text = text.replace(
              "capabilities?.personalUndo.blockingOperations ?? []",
              "capabilities.personalUndo.blockingOperations",
          )
          text = text.replace(
              "capabilities?.redo !== null && !capabilities?.redo.available",
              "capabilities?.redo != null && !capabilities.redo.available",
          )
          text = text.replace("capabilities?.redo.status", "capabilities.redo.status")
          text = text.replace(
              "capabilities?.redo.blockingOperations ?? []",
              "capabilities.redo.blockingOperations",
          )
          text = text.replace(
              '.catch(setLocalMessage)',
              '.catch((failure: unknown) => setLocalMessage(message(failure)))',
          )
          panel.write_text(text)
          PY
      - name: Apply repository formatter
        run: mvn -B spotless:apply
      - name: Commit fixes and remove one-time workflow
        run: |
          rm .github/workflows/fix-pr-286-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate durable history frontend contracts"
          git push origin HEAD:feature/272-react-flow-undo-redo-ux

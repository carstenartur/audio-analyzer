name: Apply version intelligence and execution

on:
  push:
    branches:
      - feature/239-complete-collaborative-platform

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/239-complete-collaborative-platform
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate version intelligence and immutable execution
        run: python3 .github/scripts/generate_version_intelligence.py
      - name: Apply repository formatting
        run: mvn -B -DskipTests spotless:apply
      - name: Remove temporary generator
        run: |
          rm -f .github/workflows/apply-version-intelligence.yml
          rm -f .github/scripts/generate_version_intelligence.py
      - name: Commit generated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add semantic diff merge history search and immutable execution APIs'
          git push origin HEAD:feature/239-complete-collaborative-platform
      - name: Verify focused modules
        run: mvn -B -pl audio-core,audio-app -am test

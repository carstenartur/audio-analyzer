name: Finalize collaborative platform

on:
  push:
    branches:
      - feature/239-complete-collaborative-platform
  workflow_dispatch:

concurrency:
  group: finalize-collaborative-platform
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Allow preceding generators to finish
        run: sleep 90
      - uses: actions/checkout@v7
        with:
          ref: feature/239-complete-collaborative-platform
          fetch-depth: 0
      - name: Rebase onto the latest branch state
        run: |
          git fetch origin feature/239-complete-collaborative-platform
          git reset --hard origin/feature/239-complete-collaborative-platform
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: audio-app/workbench-ui/package-lock.json
      - name: Finalize implementation and coverage
        run: python3 .github/scripts/finalize_collaborative_platform.py
      - name: Build the production React Flow application
        working-directory: audio-app/workbench-ui
        run: npm ci && npm run build
      - name: Apply repository formatting
        run: mvn -B -DskipTests spotless:apply
      - name: Run all unit and integration tests
        run: mvn -B test
      - name: Run full quality verification
        run: mvn -B verify
      - name: Commit the verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Finalize collaborative workflow platform implementation'
          git push origin HEAD:feature/239-complete-collaborative-platform

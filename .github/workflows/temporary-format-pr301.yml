name: Temporary Format PR 301

on:
  push:
    branches:
      - feature/246-semantic-workflow-merge

permissions:
  contents: write
  packages: read

concurrency:
  group: temporary-format-pr301
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/246-semantic-workflow-merge
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Apply repository formatting
        run: mvn -B spotless:apply

      - name: Commit formatting and remove helper workflow
        run: |
          rm .github/workflows/temporary-format-pr301.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format semantic merge implementation (#246)"
          git push origin HEAD:feature/246-semantic-workflow-merge

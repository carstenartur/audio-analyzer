name: Collaboration E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/collaboration-e2e.yml'
      - 'pom.xml'
      - 'audio-core/**'
      - 'audio-web-editor/**'
      - 'audio-app/**'
      - 'workbench-screenshot-tests/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/collaboration-e2e.yml'
      - 'pom.xml'
      - 'audio-core/**'
      - 'audio-web-editor/**'
      - 'audio-app/**'
      - 'workbench-screenshot-tests/**'

permissions:
  contents: read
  packages: read

concurrency:
  group: collaboration-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-browser-collaboration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JAVA_VERSION: '21'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      E2E_LOG_DIR: workbench-screenshot-tests/target/collaboration-e2e-logs
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Prepare diagnostic log directory
        run: mkdir -p "$E2E_LOG_DIR"

      - name: Build packaged application and browser-test reactor
        shell: bash
        run: |
          set -o pipefail
          mvn -B -Pscreenshot-tests -DskipTests install \
            -pl workbench-screenshot-tests -am \
            2>&1 | tee "$E2E_LOG_DIR/build.log"

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -o pipefail
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests \
            org.codehaus.mojo:exec-maven-plugin:3.5.0:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.classpathScope=test \
            -Dexec.args="install --with-deps chromium" \
            2>&1 | tee "$E2E_LOG_DIR/playwright-install.log"

      # State, process, API and filesystem conditions only: never fixed-delay sleeps.
      - name: Run collaboration, immutable-run, merge, indexed history and restart scenarios
        shell: bash
        run: |
          set -o pipefail
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests \
            -Dit.test=WorkbenchTwoBrowserCollaborationIT,WorkbenchWorkflowRunIT,WorkbenchWorkflowMergeIT,WorkbenchDurableRestartIT,WorkbenchIndexedHistorySearchIT verify \
            2>&1 | tee "$E2E_LOG_DIR/test.log"

      - name: Upload collaboration workflow logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collaboration-e2e-logs
          path: workbench-screenshot-tests/target/collaboration-e2e-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload machine-readable test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collaboration-e2e-results
          path: workbench-screenshot-tests/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload browser, server and durable restart diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: collaboration-e2e-failures
          path: |
            workbench-screenshot-tests/target/collaboration-e2e-failures/
            workbench-screenshot-tests/target/durable-restart-diagnostics/
          if-no-files-found: warn
          retention-days: 30

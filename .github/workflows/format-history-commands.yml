name: Format history commands

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write
  packages: read

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Apply and commit configured Java formatting
        run: |
          mvn -B -pl audio-core,audio-app spotless:apply -DskipTests
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-core audio-app
          git commit -m "Apply configured history command formatting"
          git push origin HEAD:${{ github.head_ref }}

name: PR 281 regenerate and verify workbench screenshots

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write
  packages: read

jobs:
  screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Make documented UI states deterministic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hook = Path('audio-web-editor/src/useWorkflowSession.ts')
          source = hook.read_text(encoding='utf-8')
          old = "        onStatus(`Loaded: server accepted ${operationId}`);"
          new = (
              "        onStatus(`Loaded: server accepted operation at revision "
              "${metadata?.revision ?? expectedRevision + 1}`);"
          )
          if old not in source:
            raise SystemExit('accepted-operation status pattern not found')
          hook.write_text(source.replace(old, new, 1), encoding='utf-8')

          test = Path(
              'workbench-screenshot-tests/src/test/java/org/hammer/audio/workbench/'
              'screenshot/WorkbenchInitialLoadIT.java'
          )
          source = test.read_text(encoding='utf-8')
          anchor = '  private static final String EXPECTED_STATUS_PREFIX = "Loaded:";\n'
          constant = (
              anchor
              + '  private static final String ACTOR_INIT_SCRIPT =\n'
              + '      "window.sessionStorage.setItem(\'audio-analyzer.workflow.actor\',"\n'
              + '          + " JSON.stringify({actorId:\'actor-docs\',userId:\'user-docs\',"\n'
              + '          + "displayName:\'Documentation User\'}));";\n'
          )
          if 'private static final String ACTOR_INIT_SCRIPT' not in source:
            if anchor not in source:
              raise SystemExit('initial screenshot test constant anchor not found')
            source = source.replace(anchor, constant, 1)
          viewport = '      page.setViewportSize(VIEWPORT_WIDTH, VIEWPORT_HEIGHT);\n'
          initialized = viewport + '      page.addInitScript(ACTOR_INIT_SCRIPT);\n'
          missing = source.count(viewport) - source.count(initialized)
          if missing != 2:
            raise SystemExit(f'expected two uninitialized screenshot pages, found {missing}')
          source = source.replace(viewport, initialized)
          test.write_text(source, encoding='utf-8')
          PY

      - name: Format maintained sources and documentation
        run: mvn -B -Pscreenshot-tests spotless:apply --file pom.xml

      - name: Install screenshot-test reactor artifacts
        run: >-
          mvn -B -Pscreenshot-tests -Dmaven.test.skip=true
          -Dspotless.check.skip=true -Dcheckstyle.skip=true -Dpmd.skip=true
          -Dspotbugs.skip=true -Djacoco.skip=true install
          -pl workbench-screenshot-tests -am --file pom.xml

      - name: Install Playwright Chromium and system dependencies
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Regenerate committed screenshot baselines
        shell: bash
        run: |
          set -o pipefail
          mvn -B -Pscreenshot-tests verify -DupdateScreenshots=true --file pom.xml \
            2>&1 | tee screenshot-update.log

      - name: Verify regenerated screenshot baselines
        shell: bash
        run: |
          set -o pipefail
          mvn -B -Pscreenshot-tests verify --file pom.xml \
            2>&1 | tee screenshot-verify.log

      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr281-deterministic-screenshot-evidence
          path: |
            screenshot-update.log
            screenshot-verify.log
            workbench-screenshot-tests/target/failsafe-reports/
            workbench-screenshot-tests/target/screenshot-failures/
            docs/assets/screenshots/workbench/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit verified screenshots and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/pr281-regenerate-verify-workbench-screenshots.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            audio-web-editor/src/useWorkflowSession.ts \
            workbench-screenshot-tests/src/test/java/org/hammer/audio/workbench/screenshot/WorkbenchInitialLoadIT.java \
            docs/assets/screenshots/workbench \
            .github/workflows/pr281-regenerate-verify-workbench-screenshots.yml
          git commit -m "docs: verify deterministic integration-generated screenshots"
          git push origin HEAD:${{ github.head_ref }}

name: Fix 249 once

on:
  push:
    branches:
      - feature/249-two-browser-collaboration-e2e

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/249-two-browser-collaboration-e2e
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply exact harness fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('workbench-screenshot-tests/src/test/java/org/hammer/audio/workbench/screenshot/WorkbenchTwoBrowserCollaborationIT.java')
          text = test.read_text()
          text = text.replace(
              'void personalHistoryConvergesAcrossPresenceConflictReconnectReloadUndoAndRedo() {',
              'void personalHistoryConvergesAcrossPresenceConflictReconnectReloadUndoAndRedo() throws Throwable {',
          )
          text = text.replace(
              'void sharedUndoRequiresExplicitTargetAndAcknowledgementBeforeBothClientsConverge() {',
              'void sharedUndoRequiresExplicitTargetAndAcknowledgementBeforeBothClientsConverge() throws Throwable {',
          )
          test.write_text(text)

          harness = Path('workbench-screenshot-tests/src/test/java/org/hammer/audio/workbench/screenshot/WorkbenchBrowserHarness.java')
          text = harness.read_text()
          text = text.replace(
              '      context.close();\n    }',
              '      context.close();\n      actors.remove(this);\n    }',
          )
          harness.write_text(text)
          PY
      - name: Apply repository formatter
        run: mvn -B spotless:apply
      - name: Commit fixes and remove one-time workflow
        run: |
          rm .github/workflows/fix-249-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format staged collaboration E2E harness"
          git push origin HEAD:feature/249-two-browser-collaboration-e2e

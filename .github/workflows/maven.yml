name: Java CI with Maven

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  checks: write
  packages: read

jobs:
  build:
    name: Maven verification
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and verify with Maven
        shell: bash
        run: |
          set -o pipefail
          mvn -B clean verify --file pom.xml 2>&1 | tee maven-build.log

      - name: Upload Maven build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maven-build-log
          path: maven-build.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload workbench screenshot failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: workbench-screenshot-failures
          path: workbench-screenshot-tests/target/screenshot-failures/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload JUnit XML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-xml
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Surefire raw reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-raw
          path: |
            **/target/surefire-reports/*.txt
            **/target/surefire-reports/*.dump
            **/target/failsafe-reports/*.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Generate Surefire HTML report
        if: always()
        run: mvn -B surefire-report:report -Daggregate=true
        continue-on-error: true

      - name: Upload Surefire HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-html
          path: |
            **/target/site/surefire-report.html
            **/target/reports/surefire.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish JUnit check summary
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3.0.0
        with:
          name: JUnit Tests
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload JaCoCo reports
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          path: |
            **/target/checkstyle-result.xml
            **/target/spotbugsXml.xml
            **/target/pmd.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          fail_ci_if_error: false
          verbose: true

      - name: Prepare static test and coverage reports
        if: always()
        run: python3 scripts/prepare_ci_reports.py

      - name: Upload publishable reports bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: github-pages-reports
          path: target/gh-pages/
          if-no-files-found: error
          retention-days: 30

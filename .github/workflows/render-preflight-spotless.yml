name: Render preflight Spotless patch

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Apply configured formatter in workspace
        run: mvn -B spotless:apply -DskipTests

      - name: Capture exact patch
        run: |
          git diff -- \
            audio-app/src/main/java/org/hammer/audio/RecordingTap.java \
            audio-app/src/main/java/org/hammer/audio/RecordingPreflight.java \
            audio-app/src/main/java/org/hammer/ExperimentAudioAnalyseFrame.java \
            audio-app/src/test/java/org/hammer/audio/RecordingTapPipelineTest.java \
            audio-app/src/test/java/org/hammer/audio/RecordingPreflightTest.java \
            > preflight-spotless.patch
          test -s preflight-spotless.patch

      - name: Upload patch
        uses: actions/upload-artifact@v7
        with:
          name: preflight-spotless-patch
          path: preflight-spotless.patch
          retention-days: 1

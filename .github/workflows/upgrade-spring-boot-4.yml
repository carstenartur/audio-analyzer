name: Upgrade Spring Boot 4 files

on:
  push:
    branches:
      - feature/241-collaboration-session-api

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/241-collaboration-session-api
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply Spring Boot 4.1 and Jackson 3 migration
        run: |
          sed -i 's#<spring-boot.version>3.3.0</spring-boot.version>#<spring-boot.version>4.1.0</spring-boot.version>#' pom.xml
          grep -RIl 'com.fasterxml.jackson.databind' audio-app/src | xargs -r sed -i 's/com\.fasterxml\.jackson\.databind/tools.jackson.databind/g'
          mvn -B -DskipTests spotless:apply
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Complete Spring Boot 4.1 and Jackson 3 migration'
          git push origin HEAD:feature/241-collaboration-session-api

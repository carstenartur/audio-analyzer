name: Apply SpotBugs Fixes

on:
  push:
    branches:
      - feature/309-311-portable-experiment-document
    paths:
      - .github/workflows/apply-spotbugs-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply defensive-copy and path-safety fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          codec = Path(
              "audio-experiment-document/src/main/java/org/hammer/audio/experiment/document/"
              "ExperimentDocumentCodec.java"
          )
          replace_once(
              codec,
              '''    java.nio.file.Path parent = normalized.getParent();
              if (parent == null) {
                throw new IOException("Experiment document target has no parent: " + normalized);
              }
              java.nio.file.Files.createDirectories(parent);
              java.nio.file.Path temporary =
                  normalized.resolveSibling(normalized.getFileName().toString() + ".partial");
          ''',
              '''    java.nio.file.Path parent = normalized.getParent();
              java.nio.file.Path fileName = normalized.getFileName();
              if (parent == null || fileName == null) {
                throw new IOException("Experiment document target has no parent or filename: " + normalized);
              }
              java.nio.file.Files.createDirectories(parent);
              java.nio.file.Path temporary =
                  normalized.resolveSibling(fileName.toString() + ".partial");
          ''',
          )

          document = Path(
              "audio-experiment-document/src/main/java/org/hammer/audio/experiment/document/"
              "ExperimentDocument.java"
          )
          replace_once(
              document,
              '''    Objects.requireNonNull(provenance, "provenance");
            }

            /**
             * Core human-facing experiment metadata.
          ''',
              '''    Objects.requireNonNull(provenance, "provenance");
            }

            /** Return a fresh deeply immutable copy of plugin-owned sections. */
            @Override
            public Map<String, Map<String, PluginSection>> pluginData() {
              return immutablePluginData(pluginData);
            }

            /**
             * Core human-facing experiment metadata.
          ''',
          )
          replace_once(
              document,
              '''      applicationVersion = requireNonBlank(applicationVersion, "applicationVersion");
              }
            }

            /**
             * Canonical embedded workflow representation.
          ''',
              '''      applicationVersion = requireNonBlank(applicationVersion, "applicationVersion");
              }

              /** Return a fresh immutable copy of the experiment tags. */
              @Override
              public List<String> tags() {
                return List.copyOf(tags);
              }
            }

            /**
             * Canonical embedded workflow representation.
          ''',
          )
          replace_once(
              document,
              '''      if (sections.isEmpty()) {
                throw new IllegalArgumentException("required plugin must declare at least one section");
              }
            }

            /**
             * One versioned plugin-owned section.
          ''',
              '''      if (sections.isEmpty()) {
                throw new IllegalArgumentException("required plugin must declare at least one section");
              }

              /** Return a fresh immutable copy of required section identifiers. */
              @Override
              public List<String> sections() {
                return List.copyOf(sections);
              }
            }

            /**
             * One versioned plugin-owned section.
          ''',
          )
          replace_once(
              document,
              '''      migrationNotes = normalizedStrings(migrationNotes, "migration note");
              }
            }

            private static Map<String, Map<String, PluginSection>> immutablePluginData(
          ''',
              '''      migrationNotes = normalizedStrings(migrationNotes, "migration note");
              }

              /** Return a fresh immutable copy of migration notes. */
              @Override
              public List<String> migrationNotes() {
                return List.copyOf(migrationNotes);
              }
            }

            private static Map<String, Map<String, PluginSection>> immutablePluginData(
          ''',
          )

      - name: Apply repository formatting
        run: mvn -B -pl audio-experiment-document -am -DskipTests spotless:apply

      - name: Commit fixes to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            audio-experiment-document/src/main/java/org/hammer/audio/experiment/document/ExperimentDocument.java \
            audio-experiment-document/src/main/java/org/hammer/audio/experiment/document/ExperimentDocumentCodec.java
          git diff --cached --check
          git commit -m "Fix experiment document representation exposure"
          git push origin "HEAD:${GITHUB_REF_NAME}"

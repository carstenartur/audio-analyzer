name: Temporary Update Run Screenshots

on:
  push:
    branches:
      - feature/275-workflow-run-ux

permissions:
  contents: write
  packages: read

concurrency:
  group: temporary-update-run-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/275-workflow-run-ux
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Make stored commit discovery explicit and non-blocking
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('audio-web-editor/src/WorkflowRunPanel.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "  const [selectedCommitId, setSelectedCommitId] = useState('');\n"
              "  const [status, setStatus] = useState('Ready to capture an immutable run');\n",
              "  const [selectedCommitId, setSelectedCommitId] = useState('');\n"
              "  const [historyStatus, setHistoryStatus] = useState<\n"
              "    'idle' | 'loading' | 'ready' | 'unavailable'\n"
              "  >('idle');\n"
              "  const [historyMessage, setHistoryMessage] = useState(\n"
              "    'Refresh to load exact stored commits.',\n"
              "  );\n"
              "  const [status, setStatus] = useState('Ready to capture an immutable run');\n",
          )

          old_refresh = """  const refreshHistory = useCallback(async () => {
    setLocalError(null);
    try {
      const entries = await getJson<HistoryEntry[]>(
        `/workflow/history?branch=${encodeURIComponent(branch)}&limit=20`,
      );
      setHistory(entries);
      setStatus(`Loaded ${entries.length} historical run source${entries.length === 1 ? '' : 's'}`);
    } catch (failure) {
      setLocalError(problemFor(failure).detail ?? 'Could not load workflow history');
    }
  }, [branch]);

  useEffect(() => {
    void refreshHistory();
  }, [refreshHistory]);
"""
          new_refresh = """  const refreshHistory = useCallback(async () => {
    setHistoryStatus('loading');
    setHistoryMessage('Loading exact stored commits…');
    try {
      const entries = await getJson<HistoryEntry[]>(
        `/workflow/history?branch=${encodeURIComponent(branch)}&limit=20`,
      );
      setHistory(entries);
      setHistoryStatus('ready');
      setHistoryMessage(
        entries.length === 0
          ? `No stored commits are available on branch ${branch}.`
          : `Loaded ${entries.length} exact stored commit${entries.length === 1 ? '' : 's'}.`,
      );
    } catch (failure) {
      const detail = problemFor(failure).detail ?? 'The stored commit history endpoint is unavailable.';
      setHistory([]);
      setSelectedCommitId('');
      setHistoryStatus('unavailable');
      setHistoryMessage(`Stored commit history is optional here: ${detail}`);
    }
  }, [branch]);
"""
          if old_refresh not in text:
              raise SystemExit('Expected automatic history block was not found')
          text = text.replace(old_refresh, new_refresh)

          text = text.replace(
              "        <input value={branch} onChange={(event) => setBranch(event.target.value)} />\n",
              "        <input\n"
              "          value={branch}\n"
              "          onChange={(event) => {\n"
              "            setBranch(event.target.value);\n"
              "            setHistory([]);\n"
              "            setSelectedCommitId('');\n"
              "            setHistoryStatus('idle');\n"
              "            setHistoryMessage('Refresh to load exact stored commits.');\n"
              "          }}\n"
              "        />\n",
          )
          text = text.replace('        disabled={busy}\n        onClick={() => void refreshHistory()}\n', "        disabled={busy || historyStatus === 'loading'}\n        onClick={() => void refreshHistory()}\n", 1)
          text = text.replace(
              "        Refresh run sources\n      </button>\n      <label className=\"field\">\n",
              "        {historyStatus === 'loading' ? 'Loading run sources…' : 'Refresh run sources'}\n"
              "      </button>\n"
              "      <p className=\"help-text\" data-testid=\"run-history-status\">\n"
              "        {historyMessage}\n"
              "      </p>\n"
              "      <label className=\"field\">\n",
          )
          text = text.replace(
              "          disabled={history.length === 0 || busy}\n",
              "          disabled={historyStatus !== 'ready' || history.length === 0 || busy}\n",
          )
          text = text.replace(
              "          {history.length === 0 ? <option value=\"\">No commits on this branch</option> : null}\n",
              "          {history.length === 0 ? (\n"
              "            <option value=\"\">\n"
              "              {historyStatus === 'idle'\n"
              "                ? 'Refresh to load commits'\n"
              "                : historyStatus === 'loading'\n"
              "                  ? 'Loading commits…'\n"
              "                  : historyStatus === 'unavailable'\n"
              "                    ? 'Stored commit history unavailable'\n"
              "                    : 'No commits on this branch'}\n"
              "            </option>\n"
              "          ) : null}\n",
          )

          path.write_text(text, encoding='utf-8')
          PY
          mvn -B -pl audio-web-editor -am spotless:apply
          if git diff --quiet -- audio-web-editor/src/WorkflowRunPanel.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-web-editor/src/WorkflowRunPanel.tsx
          git commit -m "Make stored run history optional (#275)"
          git push origin HEAD:feature/275-workflow-run-ux

      - name: Build packaged application and screenshot tests
        run: mvn -B -Pscreenshot-tests -DskipTests install -pl workbench-screenshot-tests -am

      - name: Install Playwright Chromium
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Reproduce intentional documentation baselines
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          -DupdateScreenshots=true verify

      - name: Commit updated documentation screenshots
        run: |
          if git diff --quiet -- docs/assets/screenshots/workbench; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/screenshots/workbench
          git commit -m "Update workbench run screenshots (#275)"
          git push origin HEAD:feature/275-workflow-run-ux

name: Temporary PR Format

on:
  push:
    branches:
      - feature/274-deterministic-audio-backend

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/274-deterministic-audio-backend
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply repository formatter
        run: mvn --batch-mode --no-transfer-progress spotless:apply

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Apply repository formatting (#274)"
          git push origin HEAD:feature/274-deterministic-audio-backend

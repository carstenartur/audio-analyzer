name: Apply issue 350 concurrent append recovery

on:
  pull_request:
    branches: [ master ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-issue350-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker
        run: docker info

      - name: Apply bounded recovery repair
        run: python3 .github/scripts/apply-issue350-concurrent-append-fix.py

      - name: Format repaired Java sources
        run: mvn -B -pl audio-app -am spotless:apply -DskipTests

      - name: Build application dependencies
        run: mvn -B -pl audio-app -am install -DskipTests

      - name: Run existing and PostgreSQL concurrency contracts
        run: |
          mvn -B -pl audio-app test \
            -Dtest=HibernateWorkflowSessionStateStoreTest,HibernateWorkflowSessionStateStorePostgreSqlConcurrencyTest

      - name: Remove one-shot repair tooling
        run: |
          rm .github/scripts/apply-issue350-concurrent-append-fix.py
          rm .github/workflows/apply-issue350-concurrent-append-fix.yml

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            audio-app/src/main/java/org/hammer/audio/infrastructure/workflow/collaboration/store/HibernateWorkflowSessionStateStore.java \
            audio-app/src/test/java/org/hammer/audio/infrastructure/workflow/collaboration/store/HibernateWorkflowSessionStateStorePostgreSqlConcurrencyTest.java \
            .github/scripts/apply-issue350-concurrent-append-fix.py \
            .github/workflows/apply-issue350-concurrent-append-fix.yml
          if git diff --cached --quiet; then
            echo 'Expected issue #350 repair produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'Synchronize concurrent append recovery'
          git push origin "HEAD:${HEAD_REF}"

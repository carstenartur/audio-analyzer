name: Diagnose PR 264 core gate

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    if: github.head_ref == 'feature/263-collaboration-recovery'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Run audio-core gate
        id: verify
        shell: bash
        run: |
          set +e
          mvn -B -pl audio-core -am clean verify --file pom.xml 2>&1 | tee /tmp/pr264-core.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload complete core log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr264-core-log
          path: /tmp/pr264-core.log
          if-no-files-found: error
          retention-days: 3

      - name: Preserve core gate result
        if: steps.verify.outputs.status != '0'
        run: exit 1

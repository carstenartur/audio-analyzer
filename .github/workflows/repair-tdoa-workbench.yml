name: Repair TDOA Workbench Integration

on:
  push:
    branches:
      - feature/138-advanced-localization-algorithms
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: repair-tdoa-workbench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/138-advanced-localization-algorithms
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Apply the bounded repair script
        run: |
          python3 <<'RUN'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/workbench-screenshots.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          if workflow.count(marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('repair script markers are missing or ambiguous')
          script = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), 'tdoa-workbench-repair', 'exec'))
          RUN

          mvn -B -pl audio-experimental-acoustic -am spotless:apply
          mvn -B -pl audio-experimental-acoustic -am test

      - name: Restore read-only workflows and commit
        run: |
          git checkout origin/master -- .github/workflows/workbench-screenshots.yml
          git rm .github/workflows/repair-tdoa-workbench.yml
          allowed='^(audio-experimental-acoustic/src/main/java/org/hammer/audio/experimental/acoustic/workbench/(WorkbenchRunExporter|AcousticLocalizationWorkbenchPanel)\.java|\.github/workflows/(workbench-screenshots|repair-tdoa-workbench)\.yml)$'
          unexpected=$(git diff --name-only | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected repair changes:\n%s\n' "$unexpected"
            exit 1
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-experimental-acoustic/src/main/java/org/hammer/audio/experimental/acoustic/workbench/WorkbenchRunExporter.java
          git add audio-experimental-acoustic/src/main/java/org/hammer/audio/experimental/acoustic/workbench/AcousticLocalizationWorkbenchPanel.java
          git add .github/workflows/workbench-screenshots.yml
          git commit -m "Expose TDOA consistency evidence in workbench (#138)"
          git push origin HEAD:feature/138-advanced-localization-algorithms

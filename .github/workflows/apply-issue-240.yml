name: Apply issue 240 Hibernate persistence

on:
  push:
    branches:
      - feature/240-hibernate-jgit-persistence
  pull_request:
    branches:
      - master

permissions:
  contents: write
  packages: read

concurrency:
  group: feature-240-hibernate-jgit-persistence
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/240-hibernate-jgit-persistence

      - name: Set up JDK 21 and GitHub Packages authentication
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Apply source bundle
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/issue240/part*.b64 > /tmp/issue-240-files.b64
          python3 <<'PY'
          from pathlib import Path

          path = Path('/tmp/issue-240-files.b64')
          content = path.read_text(encoding='ascii')
          old = 'WLXr4snoww'
          new = 'WLXr4Snoww'
          if content.count(old) != 1:
              raise SystemExit('Unexpected issue 240 bundle transport content')
          path.write_text(content.replace(old, new), encoding='ascii')
          PY
          base64 --decode /tmp/issue-240-files.b64 > /tmp/issue-240-files.tar.gz
          echo '8f6b4e59debbb71805966adfd3f5c56c2276c6b500046e50a21dc8a78b38417c  /tmp/issue-240-files.tar.gz' | sha256sum --check
          tar -xzf /tmp/issue-240-files.tar.gz
          while IFS= read -r path; do
            [[ -z "$path" ]] || rm -f "$path"
          done < .issue-240-delete
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              'audio-app/src/main/java/org/hammer/audio/app/'
              'WorkflowPersistenceConfiguration.java'
          )
          content = path.read_text(encoding='utf-8')
          class_marker = 'public class WorkflowPersistenceConfiguration {\n'
          constant = (
              class_marker
              + '\n  private static final String PERSISTENCE_MODE_PROPERTY = '
              + '"workbench.persistence.mode";\n'
          )
          if content.count(class_marker) != 1:
              raise SystemExit('Unexpected WorkflowPersistenceConfiguration class declaration')
          content = content.replace(class_marker, constant, 1)
          annotation_literal = 'name = "workbench.persistence.mode"'
          if content.count(annotation_literal) != 4:
              raise SystemExit('Unexpected persistence mode annotation count')
          content = content.replace(annotation_literal, 'name = PERSISTENCE_MODE_PROPERTY')
          message_literal = '"workbench.persistence.mode=hibernate requires spring.datasource.url "'
          if content.count(message_literal) != 1:
              raise SystemExit('Unexpected persistence mode error message')
          content = content.replace(
              message_literal,
              'PERSISTENCE_MODE_PROPERTY + "=hibernate requires spring.datasource.url "',
          )
          path.write_text(content, encoding='utf-8')
          PY
          rm .issue-240-delete
          rm -rf .github/issue240
          rm .github/workflows/apply-issue-240.yml

      - name: Apply repository formatting
        run: mvn -B spotless:apply --file pom.xml

      - name: Build and verify implementation
        id: verify
        shell: bash
        run: |
          set +e
          mvn -B clean verify --file pom.xml 2>&1 | tee /tmp/issue-240-maven.log
          status=${PIPESTATUS[0]}
          if (( status == 0 )); then
            echo 'result=success' >> "$GITHUB_OUTPUT"
          else
            echo 'result=failure' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Archive formatted implementation
        if: always()
        run: tar --exclude=.git --exclude=target --exclude='*/target' -czf /tmp/audio-analyzer-issue-240-source.tar.gz .

      - name: Upload formatted implementation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-240-formatted-source
          path: /tmp/audio-analyzer-issue-240-source.tar.gz
          retention-days: 7

      - name: Upload Maven verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-240-maven-log
          path: /tmp/issue-240-maven.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified implementation
        if: steps.verify.outputs.result == 'success'
        shell: bash
        run: |
          # GitHub App tokens cannot update workflow files in this source commit.
          # Keep the checked-in workflows unchanged; the repository connector applies
          # the separately verified CI changes after this commit lands.
          git restore --source=HEAD -- .github/workflows
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Wire production workbench to Hibernate-backed JGit store (#240)'
          git push origin HEAD:feature/240-hibernate-jgit-persistence

      - name: Fail when verification failed
        if: steps.verify.outputs.result != 'success'
        run: exit 1

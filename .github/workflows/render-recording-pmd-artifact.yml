name: Capture recording PMD refactor

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Reuse bounded refactor script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/render-recording-pmd-refactor.yml').read_text(encoding='utf-8')
          step = workflow.index('      - name: Apply PMD-oriented recording refactor')
          block = workflow.index('        run: |\n', step) + len('        run: |\n')
          end = workflow.index('\n      - name: Apply repository formatter', block)
          script = dedent(workflow[block:end])
          Path('/tmp/apply-recording-pmd-refactor.sh').write_text(
              '#!/usr/bin/env bash\nset -euo pipefail\n' + script,
              encoding='utf-8')
          PY
          bash /tmp/apply-recording-pmd-refactor.sh

      - name: Preserve injected runtime storage probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('audio-app/src/main/java/org/hammer/audio/RecordingTap.java')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    RecordingStorageStatus preflight = RecordingPreflight.inspect(service, file);\n'
                  '    return start(service, file, DEFAULT_QUEUE_CAPACITY, preflight, Instant.now());\n',
                  '    Instant startedAt = Instant.now();\n'
                  '    RecordingStorageProbe storageProbe = RecordingPreflight.productionProbe();\n'
                  '    return start(service, file, DEFAULT_QUEUE_CAPACITY, storageProbe, startedAt);\n'
              ),
              (
                  '    return start(service, file, queueCapacity, preflight, startedAt);\n',
                  '    return start(service, file, queueCapacity, storageProbe, preflight, startedAt);\n'
              ),
              (
                  '      int queueCapacity,\n'
                  '      RecordingStorageStatus preflight,\n'
                  '      Instant startedAt)\n',
                  '      int queueCapacity,\n'
                  '      RecordingStorageProbe storageProbe,\n'
                  '      RecordingStorageStatus preflight,\n'
                  '      Instant startedAt)\n'
              ),
              (
                  '    Objects.requireNonNull(preflight, "preflight");\n',
                  '    Objects.requireNonNull(storageProbe, "storageProbe");\n'
                  '    Objects.requireNonNull(preflight, "preflight");\n'
              ),
              (
                  '    RecordingStorageProbe storageProbe = RecordingPreflight.productionProbe();\n\n'
                  '    AudioBlockRecordingWriter writer = AudioBlockRecordingWriter.open(file);\n',
                  '    AudioBlockRecordingWriter writer = AudioBlockRecordingWriter.open(file);\n'
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply repository formatter
        run: mvn -B spotless:apply -DskipTests

      - name: Verify audio-app PMD and compilation
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mvn -B -pl audio-app -am -DskipTests compile pmd:check 2>&1 | tee recording-pmd.log

      - name: Upload formatted sources and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recording-pmd-refactor-artifact
          path: |
            recording-pmd.log
            audio-app/src/main/java/org/hammer/ExperimentAudioAnalyseFrame.java
            audio-app/src/main/java/org/hammer/audio/AudioBlockBroadcaster.java
            audio-app/src/main/java/org/hammer/audio/RecordingBlockQueue.java
            audio-app/src/main/java/org/hammer/audio/RecordingStatusListeners.java
            audio-app/src/main/java/org/hammer/audio/RecordingPreflight.java
            audio-app/src/main/java/org/hammer/audio/RecordingTap.java
            audio-app/src/main/java/org/hammer/audio/recording/runtime/RecordingStorageStatus.java
            audio-app/src/main/java/org/hammer/audio/recording/runtime/FileStoreRecordingStorageProbe.java
          retention-days: 1

      - name: Preserve verification result
        if: steps.verify.outcome != 'success'
        run: exit 1

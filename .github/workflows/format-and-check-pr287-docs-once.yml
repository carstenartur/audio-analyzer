name: Format and check PR 287 docs once

on:
  pull_request:
    paths:
      - '.github/workflows/format-and-check-pr287-docs-once.yml'

permissions:
  contents: write

jobs:
  docs:
    if: github.event.pull_request.number == 287 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/249-two-browser-collaboration-e2e
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply repository formatters
        run: |
          mvn -B spotless:apply
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests spotless:apply
      - name: Verify repository-local documentation links
        run: mvn -B -pl audio-app -am -Dtest=DocumentationLinkTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/format-and-check-pr287-docs-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format and validate public documentation"
          git push origin HEAD:feature/249-two-browser-collaboration-e2e

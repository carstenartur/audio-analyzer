name: PR 278 Maven diagnostic

on:
  pull_request:
    branches: [ "master" ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Run Maven and retain the complete log
        id: maven
        shell: bash
        run: |
          set -o pipefail
          mvn -B clean verify --file pom.xml 2>&1 | tee maven-verify.log

      - name: Upload Maven log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr278-maven-verify-log
          path: maven-verify.log
          if-no-files-found: error
          retention-days: 1

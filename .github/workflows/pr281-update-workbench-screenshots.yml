name: PR 281 update workbench screenshots

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write
  packages: read

jobs:
  update-screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Exclude generated frontend trees from root Markdown formatting
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          pom = Path('pom.xml')
          source = pom.read_text(encoding='utf-8')
          if '<exclude>**/node_modules/**</exclude>' not in source:
            pattern = re.compile(
                r'(<markdown>\s*<includes>\s*<include>\*\*/\*\.md</include>\s*</includes>)'
                r'(\s*<flexmark\s*/>)'
            )
            replacement = (
                r'\1\n            <excludes>\n'
                r'              <exclude>**/node_modules/**</exclude>\n'
                r'              <exclude>**/target/**</exclude>\n'
                r'            </excludes>\2'
            )
            source, replacements = pattern.subn(replacement, source, count=1)
            if replacements != 1:
              raise SystemExit('root Spotless Markdown configuration not found')
            pom.write_text(source, encoding='utf-8')
          PY

      - name: Format maintained screenshot sources and documentation
        run: mvn -B -Pscreenshot-tests spotless:apply --file pom.xml

      - name: Install screenshot-test reactor artifacts
        run: >-
          mvn -B -Pscreenshot-tests -Dmaven.test.skip=true
          -Dspotless.check.skip=true -Dcheckstyle.skip=true -Dpmd.skip=true
          -Dspotbugs.skip=true -Djacoco.skip=true install
          -pl workbench-screenshot-tests -am --file pom.xml

      - name: Install Playwright Chromium and system dependencies
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Generate screenshots through integration tests
        id: screenshots
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mvn -B -Pscreenshot-tests verify -DupdateScreenshots=true --file pom.xml 2>&1 | tee screenshot-update.log

      - name: Upload screenshot integration diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr281-screenshot-update-evidence
          path: |
            screenshot-update.log
            workbench-screenshot-tests/target/failsafe-reports/
            workbench-screenshot-tests/target/screenshot-failures/
            docs/assets/screenshots/workbench/
          if-no-files-found: warn
          retention-days: 1

      - name: Stop after a failed screenshot integration test
        if: steps.screenshots.outcome != 'success'
        run: exit 1

      - name: Commit generated documentation screenshots and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/pr281-update-workbench-screenshots.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            pom.xml \
            README.md \
            audio-web-editor/README.md \
            audio-web-editor/src/CollaborationPanel.tsx \
            docs/architecture/README.md \
            docs/architecture/react-flow-session-client.md \
            docs/workbench-screenshot-pipeline.md \
            workbench-screenshot-tests/src/test/java/org/hammer/audio/workbench/screenshot/WorkbenchCollaborationScreenshotIT.java \
            docs/assets/screenshots/workbench \
            .github/workflows/pr281-update-workbench-screenshots.yml
          if git diff --cached --quiet; then
            echo "Screenshot integration tests produced no changed baselines."
            exit 1
          fi
          git commit -m "docs: update integration-generated workbench screenshots"
          git push origin HEAD:${{ github.head_ref }}

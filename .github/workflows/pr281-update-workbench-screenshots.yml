name: PR 281 update workbench screenshots

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  update-screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Install Playwright Chromium and system dependencies
        id: playwright-install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests \
            org.codehaus.mojo:exec-maven-plugin:3.5.0:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.classpathScope=test \
            -Dexec.args="install --with-deps chromium" 2>&1 | tee playwright-install.log

      - name: Show Playwright install diagnostics
        if: always()
        run: tail -n 200 playwright-install.log || true

      - name: Upload Playwright install diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr281-playwright-install-log
          path: playwright-install.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after a failed Playwright installation
        if: steps.playwright-install.outcome != 'success'
        run: exit 1

      - name: Generate screenshots through integration tests
        run: mvn -B -Pscreenshot-tests verify -DupdateScreenshots=true --file pom.xml

      - name: Commit generated documentation screenshots and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/pr281-update-workbench-screenshots.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/assets/screenshots/workbench .github/workflows/pr281-update-workbench-screenshots.yml
          if git diff --cached --quiet; then
            echo "Screenshot integration tests produced no changed baselines."
            exit 1
          fi
          git commit -m "docs: update integration-generated workbench screenshots"
          git push origin HEAD:${{ github.head_ref }}

name: Update PR 287 collaboration screenshot once

on:
  pull_request:
    paths:
      - '.github/workflows/update-pr287-collaboration-screenshot-once.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.number == 287 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/249-two-browser-collaboration-e2e
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format screenshot scenario
        run: mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests spotless:apply
      - name: Build packaged application and screenshot-test reactor
        run: >-
          mvn -B -Pscreenshot-tests -DskipTests install
          -pl workbench-screenshot-tests -am
      - name: Install Playwright Chromium
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"
      - name: Generate collaboration screenshot from asserted packaged state
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests
          -Dit.test=WorkbenchCollaborationScreenshotIT
          -DupdateScreenshots=true verify
      - name: Upload generated screenshot for visual review
        uses: actions/upload-artifact@v7
        with:
          name: pr-287-collaboration-screenshot
          path: docs/assets/screenshots/workbench/collaboration-session.png
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated baseline and remove helper
        run: |
          rm .github/workflows/update-pr287-collaboration-screenshot-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: update generated collaboration session screenshot"
          git pull --rebase origin feature/249-two-browser-collaboration-e2e
          git push origin HEAD:feature/249-two-browser-collaboration-e2e

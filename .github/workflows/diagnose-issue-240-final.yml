name: Diagnose issue 240 final Maven gate

on:
  push:
    branches:
      - feature/240-hibernate-jgit-persistence

permissions:
  contents: write
  packages: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Run complete Maven gate
        id: verify
        shell: bash
        run: |
          set +e
          mvn -B clean verify --file pom.xml 2>&1 | tee /tmp/issue-240-final-maven.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture diagnostics and remove workflow
        if: always()
        shell: bash
        run: |
          cp /tmp/issue-240-final-maven.log .github/issue-240-final-maven.log
          rm .github/workflows/diagnose-issue-240-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/issue-240-final-maven.log .github/workflows/diagnose-issue-240-final.yml
          git commit -m 'Capture final issue 240 Maven diagnostics [skip ci]'
          git push origin HEAD:feature/240-hibernate-jgit-persistence

      - name: Preserve Maven gate result
        if: steps.verify.outputs.status != '0'
        run: exit 1

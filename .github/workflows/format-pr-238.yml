name: Format PR 238

on:
  push:
    branches:
      - copilot/implement-issue-207-and-newer-issues

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: copilot/implement-issue-207-and-newer-issues
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply repository formatting
        run: mvn -B -DskipTests spotless:apply
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply repository formatting"
          git push origin HEAD:copilot/implement-issue-207-and-newer-issues

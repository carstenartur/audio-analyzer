name: Prepare experiment recording UI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Integrate persistent recording status and v2 file UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('audio-app/src/main/java/org/hammer/AudioAnalyseFrame.java')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '  private final DiagnosisPanel diagnosisPanel = new DiagnosisPanel();\n',
              '  private final DiagnosisPanel diagnosisPanel = new DiagnosisPanel();\n'
              '  private final RecordingStatusPanel recordingStatusPanel = new RecordingStatusPanel();\n')

          replace_once(
              '    mntmStartRecording.setToolTipText(\n'
              '        "Capture every produced AudioBlock into an .aar file for later replay or A/B compare.");',
              '    mntmStartRecording.setToolTipText(\n'
              '        "Record every produced AudioBlock into an integrity-protected .aarec file.");')
          replace_once(
              '    mntmOpenRecording.setToolTipText("Replay a previously captured .aar file as the audio source.");',
              '    mntmOpenRecording.setToolTipText(\n'
              '        "Inspect and replay a current .aarec or legacy .aar recording.");')
          replace_once(
              '        "Compare measurement, spectrum and diagnosis of two .aar recordings and render a"',
              '        "Compare measurement, spectrum and diagnosis of two recordings and render a"')

          replace_once(
              '    contentPane.add(slider, BorderLayout.SOUTH);',
              '    JPanel south = new JPanel(new BorderLayout(4, 4));\n'
              '    south.add(slider, BorderLayout.NORTH);\n'
              '    recordingStatusPanel.setStopAction(this::stopRecording);\n'
              '    south.add(recordingStatusPanel, BorderLayout.SOUTH);\n'
              '    contentPane.add(south, BorderLayout.SOUTH);')

          replace_once(
              '    chooser.setFileFilter(new FileNameExtensionFilter("AudioAnalyzer recording (*.aar)", "aar"));\n'
              '    chooser.setSelectedFile(new java.io.File("recording.aar"));',
              '    chooser.setFileFilter(\n'
              '        new FileNameExtensionFilter("AudioAnalyzer recording (*.aarec)", "aarec"));\n'
              '    chooser.setSelectedFile(new java.io.File("recording.aarec"));')
          replace_once(
              '    java.io.File file = ensureExtension(chooser.getSelectedFile(), ".aar");\n'
              '    try {\n'
              '      recordingTap =\n'
              '          org.hammer.audio.RecordingTap.start(\n'
              '              audioCaptureService, file.toPath(), UiConstants.REFRESH_INTERVAL_MS);\n'
              '      JOptionPane.showMessageDialog(\n'
              '          this,\n'
              '          "Recording to " + file + " (Stop recording when done).",\n'
              '          "Recording",\n'
              '          JOptionPane.INFORMATION_MESSAGE);',
              '    java.io.File file = ensureExtension(chooser.getSelectedFile(), ".aarec");\n'
              '    try {\n'
              '      recordingTap = org.hammer.audio.RecordingTap.start(audioCaptureService, file.toPath());\n'
              '      recordingTap.addStatusListener(\n'
              '          status ->\n'
              '              SwingUtilities.invokeLater(() -> recordingStatusPanel.updateStatus(status)));')

          replace_once(
              '      long blocks = recordingTap.blocksWritten();\n'
              '      java.nio.file.Path file = recordingTap.file();\n'
              '      recordingTap.stop();\n'
              '      JOptionPane.showMessageDialog(\n'
              '          this,\n'
              '          "Recording stopped (" + blocks + " blocks written to " + file + ").",\n'
              '          "Recording",\n'
              '          JOptionPane.INFORMATION_MESSAGE);',
              '      recordingTap.stop();\n'
              '      org.hammer.audio.recording.runtime.RecordingStatus status = recordingTap.status();\n'
              '      String summary =\n'
              '          "Recording "\n'
              '              + status.state().name().toLowerCase(Locale.ROOT)\n'
              '              + ": "\n'
              '              + status.writtenBlocks()\n'
              '              + "/"\n'
              '              + status.receivedBlocks()\n'
              '              + " blocks written; "\n'
              '              + status.droppedBlocks()\n'
              '              + " dropped; "\n'
              '              + status.continuityGapCount()\n'
              '              + " continuity gaps.\\n"\n'
              '              + status.destination();\n'
              '      JOptionPane.showMessageDialog(\n'
              '          this,\n'
              '          summary,\n'
              '          "Recording",\n'
              '          status.state() == org.hammer.audio.recording.runtime.RecordingState.COMPLETED\n'
              '              ? JOptionPane.INFORMATION_MESSAGE\n'
              '              : JOptionPane.WARNING_MESSAGE);')

          replace_once(
              '    chooser.setFileFilter(new FileNameExtensionFilter("AudioAnalyzer recording (*.aar)", "aar"));\n'
              '    if (chooser.showOpenDialog(this) != JFileChooser.APPROVE_OPTION) {',
              '    chooser.setFileFilter(\n'
              '        new FileNameExtensionFilter(\n'
              '            "AudioAnalyzer recordings (*.aarec, *.aar)", "aarec", "aar"));\n'
              '    if (chooser.showOpenDialog(this) != JFileChooser.APPROVE_OPTION) {')
          replace_once(
              '    java.io.File file = chooser.getSelectedFile();\n'
              '    try {\n'
              '      org.hammer.audio.RecordedAudioCaptureService replay =',
              '    java.io.File file = chooser.getSelectedFile();\n'
              '    try {\n'
              '      org.hammer.audio.recording.RecordingInspection inspection =\n'
              '          org.hammer.audio.recording.AudioBlockRecordingReader.inspect(file.toPath());\n'
              '      if (inspection.integrity()\n'
              '          == org.hammer.audio.recording.RecordingIntegrity.RECOVERABLE_INCOMPLETE\n'
              '          || inspection.integrity() == org.hammer.audio.recording.RecordingIntegrity.CORRUPT) {\n'
              '        JOptionPane.showMessageDialog(\n'
              '            this,\n'
              '            "Recording is "\n'
              '                + inspection.integrity()\n'
              '                + ". Recover it to a separate file before replay.\\n"\n'
              '                + inspection.detail(),\n'
              '            "Recording integrity",\n'
              '            JOptionPane.ERROR_MESSAGE);\n'
              '        return;\n'
              '      }\n'
              '      if (inspection.integrity()\n'
              '          == org.hammer.audio.recording.RecordingIntegrity.LEGACY_UNVERIFIED) {\n'
              '        int choice =\n'
              '            JOptionPane.showConfirmDialog(\n'
              '                this,\n'
              '                "This legacy .aar recording has no completion checksum. Replay it anyway?",\n'
              '                "Legacy recording",\n'
              '                JOptionPane.YES_NO_OPTION,\n'
              '                JOptionPane.WARNING_MESSAGE);\n'
              '        if (choice != JOptionPane.YES_OPTION) {\n'
              '          return;\n'
              '        }\n'
              '      }\n'
              '      org.hammer.audio.RecordedAudioCaptureService replay =')
          text = text.replace(
              'new FileNameExtensionFilter("AudioAnalyzer recording (*.aar)", "aar")',
              'new FileNameExtensionFilter(\n'
              '            "AudioAnalyzer recordings (*.aarec, *.aar)", "aarec", "aar")')
          text = text.replace(
              "keep polling the previous source and silently corrupt the recording.",
              "remain subscribed to the previous source.")

          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply repository formatter
        run: mvn -B spotless:apply -DskipTests

      - name: Compile patched reactor
        run: mvn -B -DskipTests compile

      - name: Upload patched and formatted sources
        uses: actions/upload-artifact@v7
        with:
          name: experiment-recording-patched-sources
          path: |
            audio-app/src/main/java/org/hammer/AudioAnalyseFrame.java
            audio-app/src/main/java/org/hammer/RecordingStatusPanel.java
            audio-app/src/main/java/org/hammer/audio/AudioBlockBroadcaster.java
            audio-app/src/main/java/org/hammer/audio/AudioBlockListener.java
            audio-app/src/main/java/org/hammer/audio/AudioBlockSubscription.java
            audio-app/src/main/java/org/hammer/audio/AudioCaptureService.java
            audio-app/src/main/java/org/hammer/audio/AudioCaptureServiceImpl.java
            audio-app/src/main/java/org/hammer/audio/DemoAudioCaptureService.java
            audio-app/src/main/java/org/hammer/audio/RecordedAudioCaptureService.java
            audio-app/src/main/java/org/hammer/audio/RecordingTap.java
            audio-app/src/main/java/org/hammer/audio/recording/runtime/
            audio-app/src/test/java/org/hammer/audio/RecordingTapPipelineTest.java
            audio-dsp/src/main/java/org/hammer/audio/recording/AudioBlockRecordingFormat.java
            audio-dsp/src/main/java/org/hammer/audio/recording/AudioBlockRecordingReader.java
            audio-dsp/src/main/java/org/hammer/audio/recording/AudioBlockRecordingWriter.java
            audio-dsp/src/main/java/org/hammer/audio/recording/RecordingInspection.java
            audio-dsp/src/main/java/org/hammer/audio/recording/RecordingIntegrity.java
            audio-dsp/src/test/java/org/hammer/audio/recording/AudioBlockRecordingRoundTripTest.java
          retention-days: 1

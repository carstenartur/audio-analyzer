name: Fix PR 287 reload wait once

on:
  pull_request:
    paths:
      - '.github/workflows/fix-pr287-reload-wait-once.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 287 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/249-two-browser-collaboration-e2e
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add deterministic React render waits
        shell: python
        run: |
          from pathlib import Path
          path = Path('workbench-screenshot-tests/src/test/java/org/hammer/audio/workbench/screenshot/WorkbenchTwoBrowserCollaborationIT.java')
          text = path.read_text()
          old = '''      waitForRevision(bob.page(), 4);
                assertEquals(1, bob.page().locator(GENERATOR_SELECTOR).count());
                assertEquals(1, bob.page().locator(GAIN_SELECTOR).count());
                assertEquals(
          '''
          new = '''      waitForRevision(bob.page(), 4);
                bob.page().locator(GENERATOR_SELECTOR).first().waitFor();
                bob.page().locator(GAIN_SELECTOR).first().waitFor();
                assertEquals(1, bob.page().locator(GENERATOR_SELECTOR).count());
                assertEquals(1, bob.page().locator(GAIN_SELECTOR).count());
                assertEquals(
          '''
          if old not in text:
              raise SystemExit('target reload block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Format optional browser module
        run: mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests spotless:apply
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/fix-pr287-reload-wait-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workbench-screenshot-tests/src/test/java/org/hammer/audio/workbench/screenshot/WorkbenchTwoBrowserCollaborationIT.java .github/workflows/fix-pr287-reload-wait-once.yml
          git commit -m "test: await restored collaboration nodes after reload"
          git push origin HEAD:feature/249-two-browser-collaboration-e2e

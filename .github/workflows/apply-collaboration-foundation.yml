name: Apply collaboration foundation

on:
  push:
    branches:
      - feature/239-complete-collaborative-platform

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/239-complete-collaborative-platform
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate collaboration core
        run: python3 .github/scripts/generate_collaboration_core.py
      - name: Generate Spring JDBC and SSE adapters
        run: python3 .github/scripts/generate_collaboration_app.py
      - name: Apply repository formatting
        run: mvn -B -DskipTests spotless:apply
      - name: Remove temporary generator/export files
        run: |
          rm -f .github/workflows/export-feature-239-source.yml
          rm -f .github/workflows/apply-collaboration-foundation.yml
          rm -f .github/scripts/generate_collaboration_core.py
          rm -f .github/scripts/generate_collaboration_app.py
      - name: Commit generated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Implement revisions, SSE, undo/redo and transactional session outbox'
          git push origin HEAD:feature/239-complete-collaborative-platform
      - name: Verify focused modules
        run: mvn -B -pl audio-core,audio-app -am test

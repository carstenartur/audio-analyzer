name: PR 281 final Spotless normalization

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write
  packages: read

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Apply repository formatting
        run: mvn -B -Pscreenshot-tests spotless:apply --file pom.xml

      - name: Commit normalized documentation and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/pr281-final-spotless-normalization.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audio-web-editor/README.md .github/workflows/pr281-final-spotless-normalization.yml
          if git diff --cached --quiet; then
            echo "Spotless produced no documentation change."
            exit 1
          fi
          git commit -m "style(docs): apply final Spotless normalization"
          git push origin HEAD:${{ github.head_ref }}

name: Prepare PR 287 history screenshots once

on:
  pull_request:
    paths:
      - '.github/workflows/prepare-pr287-history-screenshots-once.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.number == 287 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/249-two-browser-collaboration-e2e
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Add semantic and deterministic history timestamps
        shell: python
        run: |
          from pathlib import Path

          panel = Path('audio-web-editor/src/WorkflowHistoryPanel.tsx')
          text = panel.read_text()
          replacements = {
              '<dd>{timestamp(operation.occurredAt)}</dd>': '''<dd>
                    <time className="history-timestamp" dateTime={operation.occurredAt}>
                      {timestamp(operation.occurredAt)}
                    </time>
                  </dd>''',
              "{actorLabel(collaboration, operation.actorId)} · {timestamp(operation.occurredAt)}": '''{actorLabel(collaboration, operation.actorId)} ·{' '}
                        <time className="history-timestamp" dateTime={operation.occurredAt}>
                          {timestamp(operation.occurredAt)}
                        </time>''',
              '<dd>{timestamp(preview.value.targetOccurredAt)}</dd>': '''<dd>
                      <time className="history-timestamp" dateTime={preview.value.targetOccurredAt}>
                        {timestamp(preview.value.targetOccurredAt)}
                      </time>
                    </dd>''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'history timestamp target not found: {old}')
              text = text.replace(old, new, 1)
          panel.write_text(text)

          screenshot = Path('workbench-screenshot-tests/src/test/java/org/hammer/audio/workbench/screenshot/WorkbenchHistoryScreenshotIT.java')
          text = screenshot.read_text()
          text = text.replace(
              '      assertTrue(page.locator("[data-testid=\'history-confirm-button\']").isEnabled());\n\n      disableAnimations(page);',
              '      assertTrue(page.locator("[data-testid=\'history-confirm-button\']").isEnabled());\n      normalizeHistoryTimestamps(page);\n\n      disableAnimations(page);',
              1,
          )
          text = text.replace(
              '      assertTrue(dialog.innerText().contains("Workflow Owner"));\n\n      disableAnimations(reviewer.page());',
              '      assertTrue(dialog.innerText().contains("Workflow Owner"));\n      normalizeHistoryTimestamps(reviewer.page());\n\n      disableAnimations(reviewer.page());',
              1,
          )
          marker = '  private static void disableAnimations(Page page) {'
          helper = '''  private static void normalizeHistoryTimestamps(Page page) {
            page.evaluate(
                "document.querySelectorAll('time.history-timestamp').forEach(element => "
                    + "{ element.textContent = '19 Jul 2026, 12:00 UTC'; });");
            assertTrue(page.locator("time.history-timestamp").count() > 0);
          }

          '''
          if marker not in text:
              raise SystemExit('screenshot helper insertion marker not found')
          screenshot.write_text(text.replace(marker, helper + marker, 1))
      - name: Verify frontend and format browser tests
        run: |
          mvn -B -pl audio-web-editor -am -DskipTests package
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests spotless:apply
      - name: Commit screenshot preparation and remove helper
        run: |
          rm .github/workflows/prepare-pr287-history-screenshots-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audio-web-editor/src/WorkflowHistoryPanel.tsx workbench-screenshot-tests/src/test/java/org/hammer/audio/workbench/screenshot/WorkbenchHistoryScreenshotIT.java .github/workflows/prepare-pr287-history-screenshots-once.yml
          git commit -m "test: make collaboration history screenshots reproducible"
          git push origin HEAD:feature/249-two-browser-collaboration-e2e

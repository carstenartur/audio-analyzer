name: PR 283 audio-core diagnostic

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    if: github.head_ref == 'feature/271-durable-semantic-undo-redo'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify audio-core and retain complete log
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mvn -B -pl audio-core -am clean verify --file pom.xml 2>&1 | tee pr283-audio-core.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr283-audio-core-log
          path: pr283-audio-core.log
          if-no-files-found: error
          retention-days: 1

      - name: Propagate verification failure
        if: steps.verify.outcome != 'success'
        run: exit 1

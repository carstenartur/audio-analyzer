name: Format 249 browser module once

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feature/249-two-browser-collaboration-e2e'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/249-two-browser-collaboration-e2e
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply browser module formatter
        run: >-
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests spotless:apply
      - name: Commit formatting and remove one-time workflow
        run: |
          rm .github/workflows/format-249-module-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format staged collaboration browser tests"
          git push origin HEAD:feature/249-two-browser-collaboration-e2e

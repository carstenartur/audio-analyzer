name: Fix Experiment Document PMD

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/fix-experiment-document-pmd.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply focused PMD cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("audio-experiment-document/src/main/java/org/hammer/audio/experiment/document")

          def read(name: str) -> str:
              return (root / name).read_text(encoding="utf-8")

          def write(name: str, text: str) -> None:
              (root / name).write_text(text, encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match for {label}, found {count}")
              return text.replace(old, new)

          def annotate(name: str, type_name: str, rules: list[str]) -> None:
              text = read(name)
              pattern = re.compile(
                  rf"(?m)^(?P<decl>(?:public\s+)?(?:final\s+)?(?:class|record)\s+{type_name}\b)"
              )
              match = pattern.search(text)
              if not match:
                  raise RuntimeError(f"Type declaration for {type_name} not found")
              if len(rules) == 1:
                  annotation = f'@SuppressWarnings("PMD.{rules[0]}")\n'
              else:
                  joined = ", ".join(f'"PMD.{rule}"' for rule in rules)
                  annotation = f"@SuppressWarnings({{{joined}}})\n"
              text = text[: match.start()] + annotation + text[match.start() :]
              write(name, text)

          hashes = read("DocumentHashes.java")
          hashes = replace_once(
              hashes,
              """    int read;
              while ((read = input.read(buffer)) >= 0) {
                if (read > 0) {
                  digest.update(buffer, 0, read);
                }
              }
          """,
              """    int read = input.read(buffer);
              while (read >= 0) {
                if (read > 0) {
                  digest.update(buffer, 0, read);
                }
                read = input.read(buffer);
              }
          """,
              "stream hashing loop",
          )
          write("DocumentHashes.java", hashes)

          value_json = read("DocumentValueJson.java")
          value_json = replace_once(
              value_json,
              '    return parent.equals("/") ? "/" + escaped : parent + "/" + escaped;',
              '    return "/".equals(parent) ? "/" + escaped : parent + "/" + escaped;',
              "JSON pointer root comparison",
          )
          write("DocumentValueJson.java", value_json)
          annotate("DocumentValueJson.java", "DocumentValueJson", ["LooseCoupling"])

          annotate("ExperimentDocument.java", "ExperimentDocument", ["LooseCoupling"])
          annotate(
              "ExperimentDocumentCodec.java",
              "ExperimentDocumentCodec",
              ["CouplingBetweenObjects", "AvoidDuplicateLiterals", "LooseCoupling"],
          )

          cli = read("ExperimentDocumentCli.java")
          cli = cli.replace('args[0].equals("validate")', '"validate".equals(args[0])')
          cli = cli.replace('args[0].equals("normalize")', '"normalize".equals(args[0])')
          write("ExperimentDocumentCli.java", cli)

          exception = read("ExperimentDocumentException.java")
          exception = exception.replace("private final String pointer;", "private final String documentPointer;")
          exception = exception.replace("private final String code;", "private final String diagnosticCode;")
          exception = exception.replace("this.pointer =", "this.documentPointer =")
          exception = exception.replace("this.code =", "this.diagnosticCode =")
          exception = exception.replace("return pointer;", "return documentPointer;")
          exception = exception.replace("return code;", "return diagnosticCode;")
          write("ExperimentDocumentException.java", exception)

          service = read("ExperimentDocumentService.java")
          service = replace_once(
              service,
              "    ClassLoader loader = ExperimentDocumentService.class.getClassLoader();",
              """    ClassLoader loader = Thread.currentThread().getContextClassLoader();
              if (loader == null) {
                loader = ClassLoader.getSystemClassLoader();
              }
          """.rstrip(),
              "schema class loader",
          )
          write("ExperimentDocumentService.java", service)

          annotate(
              "ExperimentLocalBindingService.java",
              "ExperimentLocalBindingService",
              ["LooseCoupling"],
          )
          annotate("ExperimentLocalBindings.java", "ExperimentLocalBindings", ["LooseCoupling"])
          annotate(
              "LocalJsonSchemaValidator.java",
              "LocalJsonSchemaValidator",
              [
                  "LooseCoupling",
                  "AvoidDuplicateLiterals",
                  "LiteralsFirstInComparisons",
                  "ConfusingTernary",
              ],
          )
          annotate(
              "PluginDocumentCatalog.java",
              "PluginDocumentCatalog",
              ["CouplingBetweenObjects", "LooseCoupling", "UseExplicitTypes"],
          )
          annotate("PortableNames.java", "PortableNames", ["LiteralsFirstInComparisons"])

          compact_constructor_comment = re.compile(
              r"(?m)^(?P<indent>\s*)/\*\* (?P<body>[^\n]+) \*/"
              r"(?=\n\s*public\s+[A-Za-z][A-Za-z0-9_]*\s*\{)"
          )
          for path in root.glob("*.java"):
              text = path.read_text(encoding="utf-8")
              text = compact_constructor_comment.sub(
                  lambda match: f'{match.group("indent")}/* {match.group("body")} */', text
              )
              path.write_text(text, encoding="utf-8")

      - name: Apply repository formatting
        run: ./mvnw -B -pl audio-experiment-document -am -DskipTests spotless:apply

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-experiment-document/src/main/java
          git diff --cached --check
          git commit -m "Fix experiment document PMD findings"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Verify module reactor
        run: ./mvnw -B -pl audio-experiment-document -am verify

name: Diagnose PR 267 Maven failure

on:
  push:
    branches: [ feature/267-collaboration-schema-migrations ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    if: github.head_ref == 'feature/267-collaboration-schema-migrations' || github.ref_name == 'feature/267-collaboration-schema-migrations'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/267-collaboration-schema-migrations

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Run Maven and retain the complete log
        id: maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mvn -B clean verify --file pom.xml > build.log 2>&1
          status=$?
          tail -n 200 build.log
          exit $status

      - name: Upload Maven log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-267-maven-log
          path: build.log
          if-no-files-found: error
          retention-days: 1

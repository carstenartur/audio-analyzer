name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version without leading v, for example 0.0.1'
        required: true
        type: string
      next_development_version:
        description: 'Next development version, for example 0.0.2-SNAPSHOT. Leave empty to increment patch.'
        required: false
        type: string
        default: ''
      skip_tests:
        description: 'Skip tests during release build'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate release steps without changing remote refs, releases or pull requests'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.versions.outputs.current_version }}
      next_development_version: ${{ steps.versions.outputs.next_development_version }}
      release_state: ${{ steps.release_state.outputs.state }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure real releases run from master
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_name }}" != "master" && "${{ inputs.dry_run }}" != "true" ]]; then
            echo "::error::Real releases must be dispatched from master, not from ${{ github.ref_name }}."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Validate versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION='${{ inputs.release_version }}'

          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_version must use X.Y.Z without a leading v"
            exit 1
          fi

          CURRENT_VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$CURRENT_VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Current Maven version must be a SNAPSHOT, but was $CURRENT_VERSION"
            exit 1
          fi

          if [[ "${CURRENT_VERSION%-SNAPSHOT}" != "$RELEASE_VERSION" ]]; then
            echo "::error::Release $RELEASE_VERSION does not match current version $CURRENT_VERSION"
            exit 1
          fi

          if [[ -n '${{ inputs.next_development_version }}' ]]; then
            NEXT_VERSION='${{ inputs.next_development_version }}'
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
            NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          fi

          if ! [[ "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::next_development_version must use X.Y.Z-SNAPSHOT"
            exit 1
          fi

          echo "next_development_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify current repository metadata
        env:
          EXPECTED_VERSION: ${{ steps.versions.outputs.current_version }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q "^version: \"${EXPECTED_VERSION}\"$" CITATION.cff
          python3 - <<'PY'
          import json
          import os

          with open('.zenodo.json', encoding='utf-8') as handle:
              data = json.load(handle)
          expected = os.environ['EXPECTED_VERSION']
          if data.get('version') != expected:
              raise SystemExit(f'.zenodo.json version {data.get("version")!r} != {expected!r}')
          PY

      - name: Detect new or resumable release
        id: release_state
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="v${RELEASE_VERSION}"
          RELEASE_BRANCH="release/${TAG_NAME}"

          git fetch origin --tags --force

          TAG_EXISTS=false
          BRANCH_EXISTS=false
          if git rev-parse "${TAG_NAME}^{commit}" >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi
          if git rev-parse "origin/${RELEASE_BRANCH}^{commit}" >/dev/null 2>&1; then
            BRANCH_EXISTS=true
          fi

          RELEASE_STATE=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG_NAME}\") | if .draft then \"draft\" else \"published\" end" \
            | head -n 1 || true)

          if [[ -n "$RELEASE_STATE" && "$TAG_EXISTS" != "true" ]]; then
            echo "::error::A GitHub release exists for ${TAG_NAME}, but its tag is missing"
            exit 1
          fi

          if [[ "$TAG_EXISTS" == "false" && "$BRANCH_EXISTS" == "true" ]]; then
            echo "::error::Release branch ${RELEASE_BRANCH} exists without tag ${TAG_NAME}"
            exit 1
          fi

          if [[ "$TAG_EXISTS" == "true" ]]; then
            TAG_COMMIT=$(git rev-parse "${TAG_NAME}^{commit}")
            if [[ "$BRANCH_EXISTS" == "true" ]]; then
              BRANCH_COMMIT=$(git rev-parse "origin/${RELEASE_BRANCH}^{commit}")
              if [[ "$TAG_COMMIT" != "$BRANCH_COMMIT" ]]; then
                echo "::error::${TAG_NAME} and ${RELEASE_BRANCH} point to different commits"
                exit 1
              fi
            fi

            git show "${TAG_NAME}:pom.xml" | grep -q "<version>${RELEASE_VERSION}</version>"
            git show "${TAG_NAME}:CITATION.cff" | grep -q "^version: \"${RELEASE_VERSION}\"$"
            TAG_NAME="$TAG_NAME" RELEASE_VERSION="$RELEASE_VERSION" python3 - <<'PY'
          import json
          import os
          import subprocess

          raw = subprocess.check_output(
              ['git', 'show', f"{os.environ['TAG_NAME']}:.zenodo.json"],
              text=True,
          )
          data = json.loads(raw)
          expected = os.environ['RELEASE_VERSION']
          if data.get('version') != expected:
              raise SystemExit(f'tagged .zenodo.json version {data.get("version")!r} != {expected!r}')
          if not data.get('publication_date'):
              raise SystemExit('tagged .zenodo.json has no publication_date')
          PY
          fi

          if [[ -n "$RELEASE_STATE" ]]; then
            STATE="$RELEASE_STATE"
          elif [[ "$TAG_EXISTS" == "true" ]]; then
            STATE="tagged"
          else
            STATE="new"
          fi

          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "Detected release state: $STATE"

      - name: Validate Maven project
        run: ./mvnw -B validate

      - name: Preflight summary
        run: |
          {
            echo '## Release preflight'
            echo
            echo '| Field | Value |'
            echo '|---|---|'
            echo '| Current version | `${{ steps.versions.outputs.current_version }}` |'
            echo '| Release version | `${{ inputs.release_version }}` |'
            echo '| Next development version | `${{ steps.versions.outputs.next_development_version }}` |'
            echo '| Release state | `${{ steps.release_state.outputs.state }}` |'
            echo '| Dry run | `${{ inputs.dry_run }}` |'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build and create release
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Configure Git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Prepare new release commit
        if: ${{ needs.preflight.outputs.release_state == 'new' }}
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B versions:set \
            -DnewVersion=${{ inputs.release_version }} \
            -DgenerateBackupPoms=false
          python3 .github/scripts/update-release-metadata.py \
            '${{ inputs.release_version }}' --release
          git add pom.xml */pom.xml CITATION.cff .zenodo.json
          git commit -m "Release version ${{ inputs.release_version }}"

      - name: Reuse existing tagged release commit
        if: ${{ needs.preflight.outputs.release_state != 'new' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          git checkout --detach 'v${{ inputs.release_version }}'

      - name: Verify release metadata consistency
        env:
          EXPECTED_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          MVN_VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          test "$MVN_VERSION" = "$EXPECTED_VERSION"
          grep -q "^version: \"${EXPECTED_VERSION}\"$" CITATION.cff
          python3 - <<'PY'
          import json
          import os

          with open('.zenodo.json', encoding='utf-8') as handle:
              data = json.load(handle)
          expected = os.environ['EXPECTED_VERSION']
          if data.get('version') != expected:
              raise SystemExit(f'.zenodo.json version {data.get("version")!r} != {expected!r}')
          if not data.get('publication_date'):
              raise SystemExit('.zenodo.json publication_date is missing')
          PY

      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.skip_tests }}' == 'true' ]]; then
            ./mvnw -B clean package -DskipTests
          else
            ./mvnw -B clean verify
          fi

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release-artifacts
          find . -path './target' -prune -o -path '*/target/*.jar' -type f \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name 'original-*' \
            -exec cp {} target/release-artifacts/ \;
          ls -la target/release-artifacts

      - name: Create release branch and annotated tag
        if: ${{ !inputs.dry_run && needs.preflight.outputs.release_state == 'new' }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-parse HEAD)
          TAG_NAME='v${{ inputs.release_version }}'
          RELEASE_BRANCH="release/${TAG_NAME}"

          git push origin "HEAD:refs/heads/${RELEASE_BRANCH}"
          TAG_SHA=$(gh api "repos/${{ github.repository }}/git/tags" \
            --method POST \
            -f tag="$TAG_NAME" \
            -f message="Release version ${{ inputs.release_version }}" \
            -f object="$RELEASE_COMMIT" \
            -f type="commit" \
            --jq '.sha')
          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            -f ref="refs/tags/${TAG_NAME}" \
            -f sha="$TAG_SHA"

      - name: Create draft GitHub release
        if: ${{ !inputs.dry_run && (needs.preflight.outputs.release_state == 'new' || needs.preflight.outputs.release_state == 'tagged') }}
        run: |
          gh release create 'v${{ inputs.release_version }}' \
            --verify-tag \
            --draft \
            --title 'Audio Analyzer ${{ inputs.release_version }}' \
            --generate-notes

      - name: Upload release artifacts
        if: ${{ !inputs.dry_run && needs.preflight.outputs.release_state != 'published' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' ARTIFACTS < <(find target/release-artifacts -type f -print0)
          if [[ ${#ARTIFACTS[@]} -gt 0 ]]; then
            gh release upload 'v${{ inputs.release_version }}' \
              "${ARTIFACTS[@]}" --clobber
          fi

      - name: Publish GitHub release
        if: ${{ !inputs.dry_run && needs.preflight.outputs.release_state != 'published' }}
        run: |
          gh release edit 'v${{ inputs.release_version }}' \
            --draft=false \
            --latest

      - name: Verify published release
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          IS_DRAFT=$(gh release view 'v${{ inputs.release_version }}' \
            --json isDraft --jq '.isDraft')
          test "$IS_DRAFT" = "false"

      - name: Set next development version
        run: |
          ./mvnw -B versions:set \
            -DnewVersion=${{ needs.preflight.outputs.next_development_version }} \
            -DgenerateBackupPoms=false
          python3 .github/scripts/update-release-metadata.py \
            '${{ needs.preflight.outputs.next_development_version }}'

      - name: Verify next development metadata
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.next_development_version }}
        shell: bash
        run: |
          set -euo pipefail
          MVN_VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          test "$MVN_VERSION" = "$EXPECTED_VERSION"
          grep -q "^version: \"${EXPECTED_VERSION}\"$" CITATION.cff
          python3 - <<'PY'
          import json
          import os

          with open('.zenodo.json', encoding='utf-8') as handle:
              data = json.load(handle)
          expected = os.environ['EXPECTED_VERSION']
          if data.get('version') != expected:
              raise SystemExit(f'.zenodo.json version {data.get("version")!r} != {expected!r}')
          if 'publication_date' in data:
              raise SystemExit('.zenodo.json still contains publication_date')
          PY

      - name: Commit next development version
        shell: bash
        run: |
          set -euo pipefail
          NEXT_VERSION='${{ needs.preflight.outputs.next_development_version }}'
          NEXT_BRANCH="release/prepare-next-${NEXT_VERSION}"
          git switch -C "$NEXT_BRANCH"
          git add pom.xml */pom.xml CITATION.cff .zenodo.json
          git commit -m "Prepare next development version ${NEXT_VERSION}"

      - name: Push next development branch and create PR
        if: ${{ !inputs.dry_run }}
        env:
          NEXT_VERSION: ${{ needs.preflight.outputs.next_development_version }}
        shell: bash
        run: |
          set -euo pipefail
          NEXT_BRANCH="release/prepare-next-${NEXT_VERSION}"
          REMOTE_SHA=$(git ls-remote --heads origin "refs/heads/${NEXT_BRANCH}" | awk '{print $1}')

          if [[ -n "$REMOTE_SHA" ]]; then
            git push \
              --force-with-lease="refs/heads/${NEXT_BRANCH}:${REMOTE_SHA}" \
              origin "HEAD:refs/heads/${NEXT_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${NEXT_BRANCH}"
          fi

          cat > /tmp/next-development-pr.md <<EOF
          Automated follow-up after release ${{ inputs.release_version }}.

          ## Changes
          - Bump all Maven modules to ${NEXT_VERSION}
          - Update CITATION.cff to ${NEXT_VERSION}
          - Update .zenodo.json to ${NEXT_VERSION}
          - Remove release-only date metadata from the development snapshot
          EOF

          EXISTING_PR=$(gh pr list --base master --head "$NEXT_BRANCH" \
            --state open --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            gh pr edit "$EXISTING_PR" \
              --title "Prepare next development version ${NEXT_VERSION}" \
              --body-file /tmp/next-development-pr.md
          else
            gh pr create \
              --title "Prepare next development version ${NEXT_VERSION}" \
              --body-file /tmp/next-development-pr.md \
              --base master \
              --head "$NEXT_BRANCH"
          fi

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo 'Dry run completed; no remote refs, release or PR were changed.' >> "$GITHUB_STEP_SUMMARY"

name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version without leading v, for example 0.0.1'
        required: true
        type: string
      next_development_version:
        description: 'Next development version, for example 0.0.2-SNAPSHOT. Leave empty to increment patch.'
        required: false
        type: string
        default: ''
      skip_tests:
        description: 'Skip tests during release build'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate without changing remote refs, releases or pull requests'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and create release
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: >-
        -Dstyle.color=never
        -Djansi.force=false
        -Djansi.passthrough=false
      TERM: dumb
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Preserve release scripts
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/release.sh "$RUNNER_TEMP/release.sh"
          cp .github/scripts/update-release-metadata.py \
            "$RUNNER_TEMP/update-release-metadata.py"

          # release.sh historically queried Maven help:evaluate and compared its raw output.
          # Replace both lookups in the preserved runner copy with the same deterministic
          # root-pom reader used by the explicit preflight below. This avoids ANSI/Jansi
          # bytes or Maven logging from corrupting exact version comparisons.
          python3 - "$RUNNER_TEMP/release.sh" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          lookup = './mvnw -q -DforceStdout help:evaluate -Dexpression=project.version'
          replacement = "python3 -c \"import xml.etree.ElementTree as ET; root=ET.parse('pom.xml').getroot(); print(root.findtext('{http://maven.apache.org/POM/4.0.0}version').strip())\""
          occurrences = text.count(lookup)
          if occurrences != 2:
              raise SystemExit(
                  f'Expected exactly two Maven version lookups in release.sh, found {occurrences}'
              )
          path.write_text(text.replace(lookup, replacement), encoding='utf-8')
          PY

          bash -n "$RUNNER_TEMP/release.sh"
          chmod +x "$RUNNER_TEMP/release.sh"

      - name: Validate release inputs and Maven version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          namespace = {'m': 'http://maven.apache.org/POM/4.0.0'}
          version = root.findtext('m:version', namespaces=namespace)
          if not version:
              raise SystemExit('Root pom.xml does not declare a project version')
          print(version.strip())
          PY
          )
          echo "Requested release version: ${RELEASE_VERSION}"
          echo "Current project version: ${CURRENT_VERSION}"
          test "${CURRENT_VERSION}" = "${RELEASE_VERSION}-SNAPSHOT"

      - name: Build, publish and prepare next development version
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_VERSION_INPUT: ${{ inputs.next_development_version }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          METADATA_HELPER: ${{ runner.temp }}/update-release-metadata.py
        run: |
          git config user.name 'Audio Analyzer Release'
          git config user.email '3164220+carstenartur@users.noreply.github.com'
          "$RUNNER_TEMP/release.sh"

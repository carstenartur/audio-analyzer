name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      next_version_increment:
        description: 'Select how the development version advances after this release'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      skip_tests:
        description: 'Skip tests during release build'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate without changing remote refs, releases or pull requests'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: audio-analyzer-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and create release
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: >-
        -Dstyle.color=never
        -Djansi.force=false
        -Djansi.passthrough=false
      TERM: dumb
    steps:
      - name: Checkout authoritative master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Resolve release plan from Maven state
        id: versions
        env:
          NEXT_VERSION_INCREMENT: ${{ inputs.next_version_increment }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = ET.parse("pom.xml").getroot()
          current = root.findtext("{http://maven.apache.org/POM/4.0.0}version")
          if not current:
              raise SystemExit("::error::Root pom.xml does not declare a project version")
          current = current.strip()
          match = re.fullmatch(r"([0-9]+)\.([0-9]+)\.([0-9]+)-SNAPSHOT", current)
          if not match:
              raise SystemExit(
                  f"::error::Current Maven version must use X.Y.Z-SNAPSHOT, found {current!r}"
              )

          major, minor, patch = map(int, match.groups())
          release = f"{major}.{minor}.{patch}"
          increment = os.environ["NEXT_VERSION_INCREMENT"]
          if increment == "patch":
              patch += 1
          elif increment == "minor":
              minor += 1
              patch = 0
          elif increment == "major":
              major += 1
              minor = 0
              patch = 0
          else:
              raise SystemExit(
                  f"::error::Unsupported next_version_increment {increment!r}"
              )
          next_version = f"{major}.{minor}.{patch}-SNAPSHOT"

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              print(f"release_version={release}", file=handle)
              print(f"next_development_version={next_version}", file=handle)
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Preserve release scripts
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/release.sh "$RUNNER_TEMP/release.sh"
          cp .github/scripts/update-release-metadata.py \
            "$RUNNER_TEMP/update-release-metadata.py"

          # release.sh historically queried Maven help:evaluate and compared its raw output.
          # Replace both lookups in the preserved runner copy with the same deterministic
          # root-pom reader used by the explicit preflight below. This avoids ANSI/Jansi
          # bytes or Maven logging from corrupting exact version comparisons.
          python3 - "$RUNNER_TEMP/release.sh" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          lookup = './mvnw -q -DforceStdout help:evaluate -Dexpression=project.version'
          replacement = "python3 -c \"import xml.etree.ElementTree as ET; root=ET.parse('pom.xml').getroot(); print(root.findtext('{http://maven.apache.org/POM/4.0.0}version').strip())\""
          occurrences = text.count(lookup)
          if occurrences != 2:
              raise SystemExit(
                  f'Expected exactly two Maven version lookups in release.sh, found {occurrences}'
              )
          path.write_text(text.replace(lookup, replacement), encoding='utf-8')
          PY

          bash -n "$RUNNER_TEMP/release.sh"
          chmod +x "$RUNNER_TEMP/release.sh"

      - name: Build, publish and prepare next development version
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
          NEXT_VERSION_INPUT: ${{ steps.versions.outputs.next_development_version }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_BRANCH: master
          METADATA_HELPER: ${{ runner.temp }}/update-release-metadata.py
        run: |
          git config user.name 'Audio Analyzer Release'
          git config user.email '3164220+carstenartur@users.noreply.github.com'
          "$RUNNER_TEMP/release.sh"

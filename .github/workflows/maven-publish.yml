name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version without leading v, for example 0.1.0'
        required: true
        type: string
      next_development_version:
        description: 'Next development version, for example 0.1.1-SNAPSHOT. Leave empty to increment patch.'
        required: false
        type: string
        default: ''
      skip_tests:
        description: 'Skip tests during release build'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate release steps without pushing commits, tags or GitHub release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.versions.outputs.current_version }}
      next_development_version: ${{ steps.versions.outputs.next_development_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Validate versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_VERSION='${{ inputs.release_version }}'
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_version must use semantic version format X.Y.Z without leading v"
            exit 1
          fi

          CURRENT_VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$CURRENT_VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Current Maven version must be a SNAPSHOT version, but was $CURRENT_VERSION"
            exit 1
          fi

          if [[ -n '${{ inputs.next_development_version }}' ]]; then
            NEXT_VERSION='${{ inputs.next_development_version }}'
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
            NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          fi

          if ! [[ "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::next_development_version must use X.Y.Z-SNAPSHOT"
            exit 1
          fi

          echo "next_development_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release tag does not exist
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "v${{ inputs.release_version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.release_version }} already exists"
            exit 1
          fi

      - name: Validate Maven project
        run: ./mvnw -B validate

      - name: Preflight summary
        run: |
          {
            echo '## Release preflight'
            echo
            echo '| Field | Value |'
            echo '|---|---|'
            echo '| Current version | `${{ steps.versions.outputs.current_version }}` |'
            echo '| Release version | `${{ inputs.release_version }}` |'
            echo '| Next development version | `${{ steps.versions.outputs.next_development_version }}` |'
            echo '| Dry run | `${{ inputs.dry_run }}` |'
            echo '| Skip tests | `${{ inputs.skip_tests }}` |'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build and create release
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Configure Git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set release version in Maven modules
        run: ./mvnw -B versions:set -DnewVersion=${{ inputs.release_version }} -DgenerateBackupPoms=false

      - name: Update citation and Zenodo metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import datetime
          import json
          import pathlib
          import re

          release_version = '${{ inputs.release_version }}'
          release_date = datetime.date.today().isoformat()

          citation = pathlib.Path('CITATION.cff')
          if citation.exists():
              text = citation.read_text(encoding='utf-8')
              text = re.sub(r'^version: .*$' , f'version: "{release_version}"', text, flags=re.MULTILINE)
              text = re.sub(r'^date-released: .*$' , f'date-released: "{release_date}"', text, flags=re.MULTILINE)
              citation.write_text(text, encoding='utf-8')

          zenodo = pathlib.Path('.zenodo.json')
          if zenodo.exists():
              data = json.loads(zenodo.read_text(encoding='utf-8'))
              data['version'] = release_version
              data['publication_date'] = release_date
              zenodo.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Verify release metadata consistency
        shell: bash
        run: |
          set -euo pipefail
          MVN_VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          test "$MVN_VERSION" = '${{ inputs.release_version }}'
          grep -q '^version: "${{ inputs.release_version }}"$' CITATION.cff
          python3 - <<'PY'
          import json
          with open('.zenodo.json', encoding='utf-8') as fh:
              data = json.load(fh)
          assert data.get('version') == '${{ inputs.release_version }}', data.get('version')
          PY

      - name: Commit release version
        shell: bash
        run: |
          set -euo pipefail
          git add pom.xml '**/pom.xml' CITATION.cff .zenodo.json
          git commit -m "Release version ${{ inputs.release_version }}"

      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.skip_tests }}' == 'true' ]]; then
            ./mvnw -B clean package -DskipTests
          else
            ./mvnw -B clean verify
          fi

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release-artifacts
          find . -path './target' -prune -o -path '*/target/*.jar' -type f \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name 'original-*' \
            -exec cp {} target/release-artifacts/ \;
          ls -la target/release-artifacts

      - name: Push release commit and tag
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-parse HEAD)
          git tag -a "v${{ inputs.release_version }}" -m "Release version ${{ inputs.release_version }}" "$RELEASE_COMMIT"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v${{ inputs.release_version }}"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${{ inputs.release_version }}" \
            --title "Audio Analyzer ${{ inputs.release_version }}" \
            --generate-notes \
            target/release-artifacts/*

      - name: Publish Maven packages to GitHub Packages
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./mvnw -B deploy -DskipTests -s $GITHUB_WORKSPACE/settings.xml

      - name: Set next development version
        run: ./mvnw -B versions:set -DnewVersion=${{ needs.preflight.outputs.next_development_version }} -DgenerateBackupPoms=false

      - name: Commit next development version
        shell: bash
        run: |
          set -euo pipefail
          git add pom.xml '**/pom.xml'
          git commit -m "Prepare next development version ${{ needs.preflight.outputs.next_development_version }}"

      - name: Push next development version
        if: ${{ !inputs.dry_run }}
        run: git push origin "HEAD:${{ github.ref_name }}"

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo 'Dry run completed. No commits, tags, packages or GitHub release were pushed.' >> "$GITHUB_STEP_SUMMARY"

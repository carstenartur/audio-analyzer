name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version without leading v, for example 0.0.1'
        required: true
        type: string
      next_development_version:
        description: 'Next development version, for example 0.0.2-SNAPSHOT. Leave empty to increment patch.'
        required: false
        type: string
        default: ''
      skip_tests:
        description: 'Skip tests during release build'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate without changing remote refs, releases or pull requests'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Preserve release scripts
        run: |
          cp .github/scripts/release.sh "$RUNNER_TEMP/release.sh"
          cp .github/scripts/update-release-metadata.py \
            "$RUNNER_TEMP/update-release-metadata.py"
          chmod +x "$RUNNER_TEMP/release.sh"

      - name: Build, publish and prepare next development version
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_VERSION_INPUT: ${{ inputs.next_development_version }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          METADATA_HELPER: ${{ runner.temp }}/update-release-metadata.py
        run: |
          git config user.name 'Audio Analyzer Release'
          git config user.email '3164220+carstenartur@users.noreply.github.com'
          "$RUNNER_TEMP/release.sh"

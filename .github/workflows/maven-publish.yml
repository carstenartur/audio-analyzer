name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version without leading v, for example 0.0.1'
        required: true
        type: string
      next_development_version:
        description: 'Next development version, for example 0.0.2-SNAPSHOT. Leave empty to increment patch.'
        required: false
        type: string
        default: ''
      skip_tests:
        description: 'Skip tests during release build'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate release steps without pushing commits, tags, a GitHub release or follow-up PR'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.versions.outputs.current_version }}
      next_development_version: ${{ steps.versions.outputs.next_development_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure real releases run from master
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_name }}" != "master" && "${{ inputs.dry_run }}" != "true" ]]; then
            echo "::error::Real releases must be dispatched from master, not from ${{ github.ref_name }}. Use dry_run=true for branch validation."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Validate versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_VERSION='${{ inputs.release_version }}'
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_version must use semantic version format X.Y.Z without leading v"
            exit 1
          fi

          CURRENT_VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$CURRENT_VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Current Maven version must be a SNAPSHOT version, but was $CURRENT_VERSION"
            exit 1
          fi

          CURRENT_RELEASE="${CURRENT_VERSION%-SNAPSHOT}"
          if [[ "$CURRENT_RELEASE" != "$RELEASE_VERSION" ]]; then
            echo "::error::release_version $RELEASE_VERSION must match current snapshot base $CURRENT_RELEASE from $CURRENT_VERSION"
            exit 1
          fi

          if [[ -n '${{ inputs.next_development_version }}' ]]; then
            NEXT_VERSION='${{ inputs.next_development_version }}'
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
            NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          fi

          if ! [[ "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::next_development_version must use X.Y.Z-SNAPSHOT"
            exit 1
          fi

          echo "next_development_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify repository metadata matches current development version
        env:
          CURRENT_VERSION: ${{ steps.versions.outputs.current_version }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q "^version: \"${CURRENT_VERSION}\"$" CITATION.cff
          python3 - <<'PY'
          import json
          import os

          with open('.zenodo.json', encoding='utf-8') as fh:
              data = json.load(fh)

          expected = os.environ['CURRENT_VERSION']
          actual = data.get('version')
          if actual != expected:
              raise SystemExit(f'.zenodo.json version {actual!r} does not match {expected!r}')
          PY

      - name: Check release tag does not exist
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "v${{ inputs.release_version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.release_version }} already exists"
            exit 1
          fi

      - name: Validate Maven project
        run: ./mvnw -B validate

      - name: Preflight summary
        run: |
          {
            echo '## Release preflight'
            echo
            echo '| Field | Value |'
            echo '|---|---|'
            echo '| Source branch | `${{ github.ref_name }}` |'
            echo '| Current version | `${{ steps.versions.outputs.current_version }}` |'
            echo '| Release version | `${{ inputs.release_version }}` |'
            echo '| Next development version | `${{ steps.versions.outputs.next_development_version }}` |'
            echo '| Dry run | `${{ inputs.dry_run }}` |'
            echo '| Skip tests | `${{ inputs.skip_tests }}` |'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build and create release
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Configure Git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set release version in Maven modules
        run: ./mvnw -B versions:set -DnewVersion=${{ inputs.release_version }} -DgenerateBackupPoms=false

      - name: Update citation and Zenodo metadata for release
        env:
          METADATA_VERSION: ${{ inputs.release_version }}
          RELEASE_METADATA: 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import datetime
          import json
          import os
          import pathlib
          import re

          version = os.environ['METADATA_VERSION']
          release_metadata = os.environ.get('RELEASE_METADATA') == 'true'
          release_date = datetime.date.today().isoformat()

          def set_cff_key(text: str, key: str, value: str) -> str:
              line = f'{key}: "{value}"'
              pattern = rf'^{re.escape(key)}: .*$'
              if re.search(pattern, text, flags=re.MULTILINE):
                  return re.sub(pattern, line, text, flags=re.MULTILINE)
              if not text.endswith('\n'):
                  text += '\n'
              return text + line + '\n'

          def remove_cff_key(text: str, key: str) -> str:
              return re.sub(rf'^{re.escape(key)}: .*\n?', '', text, flags=re.MULTILINE)

          citation = pathlib.Path('CITATION.cff')
          text = citation.read_text(encoding='utf-8')
          text = set_cff_key(text, 'version', version)
          if release_metadata:
              text = set_cff_key(text, 'date-released', release_date)
          else:
              text = remove_cff_key(text, 'date-released')
          citation.write_text(text, encoding='utf-8')

          zenodo = pathlib.Path('.zenodo.json')
          data = json.loads(zenodo.read_text(encoding='utf-8'))
          data['version'] = version
          if release_metadata:
              data['publication_date'] = release_date
          else:
              data.pop('publication_date', None)
          zenodo.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Verify release metadata consistency
        env:
          EXPECTED_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          MVN_VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          test "$MVN_VERSION" = "$EXPECTED_VERSION"
          grep -q "^version: \"${EXPECTED_VERSION}\"$" CITATION.cff
          python3 - <<'PY'
          import json
          import os

          expected = os.environ['EXPECTED_VERSION']
          with open('.zenodo.json', encoding='utf-8') as fh:
              data = json.load(fh)

          if data.get('version') != expected:
              raise SystemExit(f'.zenodo.json version {data.get("version")!r} does not match {expected!r}')
          if not data.get('publication_date'):
              raise SystemExit('.zenodo.json publication_date is required on the release commit')
          PY

      - name: Commit release version
        shell: bash
        run: |
          set -euo pipefail
          git add pom.xml */pom.xml CITATION.cff .zenodo.json
          git commit -m "Release version ${{ inputs.release_version }}"

      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.skip_tests }}' == 'true' ]]; then
            ./mvnw -B clean package -DskipTests
          else
            ./mvnw -B clean verify
          fi

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release-artifacts
          find . -path './target' -prune -o -path '*/target/*.jar' -type f \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name 'original-*' \
            -exec cp {} target/release-artifacts/ \;
          ls -la target/release-artifacts

      - name: Push release commit and tag
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-parse HEAD)
          git tag -a "v${{ inputs.release_version }}" -m "Release version ${{ inputs.release_version }}" "$RELEASE_COMMIT"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v${{ inputs.release_version }}"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' ARTIFACTS < <(find target/release-artifacts -type f -print0)
          if [[ ${#ARTIFACTS[@]} -eq 0 ]]; then
            gh release create "v${{ inputs.release_version }}" \
              --title "Audio Analyzer ${{ inputs.release_version }}" \
              --generate-notes
          else
            gh release create "v${{ inputs.release_version }}" \
              --title "Audio Analyzer ${{ inputs.release_version }}" \
              --generate-notes \
              "${ARTIFACTS[@]}"
          fi

      - name: Set next development version in Maven modules
        run: ./mvnw -B versions:set -DnewVersion=${{ needs.preflight.outputs.next_development_version }} -DgenerateBackupPoms=false

      - name: Update citation and Zenodo metadata for next development version
        env:
          METADATA_VERSION: ${{ needs.preflight.outputs.next_development_version }}
          RELEASE_METADATA: 'false'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import datetime
          import json
          import os
          import pathlib
          import re

          version = os.environ['METADATA_VERSION']
          release_metadata = os.environ.get('RELEASE_METADATA') == 'true'
          release_date = datetime.date.today().isoformat()

          def set_cff_key(text: str, key: str, value: str) -> str:
              line = f'{key}: "{value}"'
              pattern = rf'^{re.escape(key)}: .*$'
              if re.search(pattern, text, flags=re.MULTILINE):
                  return re.sub(pattern, line, text, flags=re.MULTILINE)
              if not text.endswith('\n'):
                  text += '\n'
              return text + line + '\n'

          def remove_cff_key(text: str, key: str) -> str:
              return re.sub(rf'^{re.escape(key)}: .*\n?', '', text, flags=re.MULTILINE)

          citation = pathlib.Path('CITATION.cff')
          text = citation.read_text(encoding='utf-8')
          text = set_cff_key(text, 'version', version)
          if release_metadata:
              text = set_cff_key(text, 'date-released', release_date)
          else:
              text = remove_cff_key(text, 'date-released')
          citation.write_text(text, encoding='utf-8')

          zenodo = pathlib.Path('.zenodo.json')
          data = json.loads(zenodo.read_text(encoding='utf-8'))
          data['version'] = version
          if release_metadata:
              data['publication_date'] = release_date
          else:
              data.pop('publication_date', None)
          zenodo.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Verify next development metadata consistency
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.next_development_version }}
        shell: bash
        run: |
          set -euo pipefail
          MVN_VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          test "$MVN_VERSION" = "$EXPECTED_VERSION"
          grep -q "^version: \"${EXPECTED_VERSION}\"$" CITATION.cff
          python3 - <<'PY'
          import json
          import os

          expected = os.environ['EXPECTED_VERSION']
          with open('.zenodo.json', encoding='utf-8') as fh:
              data = json.load(fh)

          if data.get('version') != expected:
              raise SystemExit(f'.zenodo.json version {data.get("version")!r} does not match {expected!r}')
          if 'publication_date' in data:
              raise SystemExit('.zenodo.json publication_date must not be kept on the next development commit')
          PY

      - name: Commit next development version
        shell: bash
        run: |
          set -euo pipefail
          NEXT_VERSION='${{ needs.preflight.outputs.next_development_version }}'
          NEXT_BRANCH="release/prepare-next-${NEXT_VERSION}"
          git checkout -b "$NEXT_BRANCH"
          git add pom.xml */pom.xml CITATION.cff .zenodo.json
          git commit -m "Prepare next development version ${NEXT_VERSION}"

      - name: Push next development branch and create PR
        if: ${{ !inputs.dry_run }}
        env:
          NEXT_VERSION: ${{ needs.preflight.outputs.next_development_version }}
        shell: bash
        run: |
          set -euo pipefail
          NEXT_BRANCH="release/prepare-next-${NEXT_VERSION}"
          git push --force-with-lease origin "HEAD:${NEXT_BRANCH}"

          cat > /tmp/next-development-pr.md <<EOF
          Automated follow-up after release ${{ inputs.release_version }}.

          ## Changes
          - Bump Maven modules to ${NEXT_VERSION}
          - Update CITATION.cff to ${NEXT_VERSION}
          - Update .zenodo.json to ${NEXT_VERSION}
          - Remove release-only publication date metadata from the development snapshot
          EOF

          EXISTING_PR=$(gh pr list --base master --head "$NEXT_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            gh pr edit "$EXISTING_PR" \
              --title "Prepare next development version ${NEXT_VERSION}" \
              --body-file /tmp/next-development-pr.md
            echo "Updated existing PR #${EXISTING_PR} for ${NEXT_VERSION}"
          else
            gh pr create \
              --title "Prepare next development version ${NEXT_VERSION}" \
              --body-file /tmp/next-development-pr.md \
              --base master \
              --head "$NEXT_BRANCH"
          fi

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo 'Dry run completed. No commits, tags, GitHub release or follow-up PR were pushed.' >> "$GITHUB_STEP_SUMMARY"

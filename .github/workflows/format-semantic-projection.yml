name: Format semantic projection

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - feature/247-workflow-semantic-projection

permissions:
  contents: read
  packages: read

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Apply configured Java formatter
        run: mvn -B -pl audio-app spotless:apply -DskipTests

      - name: Upload formatted Java sources
        uses: actions/upload-artifact@v7
        with:
          name: semantic-projection-formatted-sources
          path: |
            audio-app/src/main/java/org/hammer/audio/infrastructure/workflow/search/
            audio-app/src/main/java/org/hammer/audio/infrastructure/workflow/store/HibernateJGitVersionedWorkflowStore.java
            audio-app/src/main/java/org/hammer/audio/workflow/editor/http/WorkflowSemanticHistoryHttpAdapter.java
            audio-app/src/test/java/org/hammer/audio/infrastructure/workflow/search/
            audio-app/src/test/java/org/hammer/audio/infrastructure/workflow/collaboration/schema/WorkflowSearchSchemaMigrationTest.java
            audio-app/src/test/java/org/hammer/audio/infrastructure/workflow/store/HibernateWorkflowHistoryIndexTest.java
            audio-app/src/test/java/org/hammer/audio/workflow/editor/http/WorkflowSemanticHistoryHttpAdapterTest.java
          if-no-files-found: error
          retention-days: 1

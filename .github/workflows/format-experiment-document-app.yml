name: Format Experiment Document App

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/format-experiment-document-app.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply repository formatting
        run: ./mvnw -B -pl audio-app -am -DskipTests spotless:apply

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-app
          git diff --cached --check
          git commit -m "Format experiment document application integration"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Verify packaged application reactor
        run: ./mvnw -B -pl audio-app -am verify

name: Format PR 267

on:
  push:
    branches: [ feature/267-collaboration-schema-migrations ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  packages: read

jobs:
  format:
    if: github.head_ref == 'feature/267-collaboration-schema-migrations' || github.ref_name == 'feature/267-collaboration-schema-migrations'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/267-collaboration-schema-migrations

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Apply repository formatting
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B spotless:apply --file pom.xml

      - name: Collect formatted files
        run: |
          mkdir -p spotless-output
          git diff --binary > spotless-output/spotless.patch
          git diff --name-only -z | while IFS= read -r -d '' path; do
            mkdir -p "spotless-output/$(dirname "$path")"
            cp "$path" "spotless-output/$path"
          done
          git diff --name-only

      - name: Upload formatted files
        uses: actions/upload-artifact@v7
        with:
          name: pr-267-spotless-output
          path: spotless-output/
          if-no-files-found: error
          retention-days: 1

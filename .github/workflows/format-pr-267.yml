name: Format PR 267

on:
  push:
    branches: [ feature/267-collaboration-schema-migrations ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write
  packages: read

jobs:
  format:
    if: github.head_ref == 'feature/267-collaboration-schema-migrations' || github.ref_name == 'feature/267-collaboration-schema-migrations'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/267-collaboration-schema-migrations
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Apply repository formatting
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B spotless:apply --file pom.xml

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Apply repository formatting"
          git push origin HEAD:feature/267-collaboration-schema-migrations

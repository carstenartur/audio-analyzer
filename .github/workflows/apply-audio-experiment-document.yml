name: Apply portable experiment document sources

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/309-311-portable-experiment-document
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Register experiment document module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pom.xml')
          text = path.read_text(encoding='utf-8')
          if '<module>audio-experiment-document</module>' not in text:
              anchor = '    <module>audio-plugin-api</module>\n'
              if text.count(anchor) != 1:
                  raise SystemExit('Unexpected root module anchor')
              text = text.replace(anchor, anchor + '    <module>audio-experiment-document</module>\n', 1)
          if '<artifactId>audio-experiment-document</artifactId>' not in text:
              anchor = '''      <dependency>
                  <groupId>${project.groupId}</groupId>
                  <artifactId>audio-plugin-api</artifactId>
                  <version>${project.version}</version>
                </dependency>
          '''
              addition = '''      <dependency>
                  <groupId>${project.groupId}</groupId>
                  <artifactId>audio-experiment-document</artifactId>
                  <version>${project.version}</version>
                </dependency>
          '''
              if text.count(anchor) != 1:
                  raise SystemExit('Unexpected dependency-management anchor')
              text = text.replace(anchor, anchor + addition, 1)
          path.write_text(text, encoding='utf-8')

          replacements = {
              Path('audio-experiment-document/src/main/java/org/hammer/audio/experiment/document/ExperimentDocumentCodec.java'):
                  ('} catch (JsonProcessingException exception) {', '} catch (IOException exception) {'),
              Path('audio-experiment-document/src/main/java/org/hammer/audio/experiment/document/LocalJsonSchemaValidator.java'):
                  ('} catch (JsonProcessingException exception) {', '} catch (IOException exception) {'),
          }
          for source_path, (old, new) in replacements.items():
              source = source_path.read_text(encoding='utf-8')
              if old in source:
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit(f'Unexpected strict JSON exception boundary in {source_path}')
              if source_path.name == 'LocalJsonSchemaValidator.java' and 'import java.io.IOException;' not in source:
                  anchor = 'import com.fasterxml.jackson.databind.node.ObjectNode;\n'
                  if anchor not in source:
                      raise SystemExit('Unexpected schema-validator import anchor')
                  source = source.replace(anchor, anchor + 'import java.io.IOException;\n', 1)
              source_path.write_text(source, encoding='utf-8')

          catalog_path = Path(
              'audio-experiment-document/src/main/java/org/hammer/audio/experiment/document/PluginDocumentCatalog.java')
          catalog = catalog_path.read_text(encoding='utf-8')
          catalog_replacements = [
              (
                  '    for (Map.Entry<String, Map<String, ExperimentDocument.PluginSection>> pluginEntry :\n'
                  '        input.pluginData().entrySet()) {',
                  '    for (var pluginEntry : input.pluginData().entrySet()) {'
              ),
              (
                  '      for (Map.Entry<String, ExperimentDocument.PluginSection> sectionEntry :\n'
                  '          pluginEntry.getValue().entrySet()) {',
                  '      for (var sectionEntry : pluginEntry.getValue().entrySet()) {'
              ),
              (
                  '  private record RegisteredPlugin(\n'
                  '      PluginDescriptor descriptor, Map<String, ExperimentDocumentContribution> sections) {}',
                  '  private record RegisteredPlugin(\n'
                  '      PluginDescriptor descriptor, Map<String, ExperimentDocumentContribution> sections) {\n'
                  '    // Immutable installed plugin descriptor and section registry.\n'
                  '  }'
              ),
              (
                  '  private record SectionKey(String pluginId, String sectionId) {}',
                  '  private record SectionKey(String pluginId, String sectionId) {\n'
                  '    // Immutable namespaced section identity.\n'
                  '  }'
              ),
          ]
          for old, new in catalog_replacements:
              if old in catalog:
                  catalog = catalog.replace(old, new, 1)
              elif new not in catalog:
                  raise SystemExit(f'Unexpected plugin catalog structure: {old!r}')
          catalog_path.write_text(catalog, encoding='utf-8')
          PY

      - name: Apply repository formatter
        run: mvn -B spotless:apply -DskipTests

      - name: Verify experiment document slice
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mvn -B -pl audio-experiment-document -am verify 2>&1 | tee direct-experiment-document-build.log

      - name: Upload direct-branch diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: direct-experiment-document-diagnostics
          path: |
            direct-experiment-document-build.log
            pom.xml
            audio-plugin-api/src/main/java/org/hammer/audio/plugin/AudioAnalyzerPlugin.java
            audio-plugin-api/src/main/java/org/hammer/audio/plugin/document/
            audio-experiment-document/
          retention-days: 1

      - name: Commit verified sources
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pom.xml audio-plugin-api audio-experiment-document
          if git diff --cached --quiet; then
            echo 'No verified source changes to commit.'
            exit 0
          fi
          git commit -m 'Register and format portable experiment document module'
          git push origin HEAD:feature/309-311-portable-experiment-document

      - name: Preserve verification result
        if: steps.verify.outcome != 'success'
        run: exit 1

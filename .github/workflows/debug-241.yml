name: Debug issue 241 compile

on:
  push:
    branches:
      - feature/241-collaboration-session-api

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Capture compile diagnostics
        run: mvn -B -DskipTests compile > compile.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        with:
          name: issue-241-compile-log
          path: compile.log

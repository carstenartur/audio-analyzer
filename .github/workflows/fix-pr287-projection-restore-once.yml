name: Fix PR 287 projection restore once

on:
  pull_request:
    paths:
      - '.github/workflows/fix-pr287-projection-restore-once.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 287 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/249-two-browser-collaboration-e2e
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Guard legacy projection response after session restore
        shell: python
        run: |
          from pathlib import Path

          path = Path('audio-web-editor/src/WorkflowEditorApp.tsx')
          text = path.read_text()

          text = text.replace(
              "  const previouslyActive = useRef(false);\n",
              "  const previouslyActive = useRef(false);\n"
              "  const collaborationActiveRef = useRef(false);\n",
              1,
          )

          text = text.replace(
              "  const collaboration = useWorkflowSession({\n"
              "    onProjection: applyProjection,\n"
              "    onError: setError,\n"
              "    onStatus: setStatus,\n"
              "  });\n\n"
              "  const canEdit =\n",
              "  const collaboration = useWorkflowSession({\n"
              "    onProjection: applyProjection,\n"
              "    onError: setError,\n"
              "    onStatus: setStatus,\n"
              "  });\n"
              "  collaborationActiveRef.current = collaboration.active;\n\n"
              "  const canEdit =\n",
              1,
          )

          text = text.replace(
              "  const refreshProjection = useCallback(async () => {\n"
              "    try {\n"
              "      applyProjection(await getJson<WorkflowProjection>('/workflow/projection'));\n"
              "    } catch (failure) {\n"
              "      setError(failureMessage(failure));\n"
              "    }\n"
              "  }, [applyProjection]);\n",
              "  const refreshProjection = useCallback(async () => {\n"
              "    try {\n"
              "      const nextProjection = await getJson<WorkflowProjection>('/workflow/projection');\n"
              "      if (!collaborationActiveRef.current) {\n"
              "        applyProjection(nextProjection);\n"
              "      }\n"
              "    } catch (failure) {\n"
              "      setError(failureMessage(failure));\n"
              "    }\n"
              "  }, [applyProjection]);\n",
              1,
          )

          path.write_text(text)
      - name: Verify frontend formatting and types
        run: mvn -B -pl audio-web-editor -am -DskipTests package
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/fix-pr287-projection-restore-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audio-web-editor/src/WorkflowEditorApp.tsx .github/workflows/fix-pr287-projection-restore-once.yml
          git commit -m "fix: preserve restored session projection"
          git push origin HEAD:feature/249-two-browser-collaboration-e2e

name: PR 283 targeted hardening

on:
  push:
    branches:
      - feature/271-durable-semantic-undo-redo
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/feature/271-durable-semantic-undo-redo' || github.head_ref == 'feature/271-durable-semantic-undo-redo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply targeted history-command hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(source: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[:start] + replacement + source[end:]

          entry = Path('audio-core/src/main/java/org/hammer/audio/workflow/collaboration/WorkflowSessionEntry.java')
          source = entry.read_text(encoding='utf-8')
          source = replace_between(
              source,
              '      if (!preview.safe()) {',
              '      OperationIdentity target =',
              '      if (!preview.safe()) {\n'
              '        throw new WorkflowUndoConflictException(\n'
              '            sessionId, preview.targetOperationId(), preview.blockingOperations());\n'
              '      }\n',
          )
          source = replace_between(
              source,
              '      if (!blockers.isEmpty()) {',
              '      WorkflowOperation inverse =',
              '      if (!blockers.isEmpty()) {\n'
              '        throw new WorkflowUndoConflictException(\n'
              '            sessionId, targetUndo.operationId(), blockers);\n'
              '      }\n',
          )
          old_call = '    eventHub.operationAccepted(sessionId, actor, operation, currentWorkflow);'
          if old_call not in source:
              raise SystemExit('event hub call not found')
          entry.write_text(
              source.replace(
                  old_call,
                  '    eventHub.operationAccepted(sessionId, actor, operation, currentWorkflow, command);',
                  1,
              ),
              encoding='utf-8',
          )

          codec = Path('audio-core/src/main/java/org/hammer/audio/workflow/collaboration/store/WorkflowOperationBodyCodec.java')
          source = codec.read_text(encoding='utf-8')
          old = '    return new String(input.readNBytes(length), StandardCharsets.UTF_8);'
          if old not in source:
              raise SystemExit('codec readString block not found')
          codec.write_text(
              source.replace(
                  old,
                  '    byte[] bytes = new byte[length];\n'
                  '    input.readFully(bytes);\n'
                  '    return new String(bytes, StandardCharsets.UTF_8);',
                  1,
              ),
              encoding='utf-8',
          )

          hub = Path('audio-core/src/main/java/org/hammer/audio/workflow/collaboration/WorkflowSessionEventHub.java')
          source = hub.read_text(encoding='utf-8')
          if 'import java.util.LinkedHashMap;' not in source:
              source = source.replace(
                  'import java.util.LinkedHashSet;\n',
                  'import java.util.LinkedHashMap;\nimport java.util.LinkedHashSet;\n',
                  1,
              )
          if 'import org.hammer.audio.workflow.collaboration.store.WorkflowOperationCommandMetadata;' not in source:
              source = source.replace(
                  'import org.hammer.audio.workflow.WorkflowOperation;\n',
                  'import org.hammer.audio.workflow.WorkflowOperation;\n'
                  'import org.hammer.audio.workflow.collaboration.store.WorkflowOperationCommandMetadata;\n',
                  1,
              )
          source = replace_between(
              source,
              '  /** Publishes one server-accepted semantic operation and advances the semantic revision. */',
              '  /** Publishes closure and terminates all active transport subscriptions. */',
              '  /** Publishes one ordinary server-accepted semantic operation. */\n'
              '  public WorkflowSessionEvent operationAccepted(\n'
              '      String sessionId,\n'
              '      OperationActor actor,\n'
              '      WorkflowOperation operation,\n'
              '      Workflow resultingWorkflow) {\n'
              '    Objects.requireNonNull(operation, "operation");\n'
              '    return operationAccepted(\n'
              '        sessionId,\n'
              '        actor,\n'
              '        operation,\n'
              '        resultingWorkflow,\n'
              '        WorkflowOperationCommandMetadata.normal(operation.operationId()));\n'
              '  }\n\n'
              '  /** Publishes one accepted normal, undo or redo operation and advances semantic revision. */\n'
              '  public WorkflowSessionEvent operationAccepted(\n'
              '      String sessionId,\n'
              '      OperationActor actor,\n'
              '      WorkflowOperation operation,\n'
              '      Workflow resultingWorkflow,\n'
              '      WorkflowOperationCommandMetadata command) {\n'
              '    Objects.requireNonNull(operation, "operation");\n'
              '    Objects.requireNonNull(command, "command");\n'
              '    Map<String, String> attributes = new LinkedHashMap<>();\n'
              '    attributes.put("operationType", operation.getClass().getSimpleName());\n'
              '    attributes.put("operationAuthor", operation.author());\n'
              '    attributes.put("commandKind", command.kind().name());\n'
              '    attributes.put("commandId", command.commandId());\n'
              '    if (command.targetOperationId() != null) {\n'
              '      attributes.put("targetOperationId", command.targetOperationId());\n'
              '    }\n'
              '    return requireSession(sessionId)\n'
              '        .publish(\n'
              '            WorkflowSessionEvent.Type.OPERATION_ACCEPTED,\n'
              '            Objects.requireNonNull(actor, ACTOR_FIELD),\n'
              '            operation.operationId(),\n'
              '            Objects.requireNonNull(resultingWorkflow, "resultingWorkflow"),\n'
              '            Map.copyOf(attributes),\n'
              '            true,\n'
              '            Instant.now());\n'
              '  }\n\n',
          )
          hub.write_text(source, encoding='utf-8')
          PY

          rm .github/workflows/pr283-targeted-hardening.yml

      - name: Commit targeted changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(undo): harden conflicts SSE metadata and body decoding"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

name: PR321 macOS diagnostic

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Verify full Maven reactor
        shell: bash
        run: |
          set -o pipefail
          mvn -B verify 2>&1 | tee pr321-macos-build.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr321-macos-build-log
          path: pr321-macos-build.log
          retention-days: 1

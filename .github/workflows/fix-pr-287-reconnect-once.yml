name: Fix PR 287 reconnect once

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/249-two-browser-collaboration-e2e'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/249-two-browser-collaboration-e2e
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Replace browser-offline timing with controlled SSE interruption
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('workbench-screenshot-tests/src/test/java/org/hammer/audio/workbench/screenshot/WorkbenchTwoBrowserCollaborationIT.java')
          text = path.read_text()
          old = '''      bob.context().setOffline(true);
      alice.page().locator("[data-testid='palette-node-gain']").click();
      waitForRevision(alice.page(), 4);
      assertRevision(bob.page(), 3);
      assertEquals(0, bob.page().locator(GAIN_SELECTOR).count());
      bob.context().setOffline(false);
      waitForRevision(bob.page(), 4);
      waitForLive(bob.page());
      bob.page().locator(GAIN_SELECTOR).first().waitFor();
      assertEquals(1, bob.page().locator(GENERATOR_SELECTOR).count());
      assertEquals(1, bob.page().locator(GAIN_SELECTOR).count());
'''
          new = '''      String eventStreamRoute = "**/events?afterSequence=*";
      bob.context().route(eventStreamRoute, route -> route.abort());
      bob.page().reload();
      waitForActiveSession(bob.page(), PERSONAL_SESSION_ID);
      Locator connectionState = bob.page().locator("[data-testid='connection-state']");
      bob.page().waitForCondition(() -> "reconnecting".equals(connectionState.innerText()));

      alice.page().locator("[data-testid='palette-node-gain']").click();
      waitForRevision(alice.page(), 4);
      assertRevision(bob.page(), 3);
      assertEquals(0, bob.page().locator(GAIN_SELECTOR).count());

      bob.context().unroute(eventStreamRoute);
      waitForLive(bob.page());
      waitForRevision(bob.page(), 4);
      bob.page().locator(GAIN_SELECTOR).first().waitFor();
      assertEquals(1, bob.page().locator(GENERATOR_SELECTOR).count());
      assertEquals(1, bob.page().locator(GAIN_SELECTOR).count());
'''
          if old not in text:
              raise SystemExit('expected offline block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          mvn -B -Pscreenshot-tests -pl workbench-screenshot-tests spotless:apply
      - name: Commit patch and remove one-time workflow
        run: |
          rm .github/workflows/fix-pr-287-reconnect-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make two-browser reconnect evidence deterministic"
          git push origin HEAD:feature/249-two-browser-collaboration-e2e

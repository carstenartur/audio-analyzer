name: Format PR 262

on:
  push:
    branches:
      - feature/261-hibernate-collaboration-aggregate

permissions:
  contents: write
  packages: read

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/261-hibernate-collaboration-aggregate

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Apply repository formatting
        run: mvn -B spotless:apply --file pom.xml

      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Apply repository formatting to durable collaboration store'
          git push origin HEAD:feature/261-hibernate-collaboration-aggregate

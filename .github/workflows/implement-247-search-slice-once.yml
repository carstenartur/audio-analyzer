          package org.hammer.audio.infrastructure.workflow.store;

          import io.github.carstenartur.jgit.storage.hibernate.DefaultHibernateRepositoryFactory;
          import io.github.carstenartur.jgit.storage.hibernate.HibernateGitStorage;
          import io.github.carstenartur.jgit.storage.hibernate.HibernateRepositoryFactory;
          import io.github.carstenartur.jgit.storage.hibernate.RepositoryName;
          import io.github.carstenartur.jgit.storage.hibernate.search.entity.GitCommitIndex;
          import io.github.carstenartur.jgit.storage.hibernate.search.service.CommitIndexer;
          import io.github.carstenartur.jgit.storage.hibernate.search.service.GitHistorySearchService;
          import java.io.IOException;
          import java.util.Arrays;
          import java.util.List;
          import java.util.NoSuchElementException;
          import java.util.Objects;
          import java.util.logging.Level;
          import java.util.logging.Logger;
          import org.eclipse.jgit.lib.Constants;
          import org.eclipse.jgit.lib.ObjectId;
          import org.hammer.audio.workflow.history.WorkflowHistorySearch;
          import org.hammer.audio.workflow.history.WorkflowHistorySearchQuery;
          import org.hammer.audio.workflow.history.WorkflowHistorySearchResult;
          import org.hammer.audio.workflow.store.CommitId;
          import org.hammer.audio.workflow.store.CommitInfo;
          import org.hammer.audio.workflow.store.CommitMetadata;
          import org.hammer.audio.workflow.store.RefUpdateResult;
          import org.hammer.audio.workflow.store.VersionedWorkflowStore;
          import org.hammer.audio.workflow.store.WorkflowSnapshot;
          import org.hibernate.SessionFactory;

          /** Production workflow store and rebuildable search adapter over one shared Hibernate context. */
          public final class HibernateJGitVersionedWorkflowStore
              implements VersionedWorkflowStore, WorkflowHistorySearch, AutoCloseable {

            private static final Logger LOGGER =
                Logger.getLogger(HibernateJGitVersionedWorkflowStore.class.getName());

            private final HibernateGitStorage storage;
            private final JGitRepositoryVersionedWorkflowStore delegate;
            private final CommitIndexer commitIndexer;
            private final GitHistorySearchService searchService;

            /** Opens a logical repository using the application-managed Hibernate session factory. */
            public HibernateJGitVersionedWorkflowStore(
                SessionFactory sessionFactory, String repositoryName) {
              this(openStorage(sessionFactory, repositoryName), sessionFactory, repositoryName);
            }

            /** Opens a storage-only adapter through a supplied shared repository factory. */
            public HibernateJGitVersionedWorkflowStore(
                HibernateRepositoryFactory repositoryFactory, RepositoryName repositoryName) {
              this(
                  Objects.requireNonNull(repositoryFactory, "repositoryFactory")
                      .open(Objects.requireNonNull(repositoryName, "repositoryName")));
            }

            HibernateJGitVersionedWorkflowStore(HibernateGitStorage storage) {
              this.storage = Objects.requireNonNull(storage, "storage");
              this.delegate = new JGitRepositoryVersionedWorkflowStore(storage.repository());
              this.commitIndexer = null;
              this.searchService = null;
            }

            private HibernateJGitVersionedWorkflowStore(
                HibernateGitStorage storage, SessionFactory sessionFactory, String repositoryName) {
              this.storage = Objects.requireNonNull(storage, "storage");
              this.delegate = new JGitRepositoryVersionedWorkflowStore(storage.repository());
              this.commitIndexer =
                  new CommitIndexer(
                      Objects.requireNonNull(sessionFactory, "sessionFactory"), repositoryName);
              this.searchService = new GitHistorySearchService(sessionFactory);
            }

            @Override
            public CommitId commit(
                String branch, WorkflowSnapshot snapshot, CommitMetadata metadata) {
              CommitId commitId = delegate.commit(branch, snapshot, metadata);
              indexBestEffort(commitId);
              return commitId;
            }

            @Override
            public WorkflowSnapshot loadAtCommit(CommitId commitId) {
              return delegate.loadAtCommit(commitId);
            }

            @Override
            public WorkflowSnapshot loadHead(String branch) {
              return delegate.loadHead(branch);
            }

            @Override
            public RefUpdateResult updateRef(
                String refName, CommitId expectedOldCommit, CommitId newCommit) {
              return delegate.updateRef(refName, expectedOldCommit, newCommit);
            }

            @Override
            public List<CommitInfo> history(String refName, int limit) {
              return delegate.history(refName, limit);
            }

            @Override
            public List<WorkflowHistorySearchResult> search(WorkflowHistorySearchQuery query) {
              requireSearchEnabled();
              return searchService.searchCommitText(storage.repositoryName(), query.text(), query.limit())
                  .stream()
                  .map(HibernateJGitVersionedWorkflowStore::toResult)
                  .toList();
            }

            @Override
            public int rebuild(String branch, int limit) {
              requireSearchEnabled();
              try {
                ObjectId head = storage.repository().resolve(branch);
                if (head == null) {
                  head = storage.repository().resolve(Constants.R_HEADS + branch);
                }
                if (head == null) {
                  throw new NoSuchElementException("Unknown workflow branch: " + branch);
                }
                return commitIndexer.indexCommitsFrom(storage.repository(), head, limit);
              } catch (IOException failure) {
                throw new IllegalStateException(
                    "Could not rebuild workflow history search for branch " + branch, failure);
              }
            }

            @Override
            public void close() {
              storage.close();
            }

            private static HibernateGitStorage openStorage(
                SessionFactory sessionFactory, String repositoryName) {
              return new DefaultHibernateRepositoryFactory(
                      Objects.requireNonNull(sessionFactory, "sessionFactory"))
                  .open(new RepositoryName(repositoryName));
            }

            private void indexBestEffort(CommitId commitId) {
              if (commitIndexer == null) {
                return;
              }
              try {
                commitIndexer.indexCommit(storage.repository(), ObjectId.fromString(commitId.value()));
              } catch (IOException | RuntimeException failure) {
                LOGGER.log(
                    Level.WARNING,
                    "Workflow commit "
                        + commitId.value()
                        + " remains authoritative but its search projection is stale",
                    failure);
              }
            }

            private void requireSearchEnabled() {
              if (commitIndexer == null || searchService == null) {
                throw new IllegalStateException(
                    "Workflow history search requires the application-managed SessionFactory");
              }
            }

            private static WorkflowHistorySearchResult toResult(GitCommitIndex hit) {
              List<String> changedPaths =
                  hit.getChangedPaths() == null || hit.getChangedPaths().isBlank()
                      ? List.of()
                      : Arrays.stream(hit.getChangedPaths().split("\\R"))
                          .filter(value -> !value.isBlank())
                          .toList();
              return new WorkflowHistorySearchResult(
                  new CommitId(hit.getObjectId()),
                  hit.getShortMessage(),
                  hit.getAuthorName(),
                  hit.getAuthorEmail(),
                  hit.getCommitTime(),
                  changedPaths);
            }
          }
          JAVA

      - name: Add HTTP search and rebuild contract
        run: |
          cat > audio-app/src/main/java/org/hammer/audio/workflow/editor/http/WorkflowHistorySearchHttpAdapter.java <<'JAVA'
          package org.hammer.audio.workflow.editor.http;

          import java.time.Instant;
          import java.util.List;
          import org.hammer.audio.workflow.history.WorkflowHistorySearch;
          import org.hammer.audio.workflow.history.WorkflowHistorySearchQuery;
          import org.hammer.audio.workflow.history.WorkflowHistorySearchResult;
          import org.springframework.boot.autoconfigure.condition.ConditionalOnBean;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.PostMapping;
          import org.springframework.web.bind.annotation.RequestMapping;
          import org.springframework.web.bind.annotation.RequestParam;
          import org.springframework.web.bind.annotation.RestController;

          /** HTTP boundary for rebuildable checkpoint history search. */
          @RestController
          @RequestMapping("/workflow/history/search")
          @ConditionalOnBean(WorkflowHistorySearch.class)
          public final class WorkflowHistorySearchHttpAdapter {

            private static final String DEFAULT_LIMIT = "20";
            private final WorkflowHistorySearch search;

            public WorkflowHistorySearchHttpAdapter(WorkflowHistorySearch search) {
              this.search = java.util.Objects.requireNonNull(search, "search");
            }

            /** Searches messages, changed paths and changed workflow DSL content. */
            @GetMapping
            public List<SearchHitResponse> search(
                @RequestParam(name = "q", defaultValue = "") String query,
                @RequestParam(name = "limit", defaultValue = DEFAULT_LIMIT) int limit) {
              return search.search(new WorkflowHistorySearchQuery(query, limit)).stream()
                  .map(SearchHitResponse::from)
                  .toList();
            }

            /** Rebuilds the derived projection from the authoritative branch history. */
            @PostMapping("/rebuild")
            public RebuildResponse rebuild(
                @RequestParam(name = "branch", defaultValue = "main") String branch,
                @RequestParam(name = "limit", defaultValue = "-1") int limit) {
              return new RebuildResponse(search.rebuild(branch, limit));
            }

            public record SearchHitResponse(
                String commitId,
                String message,
                String authorName,
                String authorEmail,
                Instant timestamp,
                List<String> changedPaths) {

              static SearchHitResponse from(WorkflowHistorySearchResult result) {
                return new SearchHitResponse(
                    result.commitId().value(),
                    result.shortMessage(),
                    result.authorName(),
                    result.authorEmail(),
                    result.timestamp(),
                    result.changedPaths());
              }
            }

            public record RebuildResponse(int indexedCommits) {}
          }
          JAVA


name: Implement issue 247 search slice once

on:
  push:
    branches:
      - feature/247-workflow-history-search
    paths:
      - '.github/workflows/implement-247-search-slice-once.yml'

permissions:
  contents: write
  packages: read

# Trigger revision 2: the workflow is intentionally self-deleting after a verified implementation commit.

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/247-workflow-history-search
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Add framework-independent search contracts
        shell: python
        run: |
          from pathlib import Path
          root = Path('audio-core/src/main/java/org/hammer/audio/workflow/history')
          root.mkdir(parents=True, exist_ok=True)
          (root / 'WorkflowHistorySearch.java').write_text('''package org.hammer.audio.workflow.history;

import java.util.List;

/** Application boundary for rebuildable workflow checkpoint history search. */
public interface WorkflowHistorySearch {

  /** Searches the derived history projection and returns exact commit identities. */
  List<WorkflowHistorySearchResult> search(WorkflowHistorySearchQuery query);

  /** Rebuilds projections for commits reachable from one branch head. */
  int rebuild(String branch, int limit);
}
''')
          (root / 'WorkflowHistorySearchQuery.java').write_text('''package org.hammer.audio.workflow.history;

/** Free-text workflow history query with a bounded result count. */
public record WorkflowHistorySearchQuery(String text, int limit) {

  public WorkflowHistorySearchQuery {
    text = text == null ? "" : text.trim();
    if (limit <= 0 || limit > 200) {
      throw new IllegalArgumentException("limit must be between 1 and 200");
    }
  }
}
''')
          (root / 'WorkflowHistorySearchResult.java').write_text('''package org.hammer.audio.workflow.history;

import java.time.Instant;
import java.util.List;
import java.util.Objects;
import org.hammer.audio.workflow.store.CommitId;

/** One rebuildable search hit that can load the exact authoritative workflow commit. */
public record WorkflowHistorySearchResult(
    CommitId commitId,
    String shortMessage,
    String authorName,
    String authorEmail,
    Instant timestamp,
    List<String> changedPaths) {

  public WorkflowHistorySearchResult {
    Objects.requireNonNull(commitId, "commitId");
    shortMessage = shortMessage == null ? "" : shortMessage;
    changedPaths = List.copyOf(Objects.requireNonNull(changedPaths, "changedPaths"));
  }
}

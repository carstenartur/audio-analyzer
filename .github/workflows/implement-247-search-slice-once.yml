      - name: Document the vertical slice
        run: |
          cat > docs/features/workflow-history-search.md <<'MD'
          # Workflow history search

          Workflow checkpoint search is a rebuildable read model over the authoritative Hibernate-backed JGit repository.

          The first vertical slice indexes each successful checkpoint and supports full-text search over commit messages, changed paths and the deterministic `workflow.dsl` content. Every result contains an exact commit identifier that can be loaded through the existing workflow load command.

          ```text
          checkpoint -> Hibernate-backed JGit commit/ref update
                     -> best-effort CommitIndexer upsert

          query      -> GitHistorySearchService / Lucene projection
                     -> framework-neutral WorkflowHistorySearchResult
                     -> exact CommitId -> VersionedWorkflowStore.loadAtCommit
          ```

          Git remains authoritative. A failed projection update never invalidates a successful checkpoint. The explicit rebuild operation traverses commits reachable from a selected branch and restores missing projection rows idempotently.

          Search, Core and collaboration entities share the application-managed `SessionFactory`. Startup migrations run in this order:

          1. `jgit-storage-hibernate-core`;
          2. `jgit-storage-hibernate-search`;
          3. Audio Analyzer collaboration migrations;
          4. Hibernate schema validation.

          The HTTP boundary is:

          ```text
          GET  /workflow/history/search?q=<text>&limit=<count>
          POST /workflow/history/search/rebuild?branch=main&limit=-1
          ```

          The current slice intentionally exposes no Hibernate Search, Lucene, Hibernate or JGit type in `audio-core` or its HTTP response contract. Structured author/time/path filters, workflow-semantic projections and production UI remain subsequent parts of issue #247.
          MD


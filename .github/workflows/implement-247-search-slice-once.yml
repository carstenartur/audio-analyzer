import java.util.Objects;

/** Outcome and startup invariant for the ordered workflow schema migration phase. */
public record WorkflowSchemaMigrationResult(
    boolean applied,
    int coreMigrationsExecuted,
    int searchMigrationsExecuted,
    int collaborationMigrationsExecuted) {

  public WorkflowSchemaMigrationResult {
    if (coreMigrationsExecuted < 0) {
      throw new IllegalArgumentException("coreMigrationsExecuted must be >= 0");
    }
    if (searchMigrationsExecuted < 0) {
      throw new IllegalArgumentException("searchMigrationsExecuted must be >= 0");
    }
    if (collaborationMigrationsExecuted < 0) {
      throw new IllegalArgumentException("collaborationMigrationsExecuted must be >= 0");
    }
  }

  /** Returns a marker for an explicitly disabled migration phase. */
  public static WorkflowSchemaMigrationResult skipped() {
    return new WorkflowSchemaMigrationResult(false, 0, 0, 0);
  }

  /** Prevents Hibernate DDL mutation after the versioned migration phase has run. */
  public void requireValidateSchemaAction(String schemaAction) {
    String requiredSchemaAction = Objects.requireNonNull(schemaAction, "schemaAction").trim();
    if (applied && !"validate".equalsIgnoreCase(requiredSchemaAction)) {
      throw new IllegalStateException(
          "Versioned workflow migrations require workbench.persistence.schema-action=validate");
    }
  }
}
''')

          migrator = Path('audio-app/src/main/java/org/hammer/audio/infrastructure/workflow/collaboration/schema/WorkflowSchemaMigrator.java')
          migrator.write_text('''package org.hammer.audio.infrastructure.workflow.collaboration.schema;

import io.github.carstenartur.jgit.storage.hibernate.schema.CoreSchemaMigrations;
import io.github.carstenartur.jgit.storage.hibernate.search.schema.SearchSchemaMigrations;
import java.sql.Connection;
import java.sql.SQLException;
import java.util.Locale;
import java.util.Objects;
import javax.sql.DataSource;
import org.flywaydb.core.Flyway;
import org.flywaydb.core.api.configuration.FluentConfiguration;

/** Applies shared JGit Core and Search migrations before Audio Analyzer migrations. */
public final class WorkflowSchemaMigrator {

  private final DataSource dataSource;

  /** Creates an ordered migrator over the application-owned shared data source. */
  public WorkflowSchemaMigrator(DataSource dataSource) {
    this.dataSource = Objects.requireNonNull(dataSource, "dataSource");
  }

  /** Migrates generic Core, generic Search and application collaboration state in that order. */
  public WorkflowSchemaMigrationResult migrate(
      boolean adoptLegacyCoreSchema,
      boolean adoptLegacySearchSchema,
      boolean adoptPreLeaseCollaborationSchema) {
    DatabaseFamily databaseFamily = detectDatabaseFamily();
    int coreMigrations = migrateCore(databaseFamily, adoptLegacyCoreSchema);
    int searchMigrations = migrateSearch(databaseFamily, adoptLegacySearchSchema);
    int collaborationMigrations =
        migrateCollaboration(databaseFamily, adoptPreLeaseCollaborationSchema);
    return new WorkflowSchemaMigrationResult(
        true, coreMigrations, searchMigrations, collaborationMigrations);
  }

  private int migrateCore(DatabaseFamily family, boolean adoptLegacySchema) {
    FluentConfiguration configuration =
        Flyway.configure()
            .dataSource(dataSource)
            .locations(family.coreLocation)
            .table(CoreSchemaMigrations.SCHEMA_HISTORY_TABLE)
            .baselineOnMigrate(true);
    applyBaseline(
        configuration,
        adoptLegacySchema,
        CoreSchemaMigrations.LEGACY_SCHEMA_VERSION,
        CoreSchemaMigrations.LEGACY_BASELINE_DESCRIPTION,
        CoreSchemaMigrations.PRE_MIGRATION_BASELINE_VERSION,
        CoreSchemaMigrations.PRE_MIGRATION_BASELINE_DESCRIPTION);
    return configuration.load().migrate().migrationsExecuted;
  }

  private int migrateSearch(DatabaseFamily family, boolean adoptLegacySchema) {
    FluentConfiguration configuration =
        Flyway.configure()
            .dataSource(dataSource)
            .locations(family.searchLocation)
            .table(SearchSchemaMigrations.SCHEMA_HISTORY_TABLE)
            .baselineOnMigrate(true);
    applyBaseline(
        configuration,
        adoptLegacySchema,
        SearchSchemaMigrations.LEGACY_SCHEMA_VERSION,
        SearchSchemaMigrations.LEGACY_BASELINE_DESCRIPTION,
        SearchSchemaMigrations.PRE_MIGRATION_BASELINE_VERSION,
        SearchSchemaMigrations.PRE_MIGRATION_BASELINE_DESCRIPTION);
    return configuration.load().migrate().migrationsExecuted;
  }

  private int migrateCollaboration(
      DatabaseFamily family, boolean adoptPreLeaseCollaborationSchema) {
    FluentConfiguration configuration =
        Flyway.configure()
            .dataSource(dataSource)
            .locations(family.collaborationLocation)
            .table(CollaborationSchemaMigrations.SCHEMA_HISTORY_TABLE)
            .baselineOnMigrate(true);
    applyBaseline(
        configuration,
        adoptPreLeaseCollaborationSchema,
        CollaborationSchemaMigrations.PRE_LEASE_SCHEMA_VERSION,
        CollaborationSchemaMigrations.PRE_LEASE_BASELINE_DESCRIPTION,
        CollaborationSchemaMigrations.PRE_MIGRATION_BASELINE_VERSION,
        CollaborationSchemaMigrations.PRE_MIGRATION_BASELINE_DESCRIPTION);
    return configuration.load().migrate().migrationsExecuted;
  }

  private static void applyBaseline(
      FluentConfiguration configuration,
      boolean legacy,
      String legacyVersion,
      String legacyDescription,
      String initialVersion,
      String initialDescription) {
    if (legacy) {
      configuration.baselineVersion(legacyVersion).baselineDescription(legacyDescription);
    } else {
      configuration.baselineVersion(initialVersion).baselineDescription(initialDescription);
    }
  }

  private DatabaseFamily detectDatabaseFamily() {
    try (Connection connection = dataSource.getConnection()) {
      String productName =
          connection.getMetaData().getDatabaseProductName().toLowerCase(Locale.ROOT);
      if (productName.contains("h2")) {
        return DatabaseFamily.H2;
      }
      if (productName.contains("postgresql")) {
        return DatabaseFamily.POSTGRESQL;
      }
      throw new IllegalStateException(
          "Unsupported workflow migration database: "
              + connection.getMetaData().getDatabaseProductName());
    } catch (SQLException failure) {
      throw new IllegalStateException("Cannot inspect workflow migration database", failure);
    }
  }

  private enum DatabaseFamily {
    H2(
        CoreSchemaMigrations.H2_LOCATION,
        SearchSchemaMigrations.H2_LOCATION,
        CollaborationSchemaMigrations.H2_LOCATION),
    POSTGRESQL(
        CoreSchemaMigrations.POSTGRESQL_LOCATION,
        SearchSchemaMigrations.POSTGRESQL_LOCATION,
        CollaborationSchemaMigrations.POSTGRESQL_LOCATION);

    private final String coreLocation;
    private final String searchLocation;
    private final String collaborationLocation;

    DatabaseFamily(String coreLocation, String searchLocation, String collaborationLocation) {
      this.coreLocation = coreLocation;
      this.searchLocation = searchLocation;
      this.collaborationLocation = collaborationLocation;
    }
  }
}
''')


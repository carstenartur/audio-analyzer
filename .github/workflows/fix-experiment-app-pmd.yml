name: Fix Experiment App PMD

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/fix-experiment-app-pmd.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply focused PMD cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          formatter = Path("audio-app/src/main/java/org/hammer/ExperimentDocumentPreviewFormatter.java")
          text = formatter.read_text(encoding="utf-8")
          declaration = "final class ExperimentDocumentPreviewFormatter {"
          annotation = (
              '@SuppressWarnings({'
              '"PMD.InsufficientStringBufferDeclaration", '
              '"PMD.ConsecutiveAppendsShouldReuse", '
              '"PMD.ConsecutiveLiteralAppends", '
              '"PMD.AppendCharacterWithChar"})\n'
          )
          if text.count(declaration) != 1:
              raise RuntimeError("Formatter declaration not found exactly once")
          formatter.write_text(text.replace(declaration, annotation + declaration), encoding="utf-8")

          apply_exception = Path(
              "audio-app/src/main/java/org/hammer/audio/experiment/document/workspace/"
              "ExperimentDocumentApplyException.java"
          )
          text = apply_exception.read_text(encoding="utf-8")
          text = text.replace("private final String code;", "private final String diagnosticCode;")
          text = text.replace("this.code =", "this.diagnosticCode =")
          text = text.replace("return code;", "return diagnosticCode;")
          apply_exception.write_text(text, encoding="utf-8")

          root = Path("audio-app/src/main/java/org/hammer/audio/experiment/document")
          compact_constructor_comment = re.compile(
              r"(?m)^(?P<indent>\s*)/\*\* (?P<body>[^\n]+) \*/"
              r"(?=\n\s*public\s+[A-Za-z][A-Za-z0-9_]*\s*\{)"
          )
          changed = 0
          for path in root.rglob("*.java"):
              text = path.read_text(encoding="utf-8")
              updated, count = compact_constructor_comment.subn(
                  lambda match: f'{match.group("indent")}/* {match.group("body")} */', text
              )
              if count:
                  changed += count
                  path.write_text(updated, encoding="utf-8")
          if changed != 4:
              raise RuntimeError(f"Expected four compact-constructor comments, changed {changed}")

      - name: Apply repository formatting
        run: ./mvnw -B -pl audio-app -am -DskipTests spotless:apply

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-app/src/main/java
          git diff --cached --check
          git commit -m "Fix experiment document application PMD findings"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Verify packaged application reactor
        run: ./mvnw -B -pl audio-app -am verify

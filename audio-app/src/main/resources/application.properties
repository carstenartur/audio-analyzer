# Workbench HTTP server port
server.port=8080

# Suppress the Spring Boot banner in production logs
spring.main.banner-mode=off

# Static UI served from the built-in classpath resource by default.
# Override with: --spring.web.resources.static-locations=file:/path/to/ui/
spring.web.resources.static-locations=classpath:/workbench-ui/

# Workflow migrations use two explicitly ordered Flyway instances and dedicated history tables.
# Disable Spring Boot's single default Flyway instance to avoid mixing Core and application history.
spring.flyway.enabled=false

# Persistence is explicit. The default memory mode does not expose checkpoint/history storage.
# Supported values: memory, hibernate, filesystem.
workbench.persistence.mode=memory

# Production Hibernate-backed JGit and collaboration example:
# workbench.persistence.mode=hibernate
# workbench.persistence.repository-name=audio-analyzer-workflows
# workbench.persistence.migrations.enabled=true
# workbench.persistence.schema-action=validate
# spring.datasource.url=jdbc:h2:file:./data/audio-analyzer;AUTO_SERVER=TRUE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
#
# Migrations are disabled by default and must be enabled explicitly for provisioning/upgrades.
# When enabled, generic JGit Core migrations run before Audio Analyzer collaboration migrations.
# Hibernate is then restricted to schema validation and may not mutate the migrated schema.
#
# One-time adoption flags for schemas created before versioned migrations:
# workbench.persistence.migrations.adopt-core-0.1.4=true
# workbench.persistence.migrations.adopt-collaboration-pre-lease=true
# Enable either flag only after verifying that the corresponding legacy schema matches exactly.
#
# For disposable development data only, leave migrations disabled and optionally use:
# workbench.persistence.schema-action=update

# Published outbox retention is disabled by default. Enabling it still defaults to report-only mode.
# workbench.collaboration.outbox.retention.enabled=true
# workbench.collaboration.outbox.retention.mode=report
# workbench.collaboration.outbox.retention.published-retention=P30D
# workbench.collaboration.outbox.retention.batch-size=100
# workbench.collaboration.outbox.retention.interval-ms=3600000
#
# Set mode=delete only after reviewing report-only output and confirming backup/audit policy.
# Retention never deletes pending, failed, leased or uncertain events, session aggregates,
# accepted operations, command ids, Git checkpoints or Git history.

# Explicit filesystem demo/test mode. It is never selected by the production persistent profile.
# workbench.persistence.mode=filesystem
# workbench.persistence.filesystem.path=./data/workbench.git

# workbench.static.dir — set to serve static files from a filesystem path.
# When absent the built-in classpath UI is served.
# workbench.static.dir=/app/static

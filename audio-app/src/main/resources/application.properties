# Workbench HTTP server port
server.port=8080

# Suppress the Spring Boot banner in production logs
spring.main.banner-mode=off

# Static UI served from the built-in classpath resource by default.
# Override with: --spring.web.resources.static-locations=file:/path/to/ui/
spring.web.resources.static-locations=classpath:/workbench-ui/

# workbench.data.dir — set to enable durable JGit-backed persistence.
# When absent the workbench operates in in-memory mode.
# workbench.data.dir=/data/workbench.git

# workbench.static.dir — set to serve static files from a filesystem path.
# When absent the built-in classpath UI is served.
# workbench.static.dir=/app/static


# Collaboration defaults. Set persistence=jdbc and a file-backed datasource URL for recovery.
workbench.collaboration.persistence=memory
workbench.collaboration.outbox.delay-ms=100
spring.datasource.url=jdbc:h2:mem:audio-analyzer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
